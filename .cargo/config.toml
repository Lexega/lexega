# Linker stack-size flags set the main-thread stack of every binary built
# here, `lexega` included: a thread that parses needs 8 MiB of stack, and
# Windows gives a main thread 1 MiB by default. RUST_MIN_STACK sets
# worker-thread stacks (the test harness), for the deep-nesting fixtures.

[env]
# 12 MiB
RUST_MIN_STACK = "12582912"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-args=/STACK:8388608"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,-z,stack-size=8388608"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,-z,stack-size=8388608"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-stack_size,0x800000"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-stack_size,0x800000"]
