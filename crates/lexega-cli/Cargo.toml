[package]
name = "lexega-cli"
# Released in lockstep with the Lexega engine; the two version numbers match.
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
description = "Command-line interface for the Lexega SQL governance recognition engine: format, analyze and review SQL before it runs"
license = "BUSL-1.1"
repository = "https://github.com/Lexega/lexega"
homepage = "https://lexega.com"
keywords = ["sql", "governance", "static-analysis", "cli", "linter"]
categories = ["command-line-utilities", "development-tools"]
# Published from the public mirror, never from this tree.
publish = false

[[bin]]
name = "lexega"
path = "src/main.rs"

[dependencies]
lexega-core = { path = "../lexega-core", version = "2.0.0", features = ["cli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
toml = "0.8"
dunce = "1.0"
walkdir = "2.5"
glob = "0.3"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.8"
