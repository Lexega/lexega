[package]
name = "lexega-syntax-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lexega-syntax]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_tokenize"
path = "fuzz_targets/fuzz_tokenize.rs"
doc = false

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
doc = false

[[bin]]
name = "fuzz_format"
path = "fuzz_targets/fuzz_format.rs"
doc = false

[[bin]]
name = "fuzz_format_roundtrip"
path = "fuzz_targets/fuzz_format_roundtrip.rs"
doc = false

[[bin]]
name = "fuzz_dialect"
path = "fuzz_targets/fuzz_dialect.rs"
doc = false
