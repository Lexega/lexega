[package]
name = "lexega-syntax"
# Released in lockstep with the Lexega engine; the two version numbers match.
version = "2.0.0"
edition = "2021"
rust-version = "1.91"
description = "SQL lexer, parser, AST/CST and byte-exact formatter for Snowflake, T-SQL, BigQuery, PostgreSQL, Redshift, Databricks and MySQL"
license = "BUSL-1.1"
readme = "README.md"
repository = "https://github.com/Lexega/lexega"
homepage = "https://lexega.com"
keywords = ["sql", "parser", "formatter", "snowflake", "tsql"]
categories = ["parser-implementations", "development-tools"]
# Published from the public mirror, never from this tree.
publish = false

[features]
schema = ["schemars"]

[dependencies]
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
schemars = { version = "0.8", features = ["chrono"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "formatter_bench"
harness = false

[[bench]]
name = "alias_alignment_bench"
harness = false

[[bench]]
name = "deep_nesting_bench"
harness = false

[lints.clippy]
# Parser and formatter functions take one argument per clause or span they
# place.
too_many_arguments = "allow"
# AST enums carry their payloads inline; a variant is boxed where its size is
# shown to matter.
large_enum_variant = "allow"
