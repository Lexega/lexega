  - id: INFO-COMMENT-CHG
    risk_level: info
    message: "COMMENT ON modifies object metadata. Positive governance signal — improves documentation."
    triggers:
      all_of:
        - kind: comment

  - id: INFO-DBX-CAT-COMMENT-CHG
    risk_level: info
    message: "COMMENT ON CATALOG modifies Unity Catalog metadata. Positive governance signal — improves catalog documentation and discoverability."
    triggers:
      all_of:
        - kind: comment
        - comment.target_kind: catalog

  - id: INFO-DBX-VOL-COMMENT-CHG
    risk_level: info
    message: "COMMENT ON VOLUME modifies Unity Catalog volume metadata. Positive governance signal — improves storage documentation."
    triggers:
      all_of:
        - kind: comment
        - comment.target_kind: volume

  - id: INFO-DBX-CONN-COMMENT-CHG
    risk_level: info
    message: "COMMENT ON CONNECTION modifies Unity Catalog connection metadata. Positive governance signal — documents external data source purpose and ownership."
    triggers:
      all_of:
        - kind: comment
        - comment.target_kind: connection

  - id: INFO-MSSQL-EXEC-PROC
    risk_level: info
    message: "Stored procedure executed via EXEC. Audit trail: verify the procedure exists and caller has EXECUTE permission."
    triggers:
      all_of:
        - kind: mssql_exec

  - id: MSSQL-XP-CMDSHELL
    risk_level: critical
    message: "EXEC xp_cmdshell invokes the OS shell from SQL Server. xp_cmdshell runs arbitrary shell commands with the SQL Server service account's privileges (often LocalSystem or a domain account) and is a primary lateral-movement vector after a SQL injection compromise. Disable xp_cmdshell unless absolutely required; if required, restrict to sysadmin only."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: xp_cmdshell

  - id: MSSQL-SPCONFIG-XPCMDSHELL
    risk_level: critical
    message: "sp_configure invoked with 'xp_cmdshell' option. This is the prerequisite to enabling xp_cmdshell at the server level. After this call + RECONFIGURE, EXEC xp_cmdshell can run OS commands. Verify intent and audit the surrounding context."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: xp_cmdshell

  - id: MSSQL-LINKEDSRV-ADD
    risk_level: high
    message: "sp_addlinkedserver registers a linked server. A linked server is a persistent connection to a remote data source that distributed queries (four-part names, OPENQUERY, EXEC ... AT) run against. It widens the data-exfiltration and lateral-movement surface and, combined with sp_addlinkedsrvlogin credential mappings, can let any caller reach the remote server. Review the provider, data source, and who can use it."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_addlinkedserver

  - id: MSSQL-LINKEDSRV-LOGIN
    risk_level: high
    message: "sp_addlinkedsrvlogin maps a local login to a remote login on a linked server. This stores cross-server credentials and governs who can execute distributed queries against the remote source. Verify the mapping (especially @useself = 'False' with an explicit remote login) and that the remote account is least-privilege."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_addlinkedsrvlogin

  - id: MSSQL-LINKEDSRV-LOGIN-CRED
    risk_level: critical
    message: "sp_addlinkedsrvlogin called with a literal @rmtpassword. A remote-server password is hard-coded in the SQL text, exposing it to anyone who can read the script, query history, or audit logs, and it reaches an external server. Use integrated security (@useself = 'True') or a credential object instead of an inline password."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_addlinkedsrvlogin
        - mssql_exec.args:
            exists:
              all_of:
                - name: rmtpassword
                - value_kind: string_literal

  - id: MSSQL-LINKEDSRV-READ
    risk_level: medium
    message: "Distributed query against a linked server. A four-part name (`server.database.schema.object`) reads or writes data on a remote SQL Server over a linked-server connection — data crosses a server boundary and depends on the linked server's stored credentials and trust. Verify the cross-server access is intended and the remote account is least-privilege."
    triggers:
      any_of:
        - query.reads_table:
            exists:
              table.server:
                exists: true
        - query.writes_table:
            exists:
              table.server:
                exists: true

  - id: MSSQL-AGENTJOB-CMDEXEC
    risk_level: critical
    message: "SQL Agent job step created with @subsystem = 'CmdExec'. A CmdExec step runs an arbitrary operating-system command under the SQL Server Agent service account (or a proxy), giving SQL-level access an OS-command channel that bypasses xp_cmdshell controls. It is a primary persistence and lateral-movement vector. Verify the command, the proxy account, and who can create or run the job."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_add_jobstep
        - mssql_exec.args:
            exists:
              all_of:
                - name: subsystem
                - value_literal: cmdexec

  - id: MSSQL-SRVROLE-MEMBER-ADD
    risk_level: high
    message: "A login was added to a fixed server role (ALTER SERVER ROLE ... ADD MEMBER or sp_addsrvrolemember). Server-role membership grants instance-wide capabilities to the login and is a standing privilege change, not a one-time action. Verify the login requires the role."
    triggers:
      any_of:
        - all_of:
            - kind: mssql_exec
            - mssql_exec.procedure_name: sp_addsrvrolemember
        - all_of:
            - kind: alter_role
            - ddl.principal.server_scope: true
            - ddl.principal.membership.action: add_member

  - id: MSSQL-SRVROLE-SYSADMIN
    risk_level: critical
    message: "A login was added to sysadmin or securityadmin. sysadmin grants unrestricted control of the SQL Server instance; securityadmin can grant itself sysadmin-equivalent access. This is a full-instance privilege escalation. Verify the login, the requester, and the change ticket."
    triggers:
      any_of:
        - all_of:
            - kind: mssql_exec
            - mssql_exec.procedure_name: sp_addsrvrolemember
            - mssql_exec.args:
                exists:
                  value_literal:
                    in: [sysadmin, securityadmin]
        - all_of:
            - kind: alter_role
            - ddl.principal.server_scope: true
            - ddl.principal.membership.action: add_member
            - ddl.target.name.name.normalized:
                in: [SYSADMIN, SECURITYADMIN]

  - id: MSSQL-ROLE-MEMBER-ADD
    risk_level: medium
    message: "A principal was added to a database role (ALTER ROLE ... ADD MEMBER or sp_addrolemember). Role membership is a standing access change that persists beyond this script. Verify the principal requires the role."
    triggers:
      any_of:
        - all_of:
            - kind: mssql_exec
            - mssql_exec.procedure_name: sp_addrolemember
        - all_of:
            - kind: alter_role
            - ddl.principal.server_scope: false
            - ddl.principal.membership.action: add_member

  - id: MSSQL-DBROLE-ADMIN-ADD
    risk_level: high
    message: "A principal was added to a privileged fixed database role (db_owner, db_securityadmin, db_accessadmin, or db_ddladmin). These roles control permissions, access, or schema for the entire database — membership is a database-level privilege escalation. Verify the principal and the justification."
    triggers:
      any_of:
        - all_of:
            - kind: mssql_exec
            - mssql_exec.procedure_name: sp_addrolemember
            - mssql_exec.args:
                exists:
                  value_literal:
                    in: [db_owner, db_securityadmin, db_accessadmin, db_ddladmin]
        - all_of:
            - kind: alter_role
            - ddl.principal.server_scope: false
            - ddl.principal.membership.action: add_member
            - ddl.target.name.name.normalized:
                in: [DB_OWNER, DB_SECURITYADMIN, DB_ACCESSADMIN, DB_DDLADMIN]

  - id: MSSQL-ROLE-MEMBER-DROP
    risk_level: medium
    message: "Role membership removed (ALTER [SERVER] ROLE ... DROP MEMBER or sp_droprolemember / sp_dropsrvrolemember). Removing membership can silently revoke access that applications or operators depend on, and in incident scenarios is also used to lock out responders. Verify the removal is intended."
    triggers:
      any_of:
        - all_of:
            - kind: mssql_exec
            - mssql_exec.procedure_name:
                in: [sp_droprolemember, sp_dropsrvrolemember]
        - all_of:
            - kind: alter_role
            - ddl.principal.membership.action: drop_member

  - id: MSSQL-OWNER-XFER
    risk_level: high
    message: "ALTER AUTHORIZATION transfers ownership of a securable to another principal. The new owner gains full control of the object, including the right to grant access to others. Verify approval and ensure proper access controls remain in place."
    triggers:
      all_of:
        - kind: alter_authorization

  - id: MSSQL-LOGIN-DISABLE
    risk_level: medium
    message: "ALTER LOGIN ... DISABLE blocks a server login from connecting. Disabling logins is a routine hardening action but also appears in incident lockouts and sabotage. Verify the login is intended to lose access and that no application depends on it."
    triggers:
      all_of:
        - kind: mssql_alter_login
        - ddl.principal.enabled_state: disable

  - id: MSSQL-LOGIN-ENABLE
    risk_level: medium
    message: "ALTER LOGIN ... ENABLE re-activates a server login. Re-enabling a dormant or previously disabled account restores its access; dormant-account re-activation is a common persistence vector. Verify the business need."
    triggers:
      all_of:
        - kind: mssql_alter_login
        - ddl.principal.enabled_state: enable

  - id: MSSQL-LOGIN-PWD-CHG
    risk_level: high
    message: "ALTER LOGIN changes a login's password. Password changes outside a managed rotation process can lock out applications or indicate account takeover. Verify the requester and the rotation process."
    triggers:
      all_of:
        - kind: mssql_alter_login
        - ddl.principal.password_literal:
            exists: true

  - id: MSSQL-LOGIN-CHG
    risk_level: medium
    message: "ALTER LOGIN modifies a server login (default database/schema, name, policy options, or credential mapping). Login changes affect authentication behavior for every session the login opens. Verify the change is intended."
    triggers:
      all_of:
        - kind: mssql_alter_login

  - id: MSSQL-LOGIN-DROP
    risk_level: medium
    message: "DROP LOGIN removes a server login. Sessions already open stay alive, but new connections fail — applications using this login break at their next reconnect. Verify nothing still authenticates with it."
    triggers:
      all_of:
        - kind: mssql_drop_login

  - id: MSSQL-APPROLE-NEW
    risk_level: medium
    message: "CREATE APPLICATION ROLE adds a password-activated database principal. Application roles bypass user-level permissions once activated (sp_setapprole), so their password is effectively a shared credential. Review how the password is stored and who can activate the role."
    triggers:
      all_of:
        - kind: create_role
        - ddl.principal.kind: application_role

  - id: MSSQL-EXECAS-LOGIN
    risk_level: high
    message: "EXECUTE AS LOGIN switches the session to another server login's security context. Every subsequent statement runs with that login's permissions across the whole instance — a server-level impersonation. Verify the caller is entitled to impersonate this login and that a REVERT follows."
    triggers:
      all_of:
        - kind: mssql_execute_as
        - impersonation.principal_kind: login

  - id: MSSQL-EXECAS-USER
    risk_level: medium
    message: "EXECUTE AS USER switches the session to another database user's security context. Subsequent statements run with that user's permissions in the current database. Verify the impersonation is intended and that a REVERT follows."
    triggers:
      all_of:
        - kind: mssql_execute_as
        - impersonation.principal_kind: user

  - id: MSSQL-EXECAS-NO-REVERT
    risk_level: high
    message: "EXECUTE AS ... WITH NO REVERT makes the context switch permanent for the session — the original identity cannot be restored. Connection-pooled applications can leak the impersonated identity to unrelated requests. Verify this is intended."
    triggers:
      all_of:
        - kind: mssql_execute_as
        - impersonation.no_revert: true

  - id: MSSQL-SETUSER-IMPERSONATION
    risk_level: medium
    message: "SETUSER switches the database security context to another user — the deprecated, database-scoped equivalent of EXECUTE AS USER. Subsequent statements run with that user's permissions, and SETUSER is a long-standing privilege-escalation and audit-evasion vector. Use EXECUTE AS with a matching REVERT instead, and verify the impersonation is intended."
    triggers:
      all_of:
        - kind: mssql_setuser
        - impersonation.principal_kind: user

  - id: INFO-MSSQL-SETUSER
    risk_level: info
    message: "A T-SQL SETUSER statement was executed. SETUSER changes the database security context (or, with no argument, reverts it); it is deprecated in favor of EXECUTE AS / REVERT."
    triggers:
      all_of:
        - kind: mssql_setuser

  - id: MSSQL-SERVICE-MASTER-KEY-FORCE-REGENERATE
    risk_level: high
    message: "ALTER SERVICE MASTER KEY FORCE REGENERATE re-keys the root of the SQL Server encryption hierarchy and, because it is forced, discards any key material and data that can no longer be decrypted — an irreversible data-loss operation. Confirm a backup of the service master key exists and that the forced loss is intended."
    triggers:
      all_of:
        - kind: mssql_service_master_key
        - mssql_service_master_key.force: true

  - id: MSSQL-SERVICE-MASTER-KEY-REGENERATE
    risk_level: high
    message: "ALTER SERVICE MASTER KEY REGENERATE re-keys the root of the SQL Server encryption hierarchy, re-encrypting everything it protects. This is a high-impact operation on the instance's entire encryption chain; confirm it is intended and that the service master key is backed up."
    triggers:
      all_of:
        - kind: mssql_service_master_key
        - mssql_service_master_key.operation: regenerate

  - id: MSSQL-SERVICE-MASTER-KEY-INLINE-PASSWORD
    risk_level: high
    message: "ALTER SERVICE MASTER KEY changes the protecting service-account credentials using a hardcoded password (WITH { OLD | NEW }_PASSWORD = '...'). The service-account password sits in the script in plaintext. Supply it out of band, not as a literal."
    triggers:
      all_of:
        - kind: mssql_service_master_key
        - mssql_service_master_key.password_present: true

  - id: INFO-MSSQL-SERVICE-MASTER-KEY
    risk_level: info
    message: "An ALTER SERVICE MASTER KEY statement was executed. The service master key is the root of the SQL Server encryption hierarchy; confirm any re-key or service-account change is intended and that the key is backed up."
    triggers:
      all_of:
        - kind: mssql_service_master_key

  - id: PG-DEFAULT-PRIV-TO-PUBLIC
    risk_level: high
    message: "ALTER DEFAULT PRIVILEGES grants to PUBLIC. Every object of this class created in the future is automatically accessible to every role, with no further grant. This is a standing policy that is easy to forget; grant defaults to a specific role instead."
    triggers:
      all_of:
        - kind: pg_default_privileges
        - pg_default_privileges.action: grant
        - pg_default_privileges.grantees:
            exists:
              any_of:
                - name.normalized:
                    in: [PUBLIC]

  - id: PG-DEFAULT-PRIV-ALL
    risk_level: medium
    message: "ALTER DEFAULT PRIVILEGES grants ALL privileges by default. Every object of this class created in the future receives the full privilege set automatically. Default to the minimum privileges the grantee actually needs."
    triggers:
      all_of:
        - kind: pg_default_privileges
        - pg_default_privileges.action: grant
        - pg_default_privileges.all_privileges: true

  - id: PG-DEFAULT-PRIV-GLOBAL
    risk_level: low
    message: "ALTER DEFAULT PRIVILEGES has no IN SCHEMA clause, so the default applies to objects created in every schema. Confine standing default grants to the schemas that need them with IN SCHEMA."
    triggers:
      all_of:
        - kind: pg_default_privileges
        - pg_default_privileges.action: grant
        - pg_default_privileges.global_scope: true

  - id: INFO-PG-DEFAULT-PRIVILEGES
    risk_level: info
    message: "An ALTER DEFAULT PRIVILEGES statement was executed. This sets the privileges automatically applied to objects created in the future, a standing policy rather than a one-time grant; confirm the default is intended."
    triggers:
      all_of:
        - kind: pg_default_privileges

  - id: MSSQL-CRED-NEW
    risk_level: high
    message: "CREATE [DATABASE SCOPED] CREDENTIAL stores an identity (and usually a secret) for reaching an external resource. Credentials govern what the instance can touch outside itself — review the identity, where the secret came from, and which principals can use the credential."
    triggers:
      all_of:
        - kind: mssql_create_security_object
        - security_object.kind: credential

  - id: MSSQL-CRED-DROP
    risk_level: medium
    message: "A credential was dropped. Anything that authenticated through it (external data sources, backups to URL, proxies) fails at next use. Verify nothing still depends on it."
    triggers:
      all_of:
        - kind: mssql_drop_security_object
        - security_object.kind: credential

  - id: INFO-MSSQL-CRYPTO-NEW
    risk_level: info
    message: "An encryption-hierarchy object (master key, symmetric/asymmetric key, or certificate) was created. Positive governance signal — encryption or signing capability is being provisioned. Verify the key/certificate is backed up."
    triggers:
      all_of:
        - kind: mssql_create_security_object
        - security_object.kind:
            in: [master_key, symmetric_key, asymmetric_key, certificate]

  - id: MSSQL-CRYPTO-CHG
    risk_level: medium
    message: "An encryption-hierarchy object or credential was altered (regenerate, re-encrypt, identity/secret change). Key rotation outside a managed process can make encrypted data unreadable or break signed modules. Verify the change procedure."
    triggers:
      all_of:
        - kind: mssql_alter_security_object

  - id: MSSQL-CRYPTO-DROP
    risk_level: high
    message: "An encryption-hierarchy object (master key, symmetric/asymmetric key, or certificate) was dropped. Data encrypted under it becomes unrecoverable, and modules signed by it lose their permissions. Verify nothing remains encrypted or signed with this object."
    triggers:
      all_of:
        - kind: mssql_drop_security_object
        - security_object.kind:
            in: [master_key, symmetric_key, asymmetric_key, certificate]

  - id: INFO-MSSQL-AUDIT-NEW
    risk_level: info
    message: "A SQL Server audit or audit specification was created. Positive governance signal — activity capture is being configured."
    triggers:
      all_of:
        - kind: mssql_create_audit

  - id: MSSQL-AUDIT-CHG
    risk_level: medium
    message: "A SQL Server audit or audit specification was altered. Changes to the audited action groups, destination, or filter change what activity is captured. Verify the change preserves required coverage."
    triggers:
      all_of:
        - kind: mssql_alter_audit

  - id: MSSQL-AUDIT-DISABLE
    risk_level: high
    message: "A SQL Server audit or audit specification was switched to STATE = OFF. Activity capture stops immediately — disabling auditing is a standard precursor to unauthorized activity and usually violates compliance requirements. Verify approval."
    triggers:
      all_of:
        - kind: mssql_alter_audit
        - audit.state: "off"

  - id: MSSQL-AUDIT-DROP
    risk_level: high
    message: "A SQL Server audit or audit specification was dropped. Activity capture configuration is removed entirely. Verify a replacement audit exists if coverage is required."
    triggers:
      all_of:
        - kind: mssql_drop_audit

  - id: MSSQL-DB-TRUSTWORTHY-ON
    risk_level: critical
    message: "ALTER DATABASE ... SET TRUSTWORTHY ON marks the database as trusted by the instance. Combined with db_owner membership, TRUSTWORTHY allows escalation to sysadmin via modules signed by the database owner. Microsoft recommends leaving it OFF; verify the requirement and prefer certificate signing."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              properties.switches:
                exists:
                  all_of:
                    - key: trustworthy
                    - value: "on"

  - id: MSSQL-DB-CHAINING-ON
    risk_level: high
    message: "ALTER DATABASE ... SET DB_CHAINING ON enables cross-database ownership chaining for this database. Permission checks are skipped across the database boundary, so a low-privilege database can become a path into this one. Verify the dependency that requires chaining."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              properties.switches:
                exists:
                  all_of:
                    - key: db_chaining
                    - value: "on"

  - id: MSSQL-DB-ENCRYPTION-OFF
    risk_level: high
    message: "ALTER DATABASE ... SET ENCRYPTION OFF disables transparent data encryption. Data files, log files, and backups written after this change are stored unencrypted. Verify the change is approved and compliant."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              properties.switches:
                exists:
                  all_of:
                    - key: encryption
                    - value: "off"

  - id: INFO-MSSQL-DB-ENCRYPTION-ON
    risk_level: info
    message: "ALTER DATABASE ... SET ENCRYPTION ON enables transparent data encryption. Positive governance signal — data at rest is being protected."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              properties.switches:
                exists:
                  all_of:
                    - key: encryption
                    - value: "on"

  - id: MSSQL-SPCONFIG-OLE-AUTOMATION
    risk_level: critical
    message: "sp_configure invoked with 'Ole Automation Procedures'. Enabling OLE Automation lets T-SQL instantiate COM objects (sp_OACreate), which can read and write files, call the network, and execute code under the SQL Server service account — an xp_cmdshell-equivalent escape hatch. Verify intent and audit the surrounding context."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: ole automation procedures

  - id: MSSQL-SPCONFIG-CLR
    risk_level: high
    message: "sp_configure invoked with a CLR option ('clr enabled' or 'clr strict security'). Enabling CLR, or relaxing CLR strict security, allows user assemblies to run inside the server process; UNSAFE assemblies execute arbitrary native code under the service account. Verify the assembly governance story before changing CLR configuration."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal:
                in: [clr enabled, clr strict security]

  - id: MSSQL-SPCONFIG-ADHOC-QUERIES
    risk_level: high
    message: "sp_configure invoked with 'Ad Hoc Distributed Queries'. Enabling this lets any caller use OPENROWSET/OPENDATASOURCE with inline connection strings — ad-hoc remote connections that bypass linked-server governance and are a common exfiltration channel. Verify intent."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: ad hoc distributed queries

  - id: MSSQL-SPCONFIG-XDB-CHAINING
    risk_level: high
    message: "sp_configure invoked with 'cross db ownership chaining'. Instance-wide ownership chaining lets permissions checks be skipped across database boundaries, so a low-privilege database can become a path into a sensitive one. Scope chaining per-database if it is required at all."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: cross db ownership chaining

  - id: MSSQL-SPCONFIG-REMOTE-ACCESS
    risk_level: medium
    message: "sp_configure invoked with 'remote access'. This legacy option controls remote-server RPC execution against the instance. Changing it widens or narrows which remote servers can run procedures here. Verify the change is intended."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: remote access

  - id: MSSQL-SPCONFIG-DAC
    risk_level: medium
    message: "sp_configure invoked with 'remote admin connections'. Enabling the remote Dedicated Admin Connection exposes the emergency sysadmin endpoint over the network instead of local-only. Verify the operational need and the network controls in front of it."
    triggers:
      all_of:
        - kind: mssql_exec
        - mssql_exec.procedure_name: sp_configure
        - mssql_exec.args:
            exists:
              value_literal: remote admin connections

  - id: INFO-MSSQL-VECIDX-NEW
    risk_level: info
    message: "CREATE VECTOR INDEX adds a DiskANN vector similarity index. This enables approximate nearest-neighbor search on embedding columns. Review: metric type (cosine/dot/euclidean), MAXDOP setting, and storage impact on the target filegroup."
    triggers:
      all_of:
        - kind: mssql_create_vector_index


  - id: VIEW-REPLACE
    risk_level: medium
    message: "CREATE OR REPLACE VIEW detected. Existing view definition is replaced and downstream logic may change."
    triggers:
      all_of:
        - kind: create_view
        - ddl.options.or_replace: true

  - id: VIEW-CHG
    risk_level: medium
    message: "ALTER VIEW changes a view definition or attributes. Views control data access patterns; changes affect all queries through the view."
    triggers:
      all_of:
        - kind: alter_view

  - id: VIEW-DROP
    risk_level: medium
    message: "DROP VIEW removes a view. Dependent queries and applications will break. Check for CASCADE to identify cascading object removal."
    triggers:
      all_of:
        - kind: drop_view

  - id: VIEW-CASCADE-DROP
    risk_level: high
    message: "DROP VIEW ... CASCADE removes the view AND all dependent objects (other views, rules). Cascading drops can silently remove data access controls."
    triggers:
      all_of:
        - kind: drop_view
        - ddl.options.cascade: true


  - id: DNY-PRIV
    risk_level: medium
    message: "DENY statement detected. Explicit privilege denial overrides GRANT and blocks access. Verify this is intentional and documented."
    triggers:
      all_of:
        - kind: deny

  - id: DNY-ALL-PRIV
    risk_level: high
    message: "DENY ALL PRIVILEGES detected. This blocks all access to the securable and overrides any existing grants."
    triggers:
      all_of:
        - kind: deny
        - privilege.all_privileges: true

  - id: DNY-TO-PUBLIC
    risk_level: critical
    message: "DENY to PUBLIC detected — affects ALL database users/principals. This overrides individual grants and may require admin-level intervention to reverse."
    triggers:
      all_of:
        - kind: deny
        - privilege.grantees:
            exists:
              any_of:
                - name.normalized: PUBLIC

  - id: DNY-CASCADE
    risk_level: high
    message: "DENY with CASCADE detected. This propagates the denial to all principals who received the privilege via the target principal."
    triggers:
      all_of:
        - kind: deny
        - privilege.cascade: true

  - id: DNY-AS-PRINCIPAL
    risk_level: high
    message: "DENY with AS clause detected. This executes the denial on behalf of another principal, which may indicate privilege escalation or impersonation."
    triggers:
      all_of:
        - kind: deny
        - privilege.as_principal:
            exists: true


  - id: SCRIPT-SILENT-HANDLER
    risk_level: high
    message: "DECLARE CONTINUE HANDLER FOR SQLEXCEPTION without RESIGNAL silently swallows all errors. This is the SQL equivalent of a bare 'except: pass' — failures will be invisible and the procedure will continue with potentially corrupt state. Add RESIGNAL to re-raise after logging, or use EXIT HANDLER instead."
    triggers:
      all_of:
        - kind: declare_handler
        - handler.handler_type: continue
        - handler.conditions:
            exists:
              kind: sql_exception
        - not:
            handler.body.statement_kinds:
              contains: resignal


  - id: DIFF-WRITE-WHERE-RMV
    risk_level: critical
    message: "Write statement became unbounded after WHERE clause was removed. May affect entire table."
    triggers:
      diff.events:
        each:
          all_of:
            - kind: write_boundedness_changed
            - direction: unbounded

  - id: DIFF-LIMIT-RMV-MULTI
    risk_level: critical
    message: "LIMIT removed from multi-table query. Potential cartesian explosion."
    triggers:
      all_of:
        - diff.events:
            each:
              kind: limit_removed
        - diff.context.head.reads_tables:
            count:
              gte: 2

  - id: DIFF-JOIN-CROSS-ADD
    risk_level: critical
    message: "JOIN changed from {witness.baseline_kind} to CROSS. Cartesian product risk."
    triggers:
      diff.events:
        each:
          all_of:
            - kind: join_type_changed
            - head_kind: cross

  - id: DIFF-SAMPLE-ADD
    risk_level: critical
    message: "SAMPLE/TABLESAMPLE added. Query now operates on SUBSET of data."
    triggers:
      diff.events:
        each:
          kind: sample_added


  - id: DIFF-LIMIT-RMV
    risk_level: high
    message: "LIMIT removed. Query is now unbounded."
    triggers:
      diff.events:
        each:
          kind: limit_removed

  - id: DIFF-WHERE-RMV
    risk_level: high
    message: "WHERE clause removed. Query is now unbounded."
    triggers:
      diff.events:
        each:
          kind: where_removed

  - id: DIFF-JOIN-RMV
    risk_level: high
    message: "JOIN removed. Data relationship lost."
    triggers:
      diff.events:
        each:
          kind: join_removed

  - id: DIFF-DISTINCT-RMV
    risk_level: high
    message: "DISTINCT removed. Query may now return duplicate rows."
    triggers:
      diff.events:
        each:
          kind: distinct_removed

  - id: DIFF-JOIN-NARROW
    risk_level: high
