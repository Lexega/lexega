      all_of:
        - kind: alter_storage_integration
        - integration.variant.had_set_enabled_to_true: true

  - id: SNW-STGINTG-AWS-CHG
    risk_level: critical
    message: "Storage Integration AWS role changed. Cloud IAM trust relationship modified. Verify authorization."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.variant.had_set_aws_role: true

  - id: SNW-STGINTG-AZURE-CHG
    risk_level: critical
    message: "Storage Integration Azure tenant changed. Cloud trust relationship modified. Verify authorization."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.variant.had_set_azure_tenant: true

  - id: SNW-STGINTG-LOC-CHG
    risk_level: high
    message: "Storage Integration allowed locations changed. Data access scope modified."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.variant.had_set_allowed_locations: true

  - id: SNW-STGINTG-BLOCKLOC-CHG
    risk_level: high
    message: "Storage Integration blocked locations changed. Data access scope modified."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.variant.had_set_blocked_locations: true

  - id: SNW-STGINTG-TAG-ADD
    risk_level: low
    message: "Storage Integration tag set. Positive governance signal — metadata tag added."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.set_tags:
            count:
              gt: 0

  - id: SNW-STGINTG-TAG-RMV
    risk_level: medium
    message: "Storage Integration tag removed. Governance metadata lost. Verify this is intentional."
    triggers:
      all_of:
        - kind: alter_storage_integration
        - integration.unset_tags:
            count:
              gt: 0

  - id: SNW-STGINTG-DROP
    risk_level: critical
    message: "Storage Integration dropped. External storage access removed. All dependent stages and pipes affected."
    triggers:
      kind: drop_storage_integration

  - id: SNW-EXTACC-NEW
    risk_level: medium
    message: "External access integration created. Network egress configured."
    triggers:
      kind: create_external_access_integration

  - id: SNW-EXTACC-DROP
    risk_level: high
    message: "External access integration dropped. Network egress removed."
    triggers:
      kind: drop_external_access_integration

  - id: SNW-EXTACC-OFF
    risk_level: high
    message: "External access integration disabled. Network egress suspended."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_set_enabled_to_false: true

  - id: SNW-EXTACC-ON
    risk_level: medium
    message: "External access integration enabled. Network egress activated."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - any_of:
            - integration.variant.had_set_enabled_to_true: true
            - integration.variant.had_unset_enabled: true

  - id: SNW-EXTACC-HOSTS-CHG
    risk_level: critical
    message: "External access allowed hosts changed. Network egress scope modified."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - any_of:
            - integration.variant.had_set_allowed_api_authentication_integrations: true
            - integration.variant.had_unset_allowed_api_authentication_integrations: true

  - id: SNW-EXTACC-NETRULES-CHG
    risk_level: high
    message: "External access network rules changed. Verify egress restrictions."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_set_allowed_network_rules: true

  - id: SNW-EXTACC-SECRETS-CHG
    risk_level: critical
    message: "External access allowed secrets changed. Credential access modified."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_set_allowed_authentication_secrets: true

  - id: SNW-EXTACC-SECRET-RMV
    risk_level: high
    message: "External access secret removed from allowed list."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_unset_allowed_authentication_secrets: true

  - id: SNW-EXTACC-NETRULE-ADD
    risk_level: medium
    message: "Network rule added to external access integration."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_set_allowed_network_rules_nonempty: true

  - id: SNW-EXTACC-NETRULE-RMV
    risk_level: high
    message: "Network rule removed from external access integration."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_unset_allowed_network_rules: true

  - id: SNW-EXTACC-COMMENT-CHG
    risk_level: low
    message: "External access integration comment changed."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - any_of:
            - integration.comment.kind: set
            - integration.comment.kind: unset

  - id: SNW-EXTACC-TAG-ADD
    risk_level: low
    message: "Tag added to external access integration. Positive governance."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.set_tags:
            count:
              gt: 0

  - id: SNW-EXTACC-TAG-RMV
    risk_level: medium
    message: "Tag removed from external access integration."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.unset_tags:
            count:
              gt: 0

  - id: SNW-EXTACC-NAME-CHG
    risk_level: high
    message: "External access integration renamed. Dependent objects may break."
    triggers:
      all_of:
        - kind: alter_external_access_integration
        - integration.variant.had_rename: true

  - id: SNW-EXTACC-OWNER-CHG
    risk_level: high
    message: "External access integration ownership changed."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: ownership
        - privilege.target.kind: api_integration

  - id: SNW-EXTACC-CHG
    risk_level: medium
    message: "External access integration modified. Verify configuration."
    triggers:
      kind: alter_external_access_integration


  - id: SNW-NETRULE-NEW
    risk_level: medium
    message: "Network rule created. New network destinations or origins defined for use by network policies and external access integrations."
    triggers:
      kind: create_network_rule

  - id: SNW-NETRULE-INGRESS-ANY
    risk_level: high
    message: "Network rule permits inbound access from all IPv4 addresses (MODE = INGRESS with 0.0.0.0/0 in VALUE_LIST). Any network policy that allows this rule imposes no source-IP restriction, exposing the account to the entire internet. Restrict the rule to the specific corporate/VPN CIDR blocks."
    triggers:
      all_of:
        - kind: { in: [create_network_rule, alter_network_rule] }
        - ddl.network_rule.mode: INGRESS
        - ddl.network_rule.value_entries:
            exists:
              is_zero_route: true

  - id: SNW-NETRULE-EGRESS-NEW
    risk_level: high
    message: "Egress network rule created. Outbound destinations defined — anything referencing this rule can send data to the listed endpoints."
    triggers:
      all_of:
        - kind: create_network_rule
        - ddl.network_rule.mode: EGRESS

  - id: SNW-NETRULE-VALUES-CHG
    risk_level: high
    message: "Network rule destinations replaced. Every policy and integration referencing this rule now allows the new endpoint list — network posture changed without any policy edit."
    triggers:
      all_of:
        - kind: alter_network_rule
        - ddl.network_rule.value_list_set: true

  - id: SNW-NETRULE-CHG
    risk_level: medium
    message: "Network rule properties modified."
    triggers:
      all_of:
        - kind: alter_network_rule
        - any_of:
            - ddl.network_rule.properties_set:
                exists: true
            - ddl.network_rule.properties_unset:
                exists: true

  - id: SNW-NETRULE-DROP
    risk_level: high
    message: "Network rule dropped. Policies and integrations referencing it lose the corresponding network allowances."
    triggers:
      kind: drop_network_rule


  - id: INFO-SNW-RESMON-NEW
    risk_level: info
    message: "Resource monitor created. Compute credit-usage governance object defined for the warehouses it monitors."
    triggers:
      kind: create_resource_monitor

  - id: SNW-RESMON-NO-SUSPEND
    risk_level: medium
    message: "Resource monitor created without an automatic-suspend trigger. It can alert on credit usage but will not halt compute, so it enforces no hard spending cap."
    triggers:
      all_of:
        - kind: create_resource_monitor
        - ddl.resource_monitor.no_suspend_trigger: true

  - id: SNW-RESMON-QUOTA-CHG
    risk_level: low
    message: "Resource monitor credit quota changed. The compute spend allowance was redefined — confirm the cap was not raised beyond budget."
    triggers:
      all_of:
        - kind: alter_resource_monitor
        - ddl.resource_monitor.credit_quota_set: true

  - id: SNW-RESMON-TRIGGERS-CHG
    risk_level: medium
    message: "Resource monitor triggers redefined. The credit-usage thresholds and their suspend/notify actions changed — verify automatic suspension was not loosened or removed."
    triggers:
      all_of:
        - kind: alter_resource_monitor
        - ddl.resource_monitor.triggers_changed: true

  - id: SNW-RESMON-DROP
    risk_level: high
    message: "Resource monitor dropped. Warehouses governed by it lose their credit-usage cap and can consume compute without automatic suspension."
    triggers:
      kind: drop_resource_monitor

  - id: SNW-CMPPOOL-NEW
    risk_level: info
    message: "Compute pool created. Snowpark Container Services jobs and services run on this capacity; its instance family and node counts determine cost and what workloads it can host."
    triggers:
      kind: create_compute_pool

  - id: SNW-CMPPOOL-GPU
    risk_level: low
    message: "Compute pool uses a GPU instance family. GPU compute is materially more expensive than CPU and can run accelerated workloads (e.g. ML training/inference). Confirm the GPU capacity is intended and cost-controlled."
    triggers:
      all_of:
        - kind:
            in: [create_compute_pool, alter_compute_pool]
        - ddl.compute_pool.instance_family:
            matches: "GPU*"

  - id: SNW-GITREPO-NEW
    risk_level: low
    message: "Git repository created. It connects Snowflake to an external git remote (ORIGIN) through an API integration; code from the repository can be run with EXECUTE IMMEDIATE FROM. Confirm the origin and integration are trusted — this is an external code-supply path into the account."
    triggers:
      kind: create_git_repository

  - id: SNW-GITREPO-FETCH
    risk_level: info
    message: "Git repository fetched. FETCH re-pulls the latest content from the external origin, so the repository's executable content now reflects whatever the upstream remote holds. Confirm the upstream is controlled."
    triggers:
      all_of:
        - kind: alter_git_repository
        - ddl.git_repository.actions:
            exists:
              kind: fetch

  - id: SNW-IMGREPO-NEW
    risk_level: info
    message: "Image repository created. It is an OCI registry that Snowpark Container Services pull container images from; whatever images are pushed here can run as containers in the account. Confirm pushes to this registry are controlled — it is a software-supply-chain surface."
    triggers:
      kind: create_image_repository

  - id: SNW-IMGREPO-REPLACE
    risk_level: low
    message: "CREATE OR REPLACE on an image repository drops the existing registry and recreates it. Container services that pull from it lose their images and will run whatever is re-pushed. Confirm the replacement is intended."
    triggers:
      all_of:
        - kind: create_image_repository
        - ddl.options.or_replace: true

  - id: SNW-STREAMLIT-NEW
    risk_level: info
    message: "Streamlit app created. It runs a Python app hosted from a stage and executes under the owner's role through a query warehouse. Confirm the app's stage content and warehouse are intended."
    triggers:
      kind: create_streamlit

  - id: SNW-STREAMLIT-EXTERNAL-ACCESS
    risk_level: medium
    message: "Streamlit app declares EXTERNAL_ACCESS_INTEGRATIONS — its Python code can reach external network endpoints from inside the account. Confirm the integrations are scoped and the egress is intended; this is a data-egress surface."
    triggers:
      all_of:
        - kind:
            in: [create_streamlit, alter_streamlit]
        - ddl.streamlit.has_external_access_integrations: true

  - id: SNW-SERVICE-NEW
    risk_level: low
    message: "Service created (Snowpark Container Services). It runs container workloads on a compute pool from a spec that pulls container images; the images run in the account under the service's role. Confirm the spec's image sources and the compute pool are intended."
    triggers:
      kind: create_service

  - id: SNW-SERVICE-EXTERNAL-ACCESS
    risk_level: medium
    message: "Service declares EXTERNAL_ACCESS_INTEGRATIONS — its containers can reach external network endpoints from inside the account. Confirm the integrations are scoped and the egress is intended; this is a data-egress surface."
    triggers:
      all_of:
        - kind:
            in: [create_service, alter_service]
        - ddl.service.has_external_access_integrations: true

  - id: SNW-NOTEBOOK-NEW
    risk_level: info
    message: "Notebook created. It runs code hosted from a stage and executes under the owner's role through a query warehouse. Confirm the notebook's stage content and warehouse are intended."
    triggers:
      kind: create_notebook

  - id: SNW-NOTEBOOK-EXTERNAL-ACCESS
    risk_level: medium
    message: "Notebook declares EXTERNAL_ACCESS_INTEGRATIONS — its code can reach external network endpoints from inside the account. Confirm the integrations are scoped and the egress is intended; this is a data-egress surface."
    triggers:
      all_of:
        - kind:
            in: [create_notebook, alter_notebook]
        - ddl.notebook.has_external_access_integrations: true

  - id: INFO-SNW-SEMVIEW-NEW
    risk_level: info
    message: "Semantic view created. It is a named model (logical tables, relationships, facts, dimensions, metrics) built over base tables that query and BI tools — including natural-language interfaces — consume. Confirm the base tables it exposes are intended for this surface."
    triggers:
      kind: create_semantic_view

  - id: SNW-SEMVIEW-REPLACE
    risk_level: low
    message: "CREATE OR REPLACE on a semantic view redefines the model in place — the base tables it exposes and the metrics it computes can change without a separate review. Confirm the new definition's access surface is intended."
    triggers:
      all_of:
        - kind: create_semantic_view
        - ddl.options.or_replace: true

  - id: INFO-SNW-CORTEX-SEARCH-NEW
    risk_level: info
    message: "Cortex search service created. It builds an AI (embedding-backed) search index over the rows produced by a source query, refreshed on a warehouse. The indexed data becomes queryable through a natural-language search surface — confirm the source query and embedding model are intended."
    triggers:
      kind: create_cortex_search_service

  - id: SNW-CORTEX-SEARCH-REPLACE
    risk_level: low
    message: "CREATE OR REPLACE on a Cortex search service rebuilds the index in place — the source query it indexes and the embedding model can change without a separate review. Confirm the new definition's data source is intended."
    triggers:
      all_of:
        - kind: create_cortex_search_service
        - ddl.options.or_replace: true

  - id: INFO-SNW-APP-NEW
    risk_level: info
    message: "Native application installed. It runs a provider's code inside the account under its own application role. Confirm the source and the privileges the application requests are intended."
    triggers:
      kind: create_application

  - id: SNW-APP-FROM-LISTING
    risk_level: low
    message: "Native application installed FROM LISTING — its code comes from an external marketplace provider, not an in-account application package. Confirm the publisher is trusted; this is a third-party-code supply-chain surface."
    triggers:
      all_of:
        - kind: create_application
        - ddl.application.from_listing: true

  - id: SNW-APP-DEBUG-MODE
    risk_level: low
    message: "Native application has DEBUG_MODE enabled — the provider can inspect the application's internals and objects it would otherwise not see. Confirm debug mode is intended (it is normally for development only)."
    triggers:
      all_of:
        - kind:
            in: [create_application, alter_application]
        - ddl.application.debug_mode: true

  - id: INFO-SNW-APPPKG-NEW
    risk_level: info
    message: "Application package created. It is the provider-side container that bundles a Native App for distribution. Confirm what is added to it and how it is distributed."
    triggers:
      kind: create_application_package

  - id: SNW-APPPKG-DISTRIBUTION-EXTERNAL
    risk_level: low
    message: "Application package distribution set to EXTERNAL — the package can be published to and installed by other Snowflake accounts outside this organization. Confirm external distribution is intended."
    triggers:
      all_of:
        - kind:
            in: [create_application_package, alter_application_package]
        - ddl.application_package.distribution:
            matches: "EXTERNAL"

  - id: INFO-SNW-LISTING-NEW
    risk_level: info
    message: "Listing created. It exposes a share or application package to consumers through the Snowflake Marketplace or a data exchange. Confirm what it exposes and to whom."
    triggers:
      kind: create_listing

  - id: SNW-LISTING-EXTERNAL
    risk_level: medium
    message: "EXTERNAL listing — the share or application package it exposes is offered on the public Snowflake Marketplace, reaching accounts outside this organization. Confirm the data/app is intended for public exposure."
    triggers:
      all_of:
        - kind: create_listing
        - ddl.listing.is_external: true

  - id: SNW-LISTING-PUBLISH
    risk_level: low
    message: "Listing published (PUBLISH = TRUE) — it is live and consumable by its target audience. Confirm the listing is ready to expose its data/app."
    triggers:
      all_of:
        - kind:
            in: [create_listing, alter_listing]
        - ddl.listing.publish: true

  - id: SNW-MANAGED-ACCOUNT-NEW
    risk_level: medium
    message: "Managed (reader) account created. It lets people who are not Snowflake customers consume this account's shares, with compute billed to this account — a path for sharing data with outsiders. Confirm the reader account and what it will be granted are intended."
    triggers:
      kind: create_managed_account

  - id: SNW-ACCOUNT-NEW
    risk_level: medium
    message: "Account created in the organization. A new account ships with its own ACCOUNTADMIN credentials, billing, and security posture, outside this account's controls. Confirm the provisioning is intended and the new account's admin access is governed."
    triggers:
      kind: create_account

  - id: SNW-STAGE-GET
    risk_level: medium
    message: "GET downloads files from a stage to the client running this command — data leaves Snowflake to a local machine. Confirm this egress is intended and the destination is controlled; GET is a data-exfiltration primitive."
    triggers:
      kind: stage_get

  - id: SNW-STAGE-REMOVE
    risk_level: low
    message: "REMOVE deletes files from a stage. Confirm the deletion is intended — staged data (loads, unloads, app artifacts) is destroyed."
    triggers:
      kind: stage_remove

  - id: INFO-SNW-STAGE-PUT
    risk_level: info
    message: "PUT uploads a local file to a stage. Confirm the uploaded content is intended — it becomes available to loads and services that read the stage."
    triggers:
      kind: stage_put

  - id: INFO-SNW-STAGE-LIST
    risk_level: info
    message: "LIST enumerates the files on a stage. Typically reconnaissance/inspection; confirm the access is expected."
    triggers:
      kind: stage_list


  - id: SNW-ALERT-NEW
    risk_level: low
    message: "Alert created. A scheduled condition runs an action statement under the owner's role when it holds — verify the action is intended."
    triggers:
      kind: create_alert

  - id: SNW-ALERT-DROP
    risk_level: high
    message: "Alert dropped. Scheduled monitoring and its automated action are removed."
    triggers:
      kind: drop_alert

  - id: SNW-ALERT-RESUME
    risk_level: medium
    message: "Alert resumed. The scheduled condition and action are now active."
    triggers:
      all_of:
        - kind: alter_alert
        - ddl.alert.actions:
            exists:
              kind: resume

  - id: SNW-ALERT-SUSPEND
    risk_level: low
    message: "Alert suspended. Scheduled evaluation paused."
    triggers:
      all_of:
        - kind: alter_alert
        - ddl.alert.actions:
            exists:
              kind: suspend

  - id: SNW-ALERT-ACTION-CHG
    risk_level: medium
    message: "Alert action SQL modified. The statement the alert runs on its schedule changed — review the new logic."
    triggers:
      all_of:
        - kind: alter_alert
        - ddl.alert.actions:
            exists:
              kind: modify_action

  - id: SNW-ALERT-COND-CHG
    risk_level: low
    message: "Alert condition modified. The predicate that gates the scheduled action changed."
    triggers:
      all_of:
        - kind: alter_alert
        - ddl.alert.actions:
            exists:
              kind: modify_condition

  - id: SNW-ALERT-PARSE-ERR
    risk_level: medium
    message: "Alert action SQL could not be parsed. The scheduled statement was not analyzed."
    triggers:
      all_of:
        - kind: create_alert
        - ddl.alert.create_options.action.parse: unparseable


  - id: INFO-SNW-DMF-NEW
    risk_level: info
    message: "Data metric function created. A SQL function that measures table data is now defined; it takes effect when attached to a table."
    triggers:
      kind: create_data_metric_function

  - id: INFO-SNW-DMF-SECURE
    risk_level: info
    message: "Secure data metric function created. The function definition is hidden from users without ownership."
    triggers:
      all_of:
        - kind: create_data_metric_function
        - ddl.data_metric_function.secure: true

  - id: SNW-DMF-DROP
    risk_level: low
    message: "Data metric function dropped. Any table still referencing it loses that data-quality metric."
    triggers:
      kind: drop_data_metric_function


  - id: SNW-REPLGRP-NEW
    risk_level: medium
    message: "Replication group created. Account objects can be replicated to other Snowflake accounts — verify the allowed accounts and object types."
    triggers:
      kind: create_replication_group

  - id: SNW-FGRP-NEW
    risk_level: medium
    message: "Failover group created. Account objects can be replicated and failed over to other Snowflake accounts — verify the allowed accounts and object types."
    triggers:
      kind: create_failover_group

  - id: SNW-REPL-ACCOUNTS
    risk_level: high
    message: "Replication/failover group grants cross-account replication. The listed ALLOWED_ACCOUNTS receive copies of this account's objects — data egresses to other Snowflake accounts."
    triggers:
      all_of:
        - kind:
            in: [create_replication_group, create_failover_group]
        - ddl.replication_failover_group.allowed_accounts:
            exists: true

  - id: SNW-REPL-REPLICA
    risk_level: info
    message: "Secondary replication/failover group created (AS REPLICA OF). This account is now a replication target of another account's group."
    triggers:
      all_of:
        - kind:
            in: [create_replication_group, create_failover_group]
        - ddl.replication_failover_group.is_replica: true

  - id: SNW-REPLGRP-DROP
    risk_level: medium
    message: "Replication group dropped. Cross-account replication of its objects stops."
    triggers:
      kind: drop_replication_group

  - id: SNW-FGRP-DROP
    risk_level: medium
    message: "Failover group dropped. Cross-account replication and disaster-recovery failover for its objects are removed."
    triggers:
      kind: drop_failover_group


  - id: INFO-SNW-ACCT-PARAM-CHG
    risk_level: info
    message: "Account-level parameter changed via ALTER ACCOUNT. Account-wide settings affect every user and object — verify the change is intended."
    triggers:
      all_of:
        - kind: alter_account
        - any_of:
            - ddl.account.parameters_set:
                exists: true
            - ddl.account.parameters_unset:
                exists: true

  - id: SNW-ACCT-UNLOAD-INLINE
    risk_level: critical
    message: "ALTER ACCOUNT SET PREVENT_UNLOAD_TO_INLINE_URL = FALSE. Data can be unloaded (COPY INTO) to arbitrary inline cloud URLs, bypassing storage-integration controls — a data-exfiltration path."
    triggers:
      all_of:
        - kind: alter_account
        - ddl.account.parameters_set:
            exists:
              name: PREVENT_UNLOAD_TO_INLINE_URL
              value: "FALSE"

  - id: SNW-ACCT-STAGE-INTEG-OFF
    risk_level: high
    message: "ALTER ACCOUNT relaxes the storage-integration requirement for stages (REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION/OPERATION = FALSE). Stages may then embed inline cloud credentials."
    triggers:
      all_of:
        - kind: alter_account
        - any_of:
            - ddl.account.parameters_set:
                exists:
                  name: REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION
                  value: "FALSE"
            - ddl.account.parameters_set:
                exists:
                  name: REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION
                  value: "FALSE"

  - id: SNW-ACCT-RETENTION-ZERO
    risk_level: high
    message: "ALTER ACCOUNT SET DATA_RETENTION_TIME_IN_DAYS = 0 disables Time Travel account-wide. Objects using the account default lose their recovery window: dropped or modified data cannot be restored with UNDROP or AT/BEFORE queries, eliminating recovery from accidental or malicious data loss."
    triggers:
      all_of:
        - kind: alter_account
        - ddl.account.parameters_set:
            exists:
              name: DATA_RETENTION_TIME_IN_DAYS
              value: "0"

  - id: SNW-ACCT-MIN-RETENTION-ZERO
    risk_level: medium
    message: "ALTER ACCOUNT SET MIN_DATA_RETENTION_TIME_IN_DAYS = 0 removes the enforced Time Travel floor, allowing any database, schema, or table to set DATA_RETENTION_TIME_IN_DAYS = 0 and disable its own data recovery."
    triggers:
      all_of:
        - kind: alter_account
        - ddl.account.parameters_set:
            exists:
              name: MIN_DATA_RETENTION_TIME_IN_DAYS
