  - id: SNW-NETPOL-NEW
    risk_level: low
    message: "Network Policy created. The policy takes effect only when attached to the account, a user, or a security integration (ALTER ... SET NETWORK_POLICY); review its allowed and blocked IP lists before attachment."
    triggers:
      kind: create_network_policy

  - id: SNW-NETPOL-IPALLOW-CFG
    risk_level: low
    message: "Network Policy ALLOWED_IP_LIST configured. IP allowlist established."
    triggers:
      all_of:
        - kind: create_network_policy
        - policy.variant.properties:
            exists:
              kind: allowed_ip_list

  - id: SNW-NETPOL-IPALLOW-ANY
    risk_level: high
    message: "Network Policy ALLOWED_IP_LIST permits all IPv4 addresses (0.0.0.0/0). The policy imposes no source-IP restriction, so the account is reachable from anywhere on the internet — equivalent to having no network policy. Replace the open range with the specific corporate/VPN CIDR blocks that should reach the account."
    triggers:
