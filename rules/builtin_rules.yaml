  - id: SNW-SESSION-NONDETERMINISTIC-DML
    risk_level: low
    message: "Nondeterministic MERGE/UPDATE error disabled. The session silently allows MERGE/UPDATE statements with ambiguous row matches, risking nondeterministic writes and data corruption."
    triggers:
