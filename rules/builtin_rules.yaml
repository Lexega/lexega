  # ── Snowflake USER object governance properties ─────────────────────
  # Predicate on the recognized `ddl.principal.snowflake_user.*` values;
  # which roles count as privileged / which TYPE is deprecated / what MFA
  # bypass window is too long is policy data below, not Rust.

  - id: SNW-USER-DEFAULT-ROLE-PRIV
    risk_level: high
    message: "User assigned a privileged system role as DEFAULT_ROLE (ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, ORGADMIN, or USERADMIN). The default role activates automatically on every login, so all sessions run with account-wide privileges by default. Assign a least-privilege default role and require explicit role activation for administrative work."
    triggers:
      all_of:
        - kind: { in: [create_user, alter_user] }
        - ddl.principal.snowflake_user.default_role:
            in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, ORGADMIN, USERADMIN]

  - id: SNW-USER-MFA-BYPASS
    risk_level: high
    message: "User configured with a multi-factor authentication bypass window (MINS_TO_BYPASS_MFA greater than zero). During the window the user can authenticate without MFA, weakening protection against credential compromise. Set MINS_TO_BYPASS_MFA to 0 unless a time-boxed enrollment exception is actively in use."
    triggers:
      all_of:
        - kind: { in: [create_user, alter_user] }
        - ddl.principal.snowflake_user.mins_to_bypass_mfa:
            gt: 0

  - id: SNW-USER-TYPE-LEGACY
    risk_level: medium
    message: "User created with TYPE = LEGACY_SERVICE. Legacy service users permit password and SAML authentication for non-interactive workloads and are deprecated in favor of TYPE = SERVICE with key-pair or OAuth authentication. Migrate legacy service accounts to reduce the password-based attack surface."
    triggers:
      all_of:
        - kind: { in: [create_user, alter_user] }
        - ddl.principal.snowflake_user.user_type:
            eq: LEGACY_SERVICE

  - id: SNW-USER-PWD-NO-CHANGE
    risk_level: medium
    message: "User created with a password but MUST_CHANGE_PASSWORD = FALSE. The administrator-set password persists with no forced rotation on first login, leaving a known credential in place. Set MUST_CHANGE_PASSWORD = TRUE so the user establishes a private password."
    triggers:
      all_of:
        - kind: create_user
        - ddl.principal.password_literal:
            exists: true
        - ddl.principal.snowflake_user.must_change_password: false

  - id: SNW-AGGPOL-NEW
    risk_level: high
    message: "Aggregation Policy created. This controls minimum group sizes for aggregation queries to prevent small group disclosures. Verify MIN_GROUP_SIZE is adequate for your privacy requirements."
    triggers:
      kind: create_aggregation_policy

  - id: SNW-AGGPOL-NOCONST
    risk_level: critical
    message: "Aggregation Policy uses NO_AGGREGATION_CONSTRAINT. This removes all aggregation protections, allowing small group queries that may disclose sensitive information."
    triggers:
      all_of:
        - kind: create_aggregation_policy
        - policy.variant.has_no_aggregation_constraint: true

  - id: SNW-AGGPOL-GRPSZ-CRIT
    risk_level: critical
    message: "Aggregation Policy has dangerously low MIN_GROUP_SIZE (< 3). Groups smaller than 3 can easily lead to re-identification."
    triggers:
      all_of:
        - kind: create_aggregation_policy
        - policy.variant.min_group_size:
            lt: 3

  - id: SNW-AGGPOL-GRPSZ-LOW
    risk_level: high
    message: "Aggregation Policy has low MIN_GROUP_SIZE (3-4). While better than 1-2, groups of 3-4 still pose re-identification risks."
    triggers:
      all_of:
        - kind: create_aggregation_policy
        - policy.variant.min_group_size:
            range:
              low: 3
              high: 4

  - id: SNW-AGGPOL-GRPSZ-STRONG
    risk_level: low
    message: "Aggregation Policy has strong MIN_GROUP_SIZE (≥10). Good privacy protection. This significantly reduces re-identification risk."
    triggers:
      all_of:
        - kind: create_aggregation_policy
        - policy.variant.min_group_size:
            gte: 10

  - id: SNW-AGGPOL-COND
    risk_level: medium
    message: "Aggregation Policy uses conditional logic (CASE expressions). Conditional policies can have different protections for different scenarios. Verify all branches have adequate MIN_GROUP_SIZE values."
    triggers:
      all_of:
        - kind: create_aggregation_policy
        - policy.variant.has_conditional_body: true

  - id: SNW-AGGPOL-NOCONST-CHG
    risk_level: critical
    message: "Aggregation Policy body changed to NO_AGGREGATION_CONSTRAINT. Protection removed entirely. This exposes data to unrestricted aggregation queries."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.variant.had_body_change: true
        - policy.variant.has_no_aggregation_constraint: true

  - id: SNW-AGGPOL-CHG
    risk_level: medium
    message: "Aggregation Policy altered. Policy modified. Review changes to ensure they maintain adequate privacy protections."
    triggers:
      kind: alter_aggregation_policy

  - id: SNW-AGGPOL-NAME-CHG
    risk_level: medium
    message: "Aggregation Policy renamed. Policy name changed. Verify references to this policy are updated in dependent objects and documentation."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.renamed_to:
            exists: true

  - id: SNW-AGGPOL-TAG-ADD
    risk_level: low
    message: "Aggregation Policy tag set. Metadata tag added to policy. Informational only."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.set_tags:
            count:
              gt: 0

  - id: SNW-AGGPOL-TAG-RMV
    risk_level: medium
    message: "Aggregation Policy tag removed. Governance metadata lost. Verify this is intentional."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.unset_tags:
            count:
              gt: 0

  - id: SNW-AGGPOL-COMMENT-ADD
    risk_level: low
    message: "Comment added to Aggregation Policy. Positive documentation signal."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.comment.kind: set

  - id: SNW-AGGPOL-COMMENT-RMV
    risk_level: low
    message: "Comment removed from Aggregation Policy. Documentation lost."
    triggers:
      all_of:
        - kind: alter_aggregation_policy
        - policy.comment.kind: unset

  - id: SNW-AGGPOL-DROP
    risk_level: critical
    message: "Aggregation Policy dropped. Aggregation protections removed. This removes minimum group size constraints, potentially exposing sensitive data through small group aggregations."
    triggers:
      kind: drop_aggregation_policy


