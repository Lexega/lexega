  # ── Security-integration property-value governance ──────────────────
  # Predicate on the captured `integration.variant.set_properties` pairs
  # (matched against `value_normalized` — quote-stripped, upper-cased).
  # Which values are dangerous is the YAML data below, not Rust.

  - id: SNW-SECINTG-OAUTH-NON-TLS-REDIRECT
    risk_level: high
    message: "OAuth security integration allows a non-TLS redirect URI (OAUTH_ALLOW_NON_TLS_REDIRECT_URI = TRUE). The authorization code can be sent to a plaintext http:// endpoint, exposing it to man-in-the-middle interception and redirect-phishing. Require a TLS-protected redirect URI."
    triggers:
      all_of:
        - kind: { in: [create_security_integration, alter_security_integration] }
        - integration.variant.set_properties:
            exists:
              name: OAUTH_ALLOW_NON_TLS_REDIRECT_URI
              value_normalized: "TRUE"

  - id: SNW-SECINTG-EXTOAUTH-ANY-ROLE
    risk_level: high
    message: "External OAuth integration enables unrestricted role switching (EXTERNAL_OAUTH_ANY_ROLE_MODE = ENABLE). An authenticated client can assume any role granted to the mapped user as its session role with no further restriction — a privilege-escalation surface. Use DISABLE, or ENABLE_FOR_PRIVILEGE to require the USE_ANY_ROLE privilege."
    triggers:
      all_of:
        - kind: { in: [create_security_integration, alter_security_integration] }
        - integration.variant.set_properties:
            exists:
              name: EXTERNAL_OAUTH_ANY_ROLE_MODE
              value_normalized: ENABLE

  - id: SNW-SECINTG-SCIM-RUN-AS-PRIV
    risk_level: high
    message: "SCIM security integration provisions as a privileged system role (RUN_AS_ROLE is ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, ORGADMIN, or USERADMIN). Users and roles imported by the identity provider are owned and managed by that role, granting the external provisioning client account-wide authority. Run SCIM as a dedicated least-privilege provisioner role."
    triggers:
      all_of:
        - kind: { in: [create_security_integration, alter_security_integration] }
        - integration.variant.set_properties:
            exists:
              name: RUN_AS_ROLE
              value_normalized:
                in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, ORGADMIN, USERADMIN]

  - id: SNW-SECINTG-SAML-SIGN-REQUEST-OFF
    risk_level: medium
    message: "SAML2 integration sends unsigned authentication requests (SAML2_SIGN_REQUEST = FALSE). The identity provider cannot cryptographically verify that requests originate from this Snowflake account, weakening protection against request forgery. Enable request signing."
    triggers:
      all_of:
        - kind: { in: [create_security_integration, alter_security_integration] }
        - integration.variant.set_properties:
            exists:
              name: SAML2_SIGN_REQUEST
              value_normalized: "FALSE"

  - id: SNW-SECINTG-SCIM-SYNC-PASSWORD
    risk_level: medium
    message: "SCIM security integration synchronizes passwords from the identity provider (SYNC_PASSWORD = TRUE). Password material is pushed into Snowflake from the external client, broadening where credentials live. Verify password sync is required and the provider channel is trusted."
    triggers:
      all_of:
        - kind: { in: [create_security_integration, alter_security_integration] }
        - integration.variant.set_properties:
            exists:
              name: SYNC_PASSWORD
              value_normalized: "TRUE"

