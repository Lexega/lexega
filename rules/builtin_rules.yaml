  - id: SCHEMA-CLONE
    risk_level: medium
    message: "Schema cloned from existing schema. Verify access controls are appropriate for the clone."
    triggers:
      all_of:
        - kind: create_schema
        - ddl.schema.create_origin.kind: clone

  - id: TRIG-NEW
    risk_level: medium
    message: "Trigger created. Triggers execute automatically and can have significant performance and security implications. Review the trigger function."
    triggers:
      all_of:
        - kind: pg_create_trigger

  - id: DYNSQL
    risk_level: high
    message: "Dynamic SQL execution detected. SQL injection risk if input parameters are not validated. Consider parameterized queries (USING clause / sp_executesql parameters)."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              argument:
                in: [concat, format]
        - dynamic_sql_calls:
            exists:
              all_of:
                - argument:
                    not_in: [literal, format_quoted, concat_quoted]
                - parameterization:
                    in: [none, not_applicable]
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization:
                        in: [none, not_applicable]
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization:
                        in: [none, not_applicable]

  - id: DYNSQL-CONCAT
    risk_level: critical
    message: "Dynamic SQL argument is built via string concatenation or FORMAT(...) interpolation. SQL injection risk — switch to a parameterized query (USING clause / sp_executesql parameter binding)."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              argument:
                in: [concat, format]
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]

  - id: DYNSQL-NO-PARAM
    risk_level: medium
    message: "Dynamic SQL executed without parameter binding when the surface supports it (Snowflake USING, sp_executesql @params, EXECUTE … USING). Bind runtime values rather than interpolating."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              all_of:
                - argument:
                    not_in: [literal, format_quoted, concat_quoted]
                - parameterization: none
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization: none
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization: none

  - id: DYNSQL-PARAM-CLEAN
    risk_level: info
    message: "Dynamic SQL recognized as injection-clean: every interpolated value is quoted into an identifier or literal slot it cannot break out of. Informational — verify no untrusted value reaches an unquoted slot."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              argument:
                in: [format_quoted, concat_quoted]
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [format_quoted, concat_quoted]
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [format_quoted, concat_quoted]

  - id: DYNSQL-QUOTE-MISMATCH
    risk_level: critical
    message: "Dynamic SQL applies identifier quoting to a value placed inside a string literal. Identifier quoting (QUOTENAME / quote_ident / %I) delimits identifiers and does not escape the string-literal quote, so the value can still break out of the literal — use literal quoting (quote_literal / QUOTE / %L) or a bound parameter."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              taint_splices:
                exists:
                  all_of:
                    - position: string_literal
                    - quoting: identifier_quoted
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  taint_splices:
                    exists:
                      all_of:
                        - position: string_literal
                        - quoting: identifier_quoted
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  taint_splices:
                    exists:
                      all_of:
                        - position: string_literal
                        - quoting: identifier_quoted

  - id: DYNSQL-LITERAL-QUOTER-IDENT
    risk_level: medium
    message: "Dynamic SQL applies literal/string quoting to a value placed in an identifier position (a table or column name). Literal quoting (quote_literal / QUOTE / %L) produces a quoted string, not an identifier, so the assembled statement is malformed or refers to the wrong object — use identifier quoting (quote_ident / QUOTENAME / %I) or validate the name against an allow-list."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              taint_splices:
                exists:
                  all_of:
                    - position: identifier
                    - quoting: literal_quoted
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  taint_splices:
                    exists:
                      all_of:
                        - position: identifier
                        - quoting: literal_quoted
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  taint_splices:
                    exists:
                      all_of:
                        - position: identifier
                        - quoting: literal_quoted

  - id: DYNSQL-CROSS-SERVER
    risk_level: critical
    message: "Cross-server dynamic SQL execution detected. The remote server's auth context is exercised — validate the connection string and SQL construction."
    triggers:
      any_of:
        - dynamic_sql_calls:
            exists:
              surface: dblink_exec
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  surface: dblink_exec
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  surface: dblink_exec

  - id: SNW-EXECIMM-FROM-STAGE
    risk_level: medium
    message: "EXECUTE IMMEDIATE FROM runs SQL loaded from a stage file rather than inline in the script. The executed code is not visible at review time — verify the stage's access controls and the file's provenance, as this is an external/file-based code-execution surface (e.g. running unreviewed scripts or git-repository files)."
    triggers:
      all_of:
        - kind: execute_immediate_from
        - execute_immediate_from.location_kind: stage_path
        - execute_immediate_from.executes: true

  - id: SNW-EXTFUNC-NON-TLS
    risk_level: high
    message: "EXTERNAL FUNCTION sends row data to a non-TLS (http://) endpoint. Column values passed to the function — including any sensitive data — travel to the remote service in plaintext and can be intercepted on the network. Use an https:// endpoint."
    triggers:
      all_of:
        - kind: create_external_function
        - ddl.external_function.endpoint_scheme: http

  - id: SNW-EXTFUNC-NEW
    risk_level: info
    message: "EXTERNAL FUNCTION declared — row data is sent to an external service via an API integration (a data-egress channel). Confirm the endpoint URL and API integration are approved, and that no sensitive columns are passed to an untrusted destination."
    triggers:
      all_of:
        - kind: create_external_function

  - id: INFO-TBL-UNDROP
