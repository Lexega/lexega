  - id: RAP-NEW
    risk_level: low
    message: "Row Access Policy created. Ensure proper testing and documentation."
    triggers:
      kind: create_row_access_policy

  - id: RAP-ALLOW-ALL
    risk_level: critical
    message: "Row Access Policy predicate is always true. Policy is effectively a no-op and does not restrict row access. Applies to Snowflake, BigQuery, and PostgreSQL RLS."
    triggers:
      any_of:
        - all_of:
            - any_of:
                - kind: create_row_access_policy
                - kind: alter_row_access_policy
            - policy.variant.body:
                exists: true
            - policy.variant.body_terminal_returns:
                all:
                  all_of:
                    - kind: literal
                    - literal.kind: bool
                    - literal.value: true
        - all_of:
            - kind:
                in: [pg_create_policy, pg_alter_policy]
            - policy.variant.using_predicate.body:
                exists: true
            - policy.variant.using_predicate.body_terminal_returns:
                all:
                  all_of:
                    - kind: literal
                    - literal.kind: bool
                    - literal.value: true

