        - policy.variant.history:
            gte: 5

  - id: SNW-PWDPOL-MINLEN-CRITWEAK
    risk_level: critical
    message: "Password minimum length SET to CRITICAL weak value (<8). This violates basic security standards."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.min_length:
            lt: 8

  - id: SNW-PWDPOL-MINLEN-WEAKEN
    risk_level: high
    message: "Password minimum length weakened (8-11 characters). CIS/CISA recommend ≥12 characters (NIST SP 800-63B requires ≥8)."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.min_length:
            range:
              low: 8
              high: 11

  - id: SNW-PWDPOL-EXPIRY-OFF
    risk_level: critical
    message: "Password expiration DISABLED (PASSWORD_MAX_AGE_DAYS = 0). Passwords never expire."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.max_age_days: 0

  - id: SNW-PWDPOL-EXPIRY-LONGSET
    risk_level: high
    message: "Password expiration SET to long duration (>180 days). Consider shorter period."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.max_age_days:
            gt: 180

  - id: SNW-PWDPOL-RETRIES-INCR
    risk_level: critical
    message: "Password max retries INCREASED (>10). Account brute-force risk significantly increased."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.max_retries:
            gt: 10

  - id: SNW-PWDPOL-LOCKOUT-CUT
    risk_level: high
    message: "Password lockout time SHORTENED (<5 minutes). Brute-force attack window reduced too much."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.lockout_time_mins:
            lt: 5

  - id: SNW-PWDPOL-HIST-OFF
    risk_level: high
    message: "Password history DISABLED (PASSWORD_HISTORY = 0). Users can reuse passwords immediately."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.history: 0

  - id: SNW-PWDPOL-MINLEN-UNSET
    risk_level: critical
    message: "Password minimum length UNSET. Reverts to default (8 characters), weakening security."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.unset_fields:
            contains: min_length

  - id: SNW-PWDPOL-EXPIRY-UNSET
    risk_level: critical
    message: "Password expiration UNSET. Reverts to default, may remove expiration entirely."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.unset_fields:
            contains: max_age_days

  - id: SNW-PWDPOL-HISTORY-UNSET
    risk_level: high
    message: "Password history UNSET. Reverts to default (0), users can reuse passwords immediately."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.unset_fields:
            contains: history

  - id: SNW-PWDPOL-RETRIES-UNSET
    risk_level: critical
    message: "Password max retries UNSET. Reverts to default, may allow unlimited login attempts enabling brute-force attacks."
    triggers:
      all_of:
        - kind: alter_password_policy
        - policy.variant.unset_fields:
