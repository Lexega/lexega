  - id: Q-JOIN-CROSS-CENH
    risk_level: medium
    message: "Cross join between {witness.left.name.raw} and {witness.right.name.raw} on a catalog-attested cartesian product of {witness.cartesian_estimate} rows. May cause performance issues on large tables. [Catalog-enhanced]"
    triggers:
      all_of:
        - any_of:
            - query.scopes:
                each:
                  joins:
                    each:
                      all_of:
                        - kind: cross
                        - cartesian_estimate:
                            gte: 10000000
            - query.scopes:
                each:
                  where_predicates:
                    each:
                      all_of:
                        - root.kind: subquery
                        - root.subquery.inner_facts.scopes:
                            exists:
                              joins:
                                exists:
                                  all_of:
                                    - kind: cross
                                    - cartesian_estimate:
                                        gte: 10000000
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*DAY*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*WEEK*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*MONTH*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*DATE*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*TIME*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*YEAR*"
        - query.reads_table:
            none:
              table.name.normalized:
                matches: "*PARAM*"

  - id: Q-SCAN-NOFILT
    risk_level: medium
    message: "Query reads multiple tables without an effective WHERE filter or LIMIT clause. This may cause full table scans."
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.has_limit: false
        - query.has_join_predicate_filters: false
        - query.reads_table:
            count:
              gte: 3

  - id: Q-SCAN-1TBL
    risk_level: medium
    enabled: false
    message: "SELECT without an effective WHERE filter or LIMIT clause on table. May cause full table scan. Use tables.none_of to allowlist known-small tables."
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.has_limit: false
        - query.reads_table:
            count:
              eq: 1

  - id: Q-WIN-NOPART
    risk_level: medium
    message: "Window function without PARTITION BY operates over entire result set. This may cause performance issues or unexpected results."
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  partition_by:
                    count:
                      eq: 0

  - id: Q-WIN-RANK-NOORD
    risk_level: medium
    message: "ROW_NUMBER/RANK/DENSE_RANK without ORDER BY produces arbitrary ordering. Results are non-deterministic."
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  all_of:
                    - function:
                        in: [row_number, rank, dense_rank, percent_rank, cume_dist, ntile]
                    - order_by:
                        count:
                          eq: 0

  - id: Q-NULL-NOTIN
    risk_level: high
    message: "NULL-logic hazard: NOT IN with subquery on column '{witness.root.quantified_cmp.lhs.column.name.raw}'. If subquery returns any NULL, entire predicate evaluates to UNKNOWN and filters all rows. Use NOT EXISTS or ensure subquery has WHERE ... IS NOT NULL."
    triggers:
      query.scopes:
        each:
          where_predicates:
            each:
              any_of:
                - all_of:
                    - root.kind: quantified_cmp
                    - root.quantified_cmp.op: eq
                    - root.quantified_cmp.quantifier: any
                    - root.quantified_cmp.negated: true
                    - root.quantified_cmp.rhs.kind: subquery
                    - root.quantified_cmp.rhs.subquery.inner_facts.scopes:
                        exists:
                          all_of:
                            - kind: outer
                            - projections:
                                exists:
                                  nullability:
                                    not_in:
                                      - catalog_non_nullable
                                      - derived_non_nullable
                                      - filtered_non_nullable
                - all_of:
                    - root.kind: quantified_cmp
                    - root.quantified_cmp.op: not_eq
                    - root.quantified_cmp.quantifier: all
                    - root.quantified_cmp.negated: false
                    - root.quantified_cmp.rhs.kind: subquery
                    - root.quantified_cmp.rhs.subquery.inner_facts.scopes:
                        exists:
                          all_of:
                            - kind: outer
                            - projections:
                                exists:
                                  nullability:
                                    not_in:
                                      - catalog_non_nullable
                                      - derived_non_nullable
                                      - filtered_non_nullable


