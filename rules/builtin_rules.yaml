              all_of:
                - name:
                    in: [ERROR_ON_NONDETERMINISTIC_MERGE, ERROR_ON_NONDETERMINISTIC_UPDATE]
                - value:
                    in: ["FALSE"]

  - id: SNW-SESSION-GRANT-UNDER-ACCOUNTADMIN
    risk_level: medium
    message: "Privilege granted while ACCOUNTADMIN is the active role. Manage grants under SECURITYADMIN or a dedicated security-admin role rather than the account super-role, to keep privilege administration separate from account administration."
    triggers:
      all_of:
        - kind: grant
        - script_context.session.active_role.normalized:
            in: [ACCOUNTADMIN]


  - id: SNW-STREAM-NEW
    risk_level: low
    message: "Stream created. CDC tracking enabled on source object."
    triggers:
      kind: create_stream

  - id: SNW-STREAM-APPENDONLY
    risk_level: low
    message: "Stream configured with APPEND_ONLY mode. Only INSERT operations will be tracked."
    triggers:
      all_of:
        - kind: create_stream
        - ddl.stream.append_only: true

  - id: SNW-STREAM-INSERTONLY
    risk_level: low
    message: "Stream configured with INSERT_ONLY mode for external table."
    triggers:
      all_of:
        - kind: create_stream
        - ddl.stream.insert_only: true

  - id: SNW-STREAM-DROP
    risk_level: high
    message: "Stream dropped. CDC tracking removed - downstream consumers may be affected."
    triggers:
      kind: drop_stream


  - id: SCHEMA-DROP
    risk_level: critical
    message: "DROP SCHEMA detected. All objects in schema will be permanently deleted."
    triggers:
      kind: drop_schema

  - id: SNW-SCHEMA-MGDACC-NEW
    risk_level: low
    message: "Schema created with MANAGED ACCESS. Centralized privilege management enabled - only schema owner can grant privileges."
    triggers:
      all_of:
        - kind: create_schema
        - ddl.schema.managed_access_enabled: true

  - id: SNW-SCHEMA-MGDACC-ON
    risk_level: low
    message: "Schema MANAGED ACCESS enabled. Centralized privilege management now active - only schema owner can grant privileges on objects."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.managed_access_enabled: true

  - id: SNW-SCHEMA-MGDACC-OFF
    risk_level: high
    message: "Schema MANAGED ACCESS disabled. Object owners can now grant privileges. Review privilege grants for compliance."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.managed_access_disabled: true

  - id: SNW-SCHEMA-RETENTION-CHG
    risk_level: high
    message: "Schema data retention period changed. Time Travel and Fail-safe capabilities for all objects in schema may be affected."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.retention_changed: true
        - not:
            ddl.schema.data_retention_days:
              eq: 0

  - id: SNW-SCHEMA-RETENTION-ZERO
    risk_level: high
    message: "ALTER SCHEMA SET DATA_RETENTION_TIME_IN_DAYS = 0 disables Time Travel for every object in the schema that uses the schema default. Dropped or modified data cannot be restored with UNDROP or AT/BEFORE queries — there is no recovery window for accidental or malicious data loss."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.data_retention_days:
            eq: 0

  - id: SNW-SCHEMA-SWAP
    risk_level: high
    message: "Schema swapped with another schema. All objects exchanged between schemas. Verify access controls."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.swapped: true


  - id: DBX-SCHEMA-MGLOC
    risk_level: medium
    message: "Schema created with MANAGED LOCATION. Data storage location overrides catalog/metastore default. Verify external location permissions."
    triggers:
      all_of:
        - kind: create_schema
        - ddl.schema.managed_location_present: true

  - id: DBX-SCHEMA-LOC
    risk_level: low
    message: "Schema created with custom LOCATION. Data will be stored at specified path instead of default warehouse directory."
    triggers:
      all_of:
        - kind: create_schema
        - ddl.schema.location_present: true

  - id: DBX-SCHEMA-OWNER-CHG
    risk_level: high
    message: "Schema ownership transferred via OWNER TO. New owner gains full control including DROP privileges. Verify authorization."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.actions:
            exists:
              kind: owner_to

  - id: DBX-SCHEMA-PREDOPT-CHG
    risk_level: low
    message: "Schema predictive optimization setting changed. This affects automatic optimization behavior for objects in the schema."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.actions:
            exists:
              kind: predictive_optimization

  - id: DBX-SCHEMA-COLLAT-CHG
    risk_level: low
    message: "Schema default collation changed. New objects in the schema will use the updated collation. Existing objects are not affected."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.actions:
            exists:
              kind: default_collation

  - id: DBX-SCHEMA-DBPROPS-CHG
    risk_level: medium
    message: "Schema DBPROPERTIES modified. Database properties affect schema metadata and may impact behavior."
    triggers:
      all_of:
        - kind: alter_schema
        - ddl.schema.actions:
            exists:
              kind:
                in: [set_properties, unset_properties, set_db_properties]


  - id: DBX-CAT-NEW
    risk_level: low
    message: "CREATE CATALOG provisions a new Unity Catalog namespace. All schemas, tables, and other objects within will inherit its permissions and default settings."
    triggers:
      all_of:
        - kind: create_catalog

  - id: DBX-CAT-OWNER-CHG
    risk_level: high
    message: "ALTER CATALOG ... OWNER TO transfers full administrative control of the catalog. The new owner gains MANAGE permissions on all objects within. Verify the target principal is authorized."
    triggers:
      all_of:
        - kind: alter_catalog
        - ddl.catalog.actions:
            exists:
              kind: owner_to

  - id: DBX-CAT-CASCADE-DROP
    risk_level: critical
    message: "DROP CATALOG CASCADE destroys the catalog AND all contained schemas, tables, views, and functions. This is an irreversible bulk data-loss operation."
    triggers:
      all_of:
        - kind: drop_catalog
        - ddl.options.cascade: true

  - id: DBX-CAT-DROP
    risk_level: high
    message: "DROP CATALOG removes a Unity Catalog namespace. The catalog must be empty unless CASCADE is specified. Verify no downstream dependencies exist."
    triggers:
      all_of:
        - kind: drop_catalog
        - ddl.options.cascade: false

  - id: DBX-CAT-TAG-CHG
    risk_level: medium
    message: "Catalog-level tags modified. Tags control governance policies (masking, row filters) across all objects in the catalog. Verify tag values are intentional."
    triggers:
      all_of:
        - kind: alter_catalog
        - ddl.catalog.actions:
            exists:
              kind: set_tags

  - id: DBX-CAT-TAG-RMV
    risk_level: medium
    message: "Catalog-level tags removed. Removing tags may disable governance policies (masking, row filtering) that depend on them."
    triggers:
      all_of:
        - kind: alter_catalog
        - ddl.catalog.actions:
            exists:
              kind: unset_tags

  - id: DBX-CAT-PREDOPT-CHG
    risk_level: low
    message: "Predictive optimization setting changed on catalog. This affects automatic maintenance operations (OPTIMIZE, VACUUM) for all tables within the catalog."
    triggers:
      all_of:
        - kind: alter_catalog
        - ddl.catalog.actions:
            exists:
              kind:
                in: [enable_predictive_optimization, disable_predictive_optimization, inherit_predictive_optimization]


  - id: DBX-VOL-NEW
    risk_level: low
    message: "CREATE VOLUME provisions a new Unity Catalog volume for file storage. External volumes reference cloud storage; managed volumes are fully governed by Unity Catalog."
    triggers:
      all_of:
        - kind: create_volume

  - id: DBX-VOL-OWNER-CHG
    risk_level: high
    message: "ALTER VOLUME ... OWNER TO transfers full administrative control of the volume. The new owner gains MANAGE permissions on the volume and its contents."
    triggers:
      all_of:
        - kind: alter_volume
        - ddl.volume.actions:
            exists:
              kind: owner_to

  - id: DBX-VOL-DROP
    risk_level: high
    message: "DROP VOLUME removes a Unity Catalog volume. Managed volumes lose stored files after 7 days; external volumes lose only metadata. This cannot be undone."
    triggers:
      all_of:
        - kind: drop_volume

  - id: DBX-VOL-NAME-CHG
    risk_level: medium
    message: "ALTER VOLUME ... RENAME TO changes the volume name. Existing file paths referencing /Volumes/catalog/schema/old_name will break."
    triggers:
      all_of:
        - kind: alter_volume
        - ddl.volume.actions:
            exists:
              kind: rename_to

  - id: DBX-VOL-TAG-CHG
    risk_level: low
    message: "Volume-level tags modified. Tags enable governance classification and policy enforcement on the volume."
    triggers:
      all_of:
        - kind: alter_volume
        - ddl.volume.actions:
            exists:
              kind: set_tags

  - id: DBX-VOL-TAG-RMV
    risk_level: medium
    message: "Volume-level tags removed. Removing tags may disable governance policies that depend on them for the volume."
    triggers:
      all_of:
        - kind: alter_volume
        - ddl.volume.actions:
            exists:
              kind: unset_tags

  - id: SNW-EXTVOL-CLOUD-ACCESS
    risk_level: low
    message: "External volume backs its data with external cloud object storage and assumes a cloud IAM role (STORAGE_AWS_ROLE_ARN) to reach the bucket. Review the role's trust policy and the bucket's access scope — this grants Snowflake standing access to storage outside its boundary."
    triggers:
      all_of:
        - kind: create_volume
        - ddl.volume.storage_locations:
            exists:
              has_role_arn: true

  - id: SNW-EXTVOL-WRITABLE
    risk_level: medium
    message: "External volume created with ALLOW_WRITES = TRUE. Snowflake can write data out to the external object store, not just read from it — a data-egress surface. Confirm write access to this external location is intended."
    triggers:
      all_of:
        - kind: create_volume
        - ddl.volume.allow_writes: true

  - id: SNW-EXTVOL-ENC-NONE
    risk_level: medium
    message: "External volume storage location specifies ENCRYPTION TYPE = NONE. Data written to this external object store is not server-side encrypted by the configured scheme. Confirm an alternative encryption control is in place."
    triggers:
      all_of:
        - kind: create_volume
        - ddl.volume.storage_locations:
            exists:
              encryption_type: "NONE"

  - id: DBX-EXTLOC-NEW
    risk_level: medium
    message: "External location created. This maps a cloud storage path to a Unity Catalog location with a storage credential. Verify the URL and credential are authorized."
    triggers:
      all_of:
        - kind: create_external_location

  - id: DBX-EXTLOC-URL-CHG
    risk_level: medium
    message: "External location URL modified. This changes the mapped cloud storage path for the location. Verify the new URL is intended and access boundaries remain correct."
    triggers:
      all_of:
        - kind: alter_external_location
        - ddl.external_location.actions:
            exists:
              kind:
                in: [rename_to, set_url]

  - id: DBX-EXTLOC-CRED-CHG
    risk_level: high
    message: "External location storage credential changed. This alters which cloud principal accesses the storage path. Verify least-privilege access and authorization boundaries."
    triggers:
      all_of:
        - kind: alter_external_location
        - ddl.external_location.actions:
            exists:
              kind: set_storage_credential

  - id: DBX-EXTLOC-OWNER-CHG
    risk_level: high
    message: "External location ownership transferred. The new owner gains administrative control over the location and its storage mapping. Verify this transfer is authorized."
    triggers:
      all_of:
        - kind: alter_external_location
        - ddl.external_location.actions:
            exists:
              kind: owner_to

  - id: DBX-EXTLOC-DROP
    risk_level: high
    message: "External location dropped. Unity Catalog objects relying on this location may lose access to underlying cloud storage. Verify dependency impact before dropping."
    triggers:
      all_of:
        - kind: drop_external_location


  - id: DBX-CONN-NEW
    risk_level: medium
    message: "External connection created. This establishes a federated connection to an external data system (e.g., PostgreSQL, MySQL, Snowflake). Verify the connection type, host, and credentials are authorized."
    triggers:
      all_of:
        - kind: create_connection

  - id: DBX-CONN-DROP
    risk_level: high
    message: "External connection dropped. Foreign catalogs and federated queries depending on this connection will fail. Verify no active resources depend on this connection."
    triggers:
      all_of:
        - kind: drop_connection

  - id: MSSQL-EXT-DATA-SOURCE-CREDENTIAL
    risk_level: medium
    message: "External data source registered or reconfigured with a stored credential. Queries through it reach an external endpoint authenticated by a persisted credential; verify the endpoint and credential are authorized and least-privilege."
    triggers:
      all_of:
        - kind:
            in: [create_external_data_source, alter_external_data_source]
        - ddl.external_data_source.credential_referenced: true

  - id: MSSQL-EXT-DATA-SOURCE-PUBLIC-ENDPOINT
    risk_level: medium
    message: "External data source points at a public / offsite endpoint. Data read or written through it crosses the instance boundary to internet-reachable storage; verify the destination is authorized."
    triggers:
      all_of:
        - kind:
            in: [create_external_data_source, alter_external_data_source]
        - ddl.external_data_source.location_scheme:
            in: [http, https, wasb, wasbs, abfs, abfss, s3, s3a, gs]

  - id: INFO-MSSQL-EXT-DATA-SOURCE
    risk_level: info
    message: "External data source registered. This declares a federated endpoint (Hadoop, blob storage, remote database, or sharded database) that queries can reach. Positive governance signal — documents an external connectivity surface."
    triggers:
      all_of:
        - kind: create_external_data_source

  - id: INFO-MSSQL-EXT-DATA-SOURCE-ALTER
    risk_level: info
    message: "External data source reconfigured. An ALTER changes where an existing federated endpoint points or which credential it uses — a redirect of a connectivity surface that downstream queries already trust. Verify the new location and credential are authorized."
    triggers:
      all_of:
        - kind: alter_external_data_source

  - id: DBX-CONN-OWNER-CHG
    risk_level: high
    message: "External connection ownership transferred. The new owner gains full control over the federated connection and its credentials. Verify this transfer is authorized."
    triggers:
      all_of:
        - kind: alter_connection
        - ddl.connection.actions:
            exists:
              kind: owner_to

  - id: DBX-CONN-NAME-CHG
    risk_level: medium
    message: "External connection renamed. Foreign catalogs and queries referencing the old connection name may need to be updated."
    triggers:
      all_of:
        - kind: alter_connection
        - ddl.connection.actions:
            exists:
              kind: rename_to

  - id: DBX-CONN-CHG
    risk_level: medium
    message: "External connection options changed. Connection credentials (host, port, password) have been modified. Verify the new options are correct and authorized."
    triggers:
      all_of:
        - kind: alter_connection
        - ddl.connection.actions:
            exists:
              kind: options

  - id: SNW-CONN-REPLICA
    risk_level: low
    message: "Connection created AS REPLICA OF a connection in another account. This account now mirrors a connection owned elsewhere for cross-account failover/DR. Confirm the source account and the replication relationship are authorized."
    triggers:
      all_of:
        - kind: create_connection
        - ddl.connection.is_replica: true

  - id: SNW-CONN-FAILOVER-ENABLE
    risk_level: medium
    message: "ENABLE FAILOVER opens this connection — and any credentials it carries — to failover into the listed accounts. The connection becomes usable from those accounts. Confirm every target account is authorized to assume this connection."
    triggers:
      all_of:
        - kind: alter_connection
        - ddl.connection.actions:
            exists:
              kind: enable_failover

  - id: DBX-CRED-DROP
    risk_level: high
    message: "Storage credential dropped. External locations and tables depending on this credential will lose access. Verify no active resources depend on this credential."
    triggers:
      all_of:
        - kind: drop_storage_credential


  - id: DBX-FLOW-NEW
    risk_level: low
    message: "CREATE FLOW defines a Lakeflow CDC pipeline (AUTO CDC INTO or APPLY CHANGES INTO). Verify keys, sequencing, and SCD mode align with data governance expectations."
    triggers:
      all_of:
        - kind: create_flow


  - id: SNW-ROLE-PRIV-USE
    risk_level: critical
    message: "Privileged role should not be hardcoded in scripts. Use role grants or session variables instead."
    triggers:
      all_of:
        - kind: use
        - use_stmt.kind: role
        - use_stmt.target.normalized:
            in:
              - ACCOUNTADMIN
              - SECURITYADMIN
              - SYSADMIN
              - USERADMIN
              - ORGADMIN
              - ACCOUNT ADMINS
              - METASTORE ADMINS
              - WORKSPACE ADMINS
              - ACCOUNT_ADMINS
              - METASTORE_ADMINS
              - WORKSPACE_ADMINS


  - id: SNW-TASK-NEW
    risk_level: low
    message: "Scheduled task created. Automated SQL execution configured."
    triggers:
      kind: create_task

  - id: SNW-TASK-DROP
    risk_level: high
    message: "Scheduled task dropped. Automated workflow removed."
    triggers:
      kind: drop_task

  - id: SNW-TASK-RESUME
    risk_level: medium
    message: "Task resumed. Automated execution is now active."
    triggers:
      all_of:
        - kind: alter_task
        - ddl.task.actions:
            exists:
              kind: resume

  - id: SNW-TASK-SUSPEND
    risk_level: low
    message: "Task suspended. Automated execution paused."
    triggers:
      all_of:
        - kind: alter_task
        - ddl.task.actions:
            exists:
              kind: suspend

  - id: SNW-TASK-BODY-CHG
    risk_level: medium
    message: "Task SQL body modified. Review the new logic for correctness."
    triggers:
      all_of:
        - kind: alter_task
        - ddl.task.actions:
            exists:
              kind: modify_as

  - id: SNW-TASK-DEP-CHG
    risk_level: medium
    message: "Task dependency chain modified. Verify DAG execution order."
    triggers:
      all_of:
        - kind: alter_task
        - any_of:
            - ddl.task.actions:
                exists:
                  kind: add_after
            - ddl.task.actions:
                exists:
                  kind: remove_after

  - id: SNW-TASK-EXECAS
    risk_level: high
    message: "Task EXECUTE AS configured. Verify privilege escalation is intentional."
    triggers:
      all_of:
        - kind: create_task
        - ddl.task.create_options.execute_as:
            exists: true

  - id: SNW-TASK-PARSE-ERR
    risk_level: medium
    message: "Task body SQL could not be parsed. Lineage extraction incomplete."
    triggers:
      all_of:
        - kind: create_task
        - ddl.task.create_options.body.parse: unparseable

  - id: SNW-TASK-OVERLAP-ALL
    risk_level: high
    message: "OVERLAP_POLICY = ALLOW_ALL_OVERLAP. Multiple instances of the entire task graph, including the root task, can run concurrently. Risk of resource contention, duplicate processing, and data races."
    triggers:
      all_of:
        - kind: create_task
        - ddl.task.create_options.overlap_policy: allow_all_overlap

  - id: SNW-TASK-OVERLAP-CHILD
    risk_level: medium
    message: "OVERLAP_POLICY = ALLOW_CHILD_OVERLAP. A new task graph instance starts while child tasks are still running. Verify child tasks are idempotent."
    triggers:
      all_of:
        - kind: create_task
        - any_of:
            - ddl.task.create_options.overlap_policy: allow_child_overlap
            - ddl.task.create_options.allow_overlapping_execution: true


  - id: UDF-NEW
    risk_level: low
    message: "User-defined function created. Verify return type and usage patterns."
    triggers:
      kind: create_function

  - id: UDF-DYNSQL
    risk_level: high
    message: "User-defined function executes dynamic SQL with potential injection vector. SQL injection risk if inputs are not validated. Consider parameterized queries (e.g. USING clause)."
    triggers:
      any_of:
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]
        - all_of:
            - kind: create_function
            - ddl.function.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization:
                        in: [none, not_applicable]

  - id: UDF-SECURE-RMV
    risk_level: high
    message: "SECURE flag removed from function. Function body is now visible to users with USAGE privilege."
    triggers:
      all_of:
        - kind: alter_function
        - ddl.function.actions:
            exists:
              kind: unset_secure

  - id: INFO-UDF-SECURE-ADD
    risk_level: info
    message: "Function secured. Function body is now hidden from users without ownership."
    triggers:
      all_of:
        - kind: alter_function
        - ddl.function.actions:
            exists:
              kind: set_secure

  - id: UDF-EXTACC-CFG
    risk_level: medium
    message: "Function configured with external access integrations or secrets. Review access permissions."
    triggers:
      all_of:
        - kind: alter_function
        - ddl.function.actions:
            exists:
              all_of:
                - kind: set_properties
                - properties.keys:
                    contains_any:
                      - external_access_integrations
                      - secrets

  - id: FUNC-DROP
    risk_level: medium
    message: "DROP FUNCTION detected. Function definition removed. Verify no dependencies."
    triggers:
      kind: drop_function


  - id: PROC-NEW
    risk_level: low
    message: "Stored procedure created. Verify business logic and access controls."
    triggers:
      kind: create_procedure

  - id: PROC-DYNSQL
    risk_level: high
    message: "Stored procedure executes dynamic SQL with potential injection vector. SQL injection risk if inputs are not validated. Consider parameterized queries (e.g. USING clause / sp_executesql parameters)."
    triggers:
      any_of:
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  argument:
                    in: [concat, format]
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.dynamic_sql_calls:
                exists:
                  all_of:
                    - argument:
                        not_in: [literal, format_quoted, concat_quoted]
                    - parameterization:
                        in: [none, not_applicable]

  - id: PROC-DROP
    risk_level: medium
    message: "DROP PROCEDURE detected. Procedure definition removed. Verify no dependencies."
    triggers:
      kind: drop_procedure

  - id: PROC-SECURE-RMV
    risk_level: high
    message: "SECURE flag removed from procedure. Procedure body is now visible to users with USAGE privilege."
    triggers:
      all_of:
        - kind: alter_procedure
        - ddl.procedure.actions:
            exists:
              kind: unset_secure

  - id: INFO-PROC-SECURE-ADD
    risk_level: info
    message: "Procedure secured. Procedure body is now hidden from users without ownership."
    triggers:
      all_of:
        - kind: alter_procedure
        - ddl.procedure.actions:
            exists:
              kind: set_secure

  - id: PROC-EXECAS-OWNER
    risk_level: medium
    message: "Procedure set to EXECUTE AS OWNER. RISK: If owner has elevated privileges (e.g., deploy role), this grants all callers elevated access. Consider EXECUTE AS CALLER for better privilege isolation."
    triggers:
      any_of:
        - all_of:
            - kind: alter_procedure
            - ddl.procedure.actions:
                exists:
                  all_of:
                    - kind: execute_as
                    - execute_as_mode: owner
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.execute_as_mode: owner

  - id: PROC-EXECAS-CALLER
    risk_level: low
    message: "Procedure set to EXECUTE AS CALLER. Runs with invoker's privileges. Safer than OWNER if procedure owner has elevated rights (e.g., deploy role). Context-dependent security."
    triggers:
      any_of:
        - all_of:
            - kind: alter_procedure
            - ddl.procedure.actions:
                exists:
                  all_of:
                    - kind: execute_as
                    - execute_as_mode: caller
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.execute_as_mode: caller

  - id: PROC-EXECAS-RESTRICT
    risk_level: high
    message: "Procedure set to EXECUTE AS RESTRICTED CALLER. This is a significant compromise between security models - review carefully."
    triggers:
      any_of:
        - all_of:
            - kind: alter_procedure
            - ddl.procedure.actions:
                exists:
                  all_of:
                    - kind: execute_as
                    - execute_as_mode: restricted_caller
        - all_of:
            - kind: create_procedure
            - ddl.procedure.body.execute_as_mode: restricted_caller

  - id: PROC-EXTACC-CFG
    risk_level: medium
    message: "Procedure configured with external access integrations or secrets. Review access permissions."
    triggers:
      all_of:
        - kind: alter_procedure
        - ddl.procedure.actions:
            exists:
              all_of:
                - kind: set_properties
                - properties.keys:
                    contains_any:
                      - external_access_integrations
                      - secrets


  - id: SNW-DB-FROM-SHARE
    risk_level: high
    message: "Database created from share. Data is being accessed from external provider. Verify data governance compliance."
    triggers:
      all_of:
        - kind: create_database
        - ddl.database.create_origin.kind: from_share

  - id: SNW-DB-REPLICA
    risk_level: medium
    message: "Database created as replica. Data is being replicated from another region/account."
    triggers:
      all_of:
        - kind: create_database
        - ddl.database.create_origin.kind: as_replica

  - id: SNW-DB-SWAP
    risk_level: high
    message: "Database swapped with another database. All objects exchanged between databases. Verify access controls."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: swap_with

  - id: SNW-DB-RETENTION-CHG
    risk_level: high
    message: "Database data retention period changed. Time Travel and Fail-safe capabilities may be affected."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              all_of:
                - kind: set_properties
                - properties.keys:
                    contains: data_retention_time_in_days
                - not:
                    properties.data_retention_days:
                      eq: 0

  - id: SNW-DB-RETENTION-ZERO
    risk_level: high
    message: "ALTER DATABASE SET DATA_RETENTION_TIME_IN_DAYS = 0 disables Time Travel for every object in the database that uses the database default. Dropped or modified data cannot be restored with UNDROP or AT/BEFORE queries — there is no recovery window for accidental or malicious data loss."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              all_of:
                - kind: set_properties
                - properties.data_retention_days:
                    eq: 0

  - id: SNW-TBL-RETENTION-ZERO
    risk_level: medium
    message: "Table set with DATA_RETENTION_TIME_IN_DAYS = 0, disabling Time Travel for the table. Dropped or modified rows cannot be recovered with UNDROP or AT/BEFORE queries — there is no recovery window for accidental or malicious changes. Permanent tables holding retained data should keep a non-zero retention period."
    triggers:
      all_of:
        - kind:
            in: [create_table, alter_table]
        - ddl.table.data_retention_days:
            eq: 0
        - not:
            ddl.options.temporary: true

  - id: SNW-DB-REPL-ON
    risk_level: high
    message: "Database replication enabled. Data will be replicated to other accounts/regions. Verify compliance with data residency requirements."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: enable_replication

  - id: SNW-DB-REPL-OFF
    risk_level: high
    message: "Database replication disabled. Disaster recovery capabilities reduced."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: disable_replication

  - id: SNW-DB-FAILOVER-ON
    risk_level: medium
    message: "Database failover enabled. Account can be promoted as failover target."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: enable_failover

  - id: SNW-DB-FAILOVER-OFF
    risk_level: high
    message: "Database failover disabled. Disaster recovery failover capability removed."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: disable_failover

  - id: SNW-DB-FAILOVER-PROMOTE
    risk_level: critical
    message: "Database promoted to primary. This is a failover event. The database is now writable and replication direction has changed."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: primary

  - id: SNW-DB-REFRESH
    risk_level: medium
    message: "Database refresh initiated from primary. Local changes may be overwritten."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: refresh


  - id: DB-CLONE
    risk_level: medium
    message: "Database cloned from existing database. Verify access controls are appropriate for the clone."
    triggers:
      all_of:
        - kind: create_database
        - ddl.database.create_origin.kind: clone

  - id: DB-NAME-CHG
    risk_level: medium
    message: "Database renamed. Verify all references to the old name are updated."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: rename_to

  - id: DB-PROPS-CHG
    risk_level: medium
    message: "Database properties modified. Configuration change may affect behavior."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind:
                in: [set_properties, unset_properties, set_comment, unset_comment, opaque]

  - id: DB-TAG-ADD
    risk_level: low
    message: "Database tag assigned. Governance metadata updated."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: set_tag

  - id: DB-TAG-RMV
    risk_level: medium
    message: "Database tag removed. Governance metadata may be incomplete. Verify tag removal is intentional."
    triggers:
      all_of:
        - kind: alter_database
        - ddl.database.actions:
            exists:
              kind: unset_tag


  - id: SNW-WH-NEW
    risk_level: low
    message: "Warehouse created. New compute resource provisioned."
    triggers:
      kind: create_warehouse

  - id: SNW-WH-LARGE
    risk_level: medium
    message: "Warehouse created with very large size (4XL+). Significant cost impact — verify workload justifies size."
    triggers:
      all_of:
        - kind: create_warehouse
        - ddl.warehouse.large_size: true

  - id: SNW-WH-SNOWPARK
    risk_level: medium
    message: "Snowpark-optimized warehouse created. Specialized compute for ML/data engineering workloads."
    triggers:
      all_of:
        - kind: create_warehouse
        - ddl.warehouse.snowpark_optimized: true

  - id: SNW-WH-NO-AUTOSUSPEND
    risk_level: medium
    message: "Warehouse auto-suspend disabled (AUTO_SUSPEND = 0). Credits will be consumed continuously."
    triggers:
      all_of:
        - kind: create_warehouse
        - ddl.warehouse.auto_suspend_zero: true

  - id: INFO-SNW-WH-RESMON
    risk_level: info
    message: "Resource monitor assigned to warehouse. Cost governance in place."
    triggers:
      all_of:
        - kind: create_warehouse
        - ddl.warehouse.resource_monitor_set: true

  - id: SNW-WH-MULTICLUSTER
    risk_level: low
    message: "Multi-cluster warehouse configured. Scaling parameters affect cost and concurrency."
    triggers:
      all_of:
        - kind: create_warehouse
        - ddl.warehouse.multi_cluster: true

  - id: SNW-WH-DROP
    risk_level: critical
    message: "DROP WAREHOUSE detected. Compute resource permanently removed. Active queries and dependent tasks will fail."
    triggers:
      kind: drop_warehouse

  - id: SNW-WH-SUSPEND
    risk_level: low
    message: "Warehouse suspended. Compute paused — no credits consumed while suspended."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.suspended: true

  - id: SNW-WH-RESUME
    risk_level: medium
    message: "Warehouse resumed. Compute is now active and consuming credits."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.resumed: true

  - id: SNW-WH-ABORT
    risk_level: high
    message: "ABORT ALL QUERIES on warehouse. All running queries terminated immediately."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.queries_aborted: true

  - id: SNW-WH-RENAME
    risk_level: medium
    message: "Warehouse renamed. References using old name will break."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.renamed: true

  - id: SNW-WH-SIZE-CHG
    risk_level: medium
    message: "Warehouse size changed. Cost and performance characteristics altered."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.set_changes_size: true

  - id: SNW-WH-SET
    risk_level: low
    message: "Warehouse properties modified via SET."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.set: true

  - id: SNW-WH-TAG-SET
    risk_level: low
    message: "Tag assigned to warehouse. Governance metadata applied."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.tag_set: true

  - id: SNW-WH-TAG-UNSET
    risk_level: medium
    message: "Tag removed from warehouse. Governance metadata lost."
    triggers:
      all_of:
        - kind: alter_warehouse
        - ddl.warehouse.tag_unset: true


  - id: TBL-DROP
    risk_level: critical
    message: "DROP TABLE detected. Table and all data will be permanently deleted."
    triggers:
      kind: drop_table

  - id: TBL-TRUNCATE
    risk_level: critical
    message: "TRUNCATE TABLE detected. All rows will be permanently deleted."
    triggers:
      kind: truncate

  - id: TBL-REPLACE
    risk_level: high
    message: "CREATE OR REPLACE TABLE detected. Existing table definition (and potentially data semantics) is replaced."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.or_replace: true

  - id: TBL-RENAME
    risk_level: medium
    message: "ALTER TABLE RENAME detected. Downstream references (queries, views, jobs) may break if not updated."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.renamed: true

  - id: TBL-COL-ADD
    risk_level: low
    message: "ALTER TABLE ADD COLUMN detected. Schema expanded; verify downstream contracts and ingestion mappings."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.column_added: true

  - id: TBL-COL-DROP
    risk_level: high
    message: "ALTER TABLE DROP COLUMN detected. Column data and dependent objects may be lost or broken."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.column_dropped: true

  - id: TBL-MASK-ADD
    risk_level: low
    message: "Column masking or projection policy added. Positive governance signal."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.masking_policy_added: true

  - id: TBL-MASK-RMV
    risk_level: critical
    message: "Masking or Projection Policy removed from column. This exposes PII or sensitive data."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.masking_policy_removed: true

  - id: TBL-RAP-ADD
    risk_level: low
    message: "Row Access Policy added to table. Positive governance signal."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.row_access_policy_added: true

  - id: TBL-RAP-RMV
    risk_level: high
    message: "Row Access Policy removed from table. This may expose sensitive data to unauthorized users."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.row_access_policy_removed: true

  - id: TBL-RAP-RMV-ALL
    risk_level: critical
    message: "All Row Access Policies dropped from table. All row-level access controls removed from this table."
    triggers:
      kind: drop_all_row_access_policies

  - id: TBL-AGGPOL-RMV
    risk_level: medium
    message: "Aggregation or Join Policy removed from table. This may allow unrestricted data aggregation or joins."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.aggregation_policy_removed: true

  - id: TBL-JOINPOL-SET
    risk_level: medium
    message: "Join policy attached to table via SET JOIN POLICY. The table's join behavior is now governed by the named policy — confirm the policy enforces the intended restriction."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: set_join_policy

  - id: TBL-AGGPOL-SET
    risk_level: medium
    message: "Aggregation policy attached to table via SET AGGREGATION POLICY. The table's aggregation/privacy constraints are now governed by the named policy — confirm it enforces the intended minimum group size."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: set_aggregation_policy

  - id: TBL-DMF-ADD
    risk_level: low
    message: "Data metric function attached to table via ADD DATA METRIC FUNCTION. Data-quality monitoring is now in place on the named columns."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: add_data_metric_function

  - id: TBL-DMF-DROP
    risk_level: medium
    message: "Data metric function detached from table via DROP DATA METRIC FUNCTION. The data-quality monitor it provided is removed."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: drop_data_metric_function

  - id: TBL-TAG-ADD
    risk_level: low
    message: "Tag added to object. Positive governance signal."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.tag_set: true

  - id: TBL-TAG-RMV
    risk_level: medium
    message: "Tag removed from object. Governance metadata may be incomplete."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.tag_unset: true


  - id: DBX-TBL-PROPS-CHG
    risk_level: medium
    message: "Delta table properties modified via SET TBLPROPERTIES. Properties like delta.deletedFileRetentionDuration, delta.logRetentionDuration, or delta.appendOnly control data retention, time travel, and mutability. Verify the new values are authorized and won't cause data loss."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: set_tbl_properties

  - id: DBX-TBL-PROPS-RMV
    risk_level: high
    message: "Delta table properties removed via UNSET TBLPROPERTIES. Removing properties like delta.deletedFileRetentionDuration or delta.appendOnly resets them to system defaults, which may reduce retention periods or re-enable mutations on append-only tables."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: unset_tbl_properties

  - id: DBX-TBL-CLUSTER-OFF
    risk_level: high
    message: "CLUSTER BY NONE disables liquid clustering on a Delta table. Newly inserted or updated data will no longer be clustered, degrading query performance over time. OPTIMIZE will no longer recluster data. Verify this is intentional."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              all_of:
                - kind: cluster_by
                - disabled: true

  - id: DBX-TBL-CLONE-SHALLOW
    risk_level: medium
    message: "SHALLOW CLONE created. Shallow clones share underlying data files with the source table — they do not duplicate data. If the source table is VACUUM'd or dropped, the clone may become unreadable. Prefer DEEP CLONE for durable, independent copies."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.clone.kind: shallow

  - id: INFO-TBL-CLONE
    risk_level: info
    message: "Table cloned. CLONE creates a copy of a table. In Snowflake, clones are zero-copy and share storage until modified. In Databricks, SHALLOW clones share data files while DEEP clones duplicate them."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.clone.kind:
            in: [shallow, deep, standard]

  - id: SNW-ICEBERG-TABLE
    risk_level: low
    message: "Iceberg table created. Its data resides in an external object-storage volume (EXTERNAL VOLUME) governed by an Iceberg catalog rather than Snowflake-managed storage. Confirm the external volume's cloud credentials, bucket policy, and catalog access are governed — table data sits outside Snowflake's storage boundary."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.variant.kind: iceberg

  - id: INFO-SNW-HYBRID-TABLE
    risk_level: info
    message: "Hybrid table created. Hybrid (Unistore) tables are row-oriented OLTP storage with enforced primary-key, unique, and foreign-key constraints, distinct from standard analytical tables."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.variant.kind: hybrid

  - id: SNW-EVENT-TABLE
    risk_level: low
    message: "Event table created. Event tables capture log and trace events emitted by procedures, functions, and sessions; their payloads may contain sensitive data. Confirm access controls and a retention policy are in place."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.variant.kind: event

  - id: RS-DIST-ALL
    risk_level: medium
    message: "DISTSTYLE ALL replicates the entire table to every compute node. Storage and load cost scale with cluster size; it is intended only for small, slowly-changing dimension tables. Verify the table is small enough to justify full replication."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.dist_style.kind: all

  - id: RS-BACKUP-NO
    risk_level: high
    message: "BACKUP NO excludes this table from automated and manual cluster snapshots. Its data is NOT recoverable from a snapshot restore. Confirm the table is genuinely transient (e.g. staging/scratch) before disabling backups."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.backup.kind: "no"

  - id: RS-SORTKEY-INTERLEAVED
    risk_level: info
    message: "INTERLEAVED SORTKEY weights every sort column equally but carries higher VACUUM REINDEX maintenance cost and degrades as the table grows. Prefer COMPOUND SORTKEY unless queries filter on many sort columns independently."
    triggers:
      all_of:
        - kind: create_table
        - ddl.table.sort_key.kind: interleaved

  - id: RS-DATASHARE-NEW
    risk_level: low
    message: "Datashare created (Redshift cross-account / cross-cluster data-sharing object). Objects added to it become queryable by consumer namespaces or AWS accounts; review what gets shared."
    triggers:
      all_of:
        - kind: create_datashare

  - id: RS-DATASHARE-PUBLIC
    risk_level: critical
    message: "Datashare set PUBLICACCESSIBLE TRUE — its objects are shareable with ANY AWS account, not just authorized consumer namespaces. This is a broad cross-account data-exposure surface. Confirm public accessibility is intended."
    triggers:
      all_of:
        - kind: { in: [create_datashare, alter_datashare] }
        - ddl.datashare.publicly_accessible: true

  - id: RS-DATASHARE-OBJ-ADD
    risk_level: low
    message: "Object added to a datashare — it becomes queryable by the datashare's consumer accounts/namespaces. Verify the table or schema is authorized for cross-account sharing."
    triggers:
      all_of:
        - kind: alter_datashare
        - ddl.datashare.added_objects:
            exists:
              object_kind: { in: [table, schema] }

  - id: RS-DATASHARE-INCLUDENEW
    risk_level: medium
    message: "Datashare set to auto-include newly created objects (INCLUDENEW) for a schema — future tables/views are shared with consumers automatically, with no per-object review. Verify implicit sharing of future objects is intended."
    triggers:
      all_of:
        - kind: alter_datashare
        - ddl.datashare.includenew_set: true



  - id: DBX-TBL-OPT
    risk_level: low
    message: "OPTIMIZE compacts small files in a Delta table. May be resource-intensive on large tables — schedule during off-peak hours."
    triggers:
      all_of:
        - kind: dbx_optimize

  - id: DBX-VACUUM-ZERO
    risk_level: critical
    message: "VACUUM RETAIN 0 HOURS. All historical data files will be permanently deleted immediately, destroying time travel capability and breaking any concurrent operations. This is irreversible data loss."
    triggers:
      all_of:
        - kind: dbx_vacuum
        - ddl.table_maintenance.vacuum.retain_hours:
            eq: 0

  - id: DBX-VACUUM-LOWRET
    risk_level: high
    message: "VACUUM with retention period below 7 days (168 hours). This may delete data files needed for time travel or concurrent operations, leading to data loss or query failures."
    triggers:
      all_of:
        - kind: dbx_vacuum
        - ddl.table_maintenance.vacuum.retain_hours:
            lt: 168

  - id: INFO-DBX-TBL-HIST
    risk_level: info
    message: "DESCRIBE HISTORY retrieves the provenance log for a Delta table. This is a read-only audit operation — no data is modified."
    triggers:
      all_of:
        - kind: dbx_describe_history

  - id: INFO-DBX-TBL-REPAIR
    risk_level: info
    message: "REPAIR TABLE (MSCK REPAIR TABLE) updates the Hive metastore partition metadata for a partitioned table. This is a metadata maintenance operation; it does not rewrite table data."
    triggers:
      all_of:
        - kind: dbx_repair_table

  - id: INFO-DBX-TBL-CLUSTER-CFG
    risk_level: info
    message: "Liquid clustering configured on Delta table. Run OPTIMIZE to apply clustering to existing data."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              all_of:
                - kind: cluster_by
                - disabled: false

  - id: DBX-TBL-RESTORE
    risk_level: high
    message: "RESTORE reverts a Delta table to a previous version. This is a data-modifying operation that replaces the current table state with a prior snapshot — downstream consumers may see unexpected data."
    triggers:
      all_of:
        - kind: dbx_restore

  - id: DBX-MERGE-SCHEMA-EVO
    risk_level: medium
    message: "MERGE WITH SCHEMA EVOLUTION enabled. Target Delta table schema may be automatically altered to match source columns. Validate schema-governance controls and downstream compatibility."
    triggers:
      all_of:
        - kind: merge
        - query.merge.with_schema_evolution: true

  - id: DBX-TBL-CACHE
    risk_level: low
    message: "CACHE TABLE caches a table or query result in Spark's in-memory cache. This consumes cluster memory and may affect other workloads. Schedule during off-peak hours for large tables."
    triggers:
      all_of:
        - kind: dbx_cache_table
        - ddl.table_maintenance.cache.lazy: false

  - id: INFO-DBX-TBL-CACHE-LAZY
    risk_level: info
    message: "CACHE LAZY TABLE registers a table for deferred caching — data is only cached on first access. Lower impact than eager CACHE TABLE."
    triggers:
      all_of:
        - kind: dbx_cache_table
        - ddl.table_maintenance.cache.lazy: true

  - id: DBX-TBL-UNCACHE
    risk_level: low
    message: "UNCACHE TABLE removes a table from Spark's in-memory cache. Subsequent queries will read from storage, which may increase latency."
    triggers:
      all_of:
        - kind: dbx_uncache_table


  - id: Q-PRED-CONTRA
    risk_level: critical
    message: "Contradictory equality: predicate can never be true (e.g., WHERE a=1 AND a=2). Query will return zero rows."
    triggers:
      all_of:
        - query.column_constraints:
            each:
              anomalies:
                contains: equality_disjoint

  - id: Q-PRED-RANGE
    risk_level: high
    message: "Impossible range: predicates define an empty range (e.g., WHERE x>10 AND x<5). Query will return zero rows."
    triggers:
      all_of:
        - query.column_constraints:
            each:
              anomalies:
                contains: range_empty

  - id: Q-PRED-TAUTOLOGY
    risk_level: medium
    message: "Tautological predicate: condition is always true for non-NULL values (e.g., WHERE x=1 OR x<>1). The WHERE clause filters at most NULL rows."
    triggers:
      all_of:
        - query.or_tautologies:
            each: {}

  - id: Q-PRED-REDUNDANT
    risk_level: low
    message: "Redundant predicate: condition is already implied by another predicate (e.g., WHERE x>5 AND x>3). The weaker predicate has no effect."
    triggers:
      all_of:
        - query.column_constraints:
            each:
              anomalies:
                contains: atom_subsumed

  - id: Q-AGG-MANYDIM
    risk_level: medium
    message: "GROUP BY with many columns (>5) may indicate design issues or produce sparse results."
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.scopes:
            each:
              group_by:
                count:
                  gt: 5

  - id: Q-SUBQ-SCALAR
    risk_level: medium
    message: |
      Scalar subquery in SELECT list. Consider rewriting as JOIN:
      - Conceptual N+1: subquery executes once per row (optimizer may help, but not always)
      - Runtime error if subquery returns > 1 row
      - Returns NULL if no match (unlike INNER JOIN which filters the row)

      Recommendations:
      1. LEFT JOIN if the value is optional (preserves NULLs)
      2. INNER JOIN if the value is required (filters rows)
      3. EXISTS in WHERE if you only need a boolean check
    triggers:
      all_of:
        - query.scopes:
            each:
              scalar_subqueries:
                each:
                  all_of:
                    - kind: scalar
                    - position: projection

  - id: Q-AGG-NOFILT
    risk_level: low
    message: "Aggregate query without effective WHERE filter. Consider adding filters to avoid processing entire tables."
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.scopes:
            each:
              all_of:
                - kind: outer
                - aggregates:
                    count: { gt: 0 }
                - any_of:
                    - group_by:
                        count: { gt: 0 }
                    - aggregates:
                        exists:
                          function:
                            neq: count_star

  - id: Q-SUBQ-CORR-SEL
    risk_level: high
    message: "Correlated scalar subquery (N+1 query pattern). Consider rewriting as JOIN for better performance."
    triggers:
      all_of:
        - query.scopes:
            each:
              scalar_subqueries:
                each:
                  all_of:
                    - correlated: true
                    - kind: scalar

  - id: Q-SUBQ-CORR-WHERE
    risk_level: medium
    message: "Correlated subquery in WHERE/IN clause. May cause performance issues on large datasets. Consider rewriting with EXISTS or JOIN."
    triggers:
      all_of:
        - query.scopes:
            each:
              scalar_subqueries:
                each:
                  all_of:
                    - correlated: true
                    - kind:
                        in: [in_subquery, not_in_subquery]


  - id: Q-AGG-NONDET
    risk_level: medium
    message: "Non-deterministic expression in GROUP BY context. Results may vary between executions with same data."
    triggers:
      all_of:
        - query.scopes:
            each:
              aggregates:
                each:
                  deterministic: false

  - id: Q-WIN-NONDET
    risk_level: high
    message: "Non-deterministic expression in window function. Results may vary between executions with same data."
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  deterministic: false

  - id: Q-NONDET
    risk_level: medium
    message: "Query contains non-deterministic elements. Results may vary between executions."
    triggers:
      all_of:
        - any_of:
            - query.scopes:
                each:
                  aggregates:
                    each:
                      deterministic: false
            - query.scopes:
                each:
                  window_functions:
                    each:
                      deterministic: false
            - query.scopes:
                each:
                  projections:
                    each:
                      all_of:
                        - expr.kind: subquery
                        - expr.subquery.inner_facts.scopes:
                            each:
                              any_of:
                                - aggregates:
                                    each:
                                      deterministic: false
                                - window_functions:
                                    each:
                                      deterministic: false
            - query.scopes:
                each:
                  where_predicates:
                    each:
                      all_of:
                        - root.kind: subquery
                        - root.subquery.inner_facts.scopes:
                            each:
                              any_of:
                                - aggregates:
                                    each:
                                      deterministic: false
                                - window_functions:
                                    each:
                                      deterministic: false

  - id: Q-WIN-MULTIPART
    risk_level: medium
    message: "Multiple window functions with different PARTITION BY clauses. Query will re-partition data multiple times, causing additional shuffles."
    triggers:
      all_of:
        - query.scopes:
            each:
              has_multiple_partition_schemes: true


  - id: Q-TBL-UNBOUNDED-CENH
    risk_level: high
    message: "Unbounded query on large table — WHERE clause is absent or tautological. Consider adding filters to reduce data scanned. [Catalog-enhanced]"
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.reads_table:
            exists:
              row_count:
                gte: 1000000

  - id: Q-TBL-SELSTAR-WIDE-CENH
    risk_level: medium
    message: "SELECT * on wide table (50+ columns). Scanning many unnecessary columns increases I/O and network transfer. Consider explicit column selection. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              star_projections:
                count: { gt: 0 }
        - query.reads_table:
            each:
              column_count:
                gte: 50

  - id: Q-AGG-NOFILT-CENH
    risk_level: medium
    message: "Aggregating a large table (1M+ rows) without effective WHERE filter. Consider adding time/partition filters to reduce scan size. [Catalog-enhanced]"
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.scopes:
            each:
              all_of:
                - kind: outer
                - aggregates:
                    count: { gt: 0 }
        - query.reads_table:
            each:
              row_count:
                gte: 1000000

  - id: Q-WIN-NOPART-CENH
    risk_level: high
    message: "Window function without PARTITION BY operates on entire large table (1M+ rows) in single partition. Add PARTITION BY to reduce memory pressure. [Catalog-enhanced]"
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.scopes:
            each:
              window_functions:
                each:
                  partition_by:
                    count:
                      eq: 0
        - query.reads_table:
            each:
              row_count:
                gte: 1000000

  - id: Q-WIN-UNBOUNDED-CENH
    risk_level: critical
    message: "Window function with unbounded frame and no PARTITION BY. Extremely expensive on large datasets - entire table processed as one partition. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  all_of:
                    - partition_by:
                        count:
                          eq: 0
                    - frame.start.kind: unbounded_preceding
                    - frame.end.kind: unbounded_following
        - query.reads_table:
            each:
              row_count:
                gte: 100000

  - id: Q-WIN-HICARD-CENH
    risk_level: high
    message: "Window function partitioned on high-cardinality column. May cause performance issues. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  partition_high_cardinality: true
        - query.reads_table:
            each:
              row_count:
                gte: 10000000

  - id: Q-WIN-USAGE
    risk_level: low
    message: "Window function usage detected. Verify PARTITION BY and ORDER BY clauses."
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                count: { gt: 0 }

  - id: Q-PROP-CONTRA
    risk_level: critical
    message: "Cross-scope contradiction: consumer predicate contradicts upstream CTE/subquery constraint. Query will always return zero rows from the upstream source."
    triggers:
      all_of:
        - query.scopes:
            each:
              predicates:
                each:
                  cross_scope_effects:
                    exists:
                      relationship: disjoint

  - id: Q-SUBQ-REPEAT
    risk_level: medium
    message: "Repeated subquery pattern detected. Consider using CTEs or temporary tables for better readability and potential performance improvement."
    triggers:
      all_of:
        - query.repeated_subqueries:
            count: { gt: 0 }

  - id: Q-WIN-FRAME
    risk_level: low
    message: "Custom window frame specification detected. Verify boundaries."
    triggers:
      all_of:
        - query.scopes:
            each:
              window_functions:
                each:
                  frame: { exists: true }

  - id: Q-JOIN-TYPEMIS-CENH
    risk_level: medium
    message: "JOIN on columns with mismatched data types. This causes implicit type conversion and may prevent index usage, resulting in slower queries. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              joins:
                each:
                  on_columns:
                    exists:
                      type_compatibility: mismatch

  - id: Q-JOIN-NULL-CENH
    risk_level: high
    message: "JOIN on nullable column silently excludes NULL values. NULL values in this column will not match, potentially losing data. Consider LEFT JOIN or add IS NOT NULL filter. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              joins:
                each:
                  all_of:
                    - kind: inner
                    - on_columns:
                        exists:
                          any_of:
                            - left.nullability.kind: catalog_nullable
                            - right.nullability.kind: catalog_nullable

  - id: Q-FLOW-DROP-REF
    risk_level: critical
    message: "Statement references a table or view that was dropped by a prior statement in this script. This statement will fail at runtime."
    triggers:
      all_of:
        - query.stale_table_refs:
            each:
              state.kind: dropped

  - id: Q-FLOW-RENAME-REF
    risk_level: high
    message: "Statement references a table by its old name after it was renamed by a prior statement in this script. Use the new name or reorder the statements."
    triggers:
      all_of:
        - query.stale_table_refs:
            each:
              state.kind: renamed

  - id: Q-FLOW-COL-DROP
    risk_level: critical
    message: "Statement references a column that was dropped by a prior ALTER TABLE statement in this script. This statement will fail at runtime."
    triggers:
      all_of:
        - query.stale_column_refs:
            each: {}

  - id: Q-FLOW-TAINT
    risk_level: info
    message: "Output column materializes the value of a classified source (catalog tag). When materialized by a privileged role (e.g. dbt service account), source masking policies do not protect the destination table. Ensure the destination has its own masking policy or access controls."
    triggers:
      all_of:
        - query.scopes:
            each:
              all_of:
                - kind: outer
                - projections:
                    each:
                      all_of:
                        - taint_labels:
                            count: { gt: 0 }
                        - value_exposure: { in: [value, digest] }

  - id: Q-NULL-COUNT-CENH
    risk_level: high
    message: "COUNT({column}) on confirmed nullable column excludes NULL values. This column is nullable per catalog metadata. If counting all rows including NULLs, use COUNT(*) instead. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              aggregates:
                each:
                  all_of:
                    - function:
                        in: [count, count_distinct]
                    - on_nullable_argument: true


  - id: Q-VIEW-REF-CENH
    risk_level: medium
    message: "Query references VIEW(s). Views are recomputed on every execution (not materialized). [Catalog-enhanced]"
    triggers:
      all_of:
        - query.reads_table:
            each:
              table_kind: view

  - id: CAT-TBL-UNKNOWN
    risk_level: medium
    message: "Query references a table that is not present in the attached catalog. The table may be misspelled, dropped, or in a schema/database the catalog snapshot does not cover."
    triggers:
      all_of:
        - query.reads_table:
            each:
              in_catalog: false

  - id: CAT-COL-UNKNOWN
    risk_level: medium
    message: "Query references a column that is not declared on its table per the attached catalog. The column may be misspelled, dropped, or added in a schema the catalog snapshot does not cover."
    triggers:
      all_of:
        - query.references_column:
            each:
              in_catalog: false

  - id: CAT-COL-AMBIGUOUS
    risk_level: medium
    message: "Query contains an unqualified column reference that resolves to two or more in-scope tables per the attached catalog. Qualify the column with its source table to avoid surprising binding behavior."
    triggers:
      all_of:
        - query.references_column:
            each:
              is_ambiguous: true

  - id: Q-AGG-HICARD
    risk_level: medium
    message: "GROUP BY combines two or more high-cardinality columns (IDs, emails, hashes). Each near-unique key multiplies the group count toward one group per row, so the aggregation stops summarizing while still paying full grouping cost. Group by the one entity key you need, or pre-aggregate per key."
    triggers:
      all_of:
        - query.scopes:
            each:
              high_cardinality_group_by_columns:
                count: { gte: 2 }

  - id: Q-NULL-NEQ
    risk_level: medium
    emission: per_witness
    message: "NULL-logic warning: <> or != operator on column(s) [{witness.column.name.raw}] will not match NULL values. If NULLs are valid data, use 'OR column IS NULL' or IS DISTINCT FROM."
    triggers:
      query.scopes:
        each:
          where_predicates:
            each:
              any_of:
                - null_effects:
                    each:
                      all_of:
                        - inequality_compared: true
                        - null_addressed: false
                        - inner_join_key_protected: false
                        - column.nullability.kind:
                            in: [derived_nullable, unknown]
                - all_of:
                    - root.kind: subquery
                    - root.subquery.inner_facts.scopes:
                        exists:
                          where_predicates:
                            exists:
                              null_effects:
                                each:
                                  all_of:
                                    - inequality_compared: true
                                    - null_addressed: false
                                    - inner_join_key_protected: false
                                    - column.nullability.kind:
                                        in: [derived_nullable, unknown]

  - id: Q-NULL-EQ
    risk_level: high
    emission: per_witness
    message: "NULL-comparison error: column [{witness.column.name.raw}] is compared to NULL with =, <, >, <=, or >= — the result is always UNKNOWN, so the predicate matches no rows. Use IS NULL or IS NOT NULL instead."
    triggers:
      query.scopes:
        each:
          where_predicates:
            each:
              any_of:
                - null_effects:
                    each:
                      all_of:
                        - null_literal_compared: true
                        - inequality_compared: false
                        - null_addressed: false
                - all_of:
                    - root.kind: subquery
                    - root.subquery.inner_facts.scopes:
                        exists:
                          where_predicates:
                            exists:
                              null_effects:
                                each:
                                  all_of:
                                    - null_literal_compared: true
                                    - inequality_compared: false
                                    - null_addressed: false

  - id: Q-JOIN-FKVIOL-CENH
    risk_level: critical
    message: "JOIN doesn't follow defined foreign key relationship. The FK constraint specifies different columns than those used in the JOIN, which is likely a logic error. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              joins:
                each:
                  on_columns:
                    exists:
                      fk_relationship: diverges

  - id: Q-JOIN-LEFT-FILT
    risk_level: critical
    emission: per_witness
    message: "LEFT JOIN nullable side filtered in WHERE clause. This effectively converts the LEFT JOIN to an INNER JOIN, likely a bug."
    triggers:
      all_of:
        - query.scopes:
            each:
              where_predicates:
                each:
                  null_effects:
                    each:
                      all_of:
                        - column.nullability.kind: derived_nullable
                        - column.nullability.reason:
                            in:
                              - left_join_outer_side
                              - right_join_outer_side
                              - full_outer_join_pad
                        - drops_null_row: true
                        - null_addressed: false
                        - aggregate_derived: false

  - id: Q-JOIN-TEMPORAL-CENH
    risk_level: medium
    message: "Temporal join without explicit date bounds. This may cause full table scans or incorrect results across time periods. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.temporal_join_tables:
            count: { gte: 1 }
        - query.scopes:
            each:
              all_of:
                - kind: outer
                - joins:
                    count: { gt: 0 }
        - query.temporal_gating_expressions:
            count: { eq: 0 }

  - id: INFO-Q-PRED-TEMPORAL
    risk_level: info
    message: "Temporal predicate detected using CURRENT_DATE/CURRENT_TIMESTAMP. Results change daily, affecting cache hit rates."
    triggers:
      all_of:
        - kind: { in: [select, set_select] }
        - query.temporal_gating_expressions:
            each:
              kind: function_call

  - id: Q-MULTI-TEMPORAL-CENH
    risk_level: medium
    message: "Tables with temporal columns (DATE/TIMESTAMP) are joined without date filter in WHERE or JOIN ON. This can cause unbounded historical joins with poor performance. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.temporal_join_tables:
            count: { gte: 2 }
        - query.temporal_gating_expressions:
            count: { eq: 0 }

  - id: Q-JOIN-DISTINCT-MASK
    risk_level: medium
    message: "DISTINCT may be masking a join fan-out. If the join produces duplicate rows, DISTINCT hides rather than fixes the issue. Consider verifying join cardinality or using EXISTS."
    triggers:
      all_of:
        - query.scopes:
            each:
              all_of:
                - has_distinct: true
                - joins:
                    count: { gt: 0 }
                - group_by:
                    count: { eq: 0 }

  - id: Q-JOIN-DISTINCT-MASK-CENH
    risk_level: high
    message: "DISTINCT confirmed to mask a join fan-out. Catalog shows join keys lack unique constraints, meaning the join will produce duplicates. DISTINCT hides this bug rather than fixing it. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              all_of:
                - has_distinct: true
                - group_by:
                    count: { eq: 0 }
                - joins:
                    exists:
                      on_columns:
                        all:
                          all_of:
                            - unique_key_backing_known: true
                            - unique_key_backed: false

  - id: Q-JOIN-FANOUT-CENH
    risk_level: high
    message: "Join produces row multiplication (1:N relationship). Aggregates or counts may be inflated. Consider using a subquery or window function. [Catalog-enhanced]"
    triggers:
      all_of:
        - query.scopes:
            each:
              joins:
                each:
                  on_columns:
                    all:
                      all_of:
                        - unique_key_backing_known: true
                        - unique_key_backed: false

  - id: Q-AGG-EXPLODE-CENH
    risk_level: medium
    message: "Multiple joins with aggregation but no effective WHERE filter. This can cause exponential row explosion and incorrect aggregates. [Catalog-enhanced]"
    triggers:
      all_of:
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true
        - query.scopes:
            each:
              all_of:
                - kind: outer
                - aggregates:
                    count: { gt: 0 }
                - joins:
                    count: { gte: 2 }
                - joins:
                    exists:
                      on_columns:
                        all:
                          unique_key_backed: false


  - id: DML-WRITE-UNBOUNDED
    risk_level: critical
    message: "Unbounded write operation detected - the statement has no WHERE clause or its WHERE clause matches every row. This affects ALL rows in the target table(s)."
    triggers:
      all_of:
        - kind: { in: [delete, update, merge] }
        - any_of:
            - query.has_where: false
            - query.has_tautology_where: true

  - id: DML-MERGE-DELETE
    risk_level: medium
    message: "MERGE branch deletes every matched row: WHEN MATCHED THEN DELETE carries no additional condition, so each target row satisfying the ON clause is deleted. A MERGE reads as an upsert in review — verify the deletion is intended, or guard the branch (WHEN MATCHED AND <condition> THEN DELETE)."
    triggers:
      all_of:
        - kind: merge
        - query.merge.branches:
            exists:
              all_of:
                - kind: when_matched
                - action: delete
                - not:
                    guarded: true
        - not:
            query.has_tautology_where: true

  - id: DML-MERGE-DELETE-BY-SOURCE
    risk_level: medium
    message: "MERGE branch deletes every target row absent from the source: WHEN NOT MATCHED BY SOURCE THEN DELETE carries no additional condition. If the source is empty, over-filtered, or wrong, the target table is emptied. Verify the source population, or guard the branch (WHEN NOT MATCHED BY SOURCE AND <condition> THEN DELETE)."
    triggers:
      all_of:
        - kind: merge
        - query.merge.branches:
            exists:
              all_of:
                - kind: when_not_matched_by_source
                - action: delete
                - not:
                    guarded: true
        - not:
            query.has_tautology_where: true

  - id: DML-WRITE-XSCHEMA
    risk_level: medium
    message: "Cross-schema write operation detected. Verify schema permissions and change control procedures."
    triggers:
      all_of:
        - kind: { in: [delete, update, insert, merge] }
        - query.schemas_touched:
            count: { gt: 1 }

  - id: DML-WRITE-MULTITBL
    risk_level: low
    message: "Write operation affects multiple tables. Verify transaction boundaries and rollback plan."
    triggers:
      all_of:
        - kind: { in: [delete, update, insert, merge] }
        - query.writes_table:
            count: { gte: 2 }


  - id: MSSQL-HINT-DIRTYREAD
    risk_level: high
    message: "Table hint NOLOCK or READUNCOMMITTED allows reading uncommitted data. Queries may return phantom rows, partially-written rows, or miss rows entirely. This is NOT a free performance optimization."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each:
              kind: { in: [nolock, read_uncommitted] }

  - id: MSSQL-HINT-XLOCK
    risk_level: medium
    message: "Table hint TABLOCKX or XLOCK requests exclusive locks, blocking all concurrent readers and writers. This can cause severe contention and deadlocks in production workloads."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each:
              kind: { in: [tablockx, xlock] }

  - id: MSSQL-HINT-INDEX
    risk_level: medium
    message: "INDEX hint forces a specific index, overriding the query optimizer. The forced index may become stale as data distribution changes, or may be dropped/renamed, causing query failures."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each:
              kind: index

  - id: INFO-MSSQL-HINT
    risk_level: info
    message: "T-SQL table hint detected. Table hints override default locking and query plan behavior. Ensure hints are intentional and reviewed during code changes."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each: {}

  - id: MSSQL-HINT-FORCESCAN
    risk_level: medium
    message: "FORCESCAN forces a full table or index scan, bypassing index seeks. Unless intentional for analytics workloads, this typically degrades performance on large tables."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each:
              kind: forcescan

  - id: MSSQL-HINT-FORCESEEK
    risk_level: low
    message: "FORCESEEK forces the optimizer to use an index seek. While generally safe, this overrides the optimizer's cost-based decision and may degrade performance when a scan would be more efficient."
    triggers:
      all_of:
        - kind: { in: [select, set_select, insert, update, delete, merge] }
        - query.table_hints:
            each:
              kind: forceseek


  - id: MSSQL-BULK-INSERT
    risk_level: medium
    message: "BULK INSERT loading data from external file. External file access requires ADMINISTER BULK OPERATIONS permission. Verify file path, format options, and data validation."
    triggers:
      kind: mssql_bulk_insert

  - id: MSSQL-EXTMDL-NEW
    risk_level: high
    message: "CREATE EXTERNAL MODEL registers an external AI endpoint (e.g., Azure OpenAI). Data sent to this model leaves the SQL Server boundary. Review: endpoint URL, credential scope, and data classification of columns that will be embedded or sent for inference."
    triggers:
      kind: mssql_create_external_model

  - id: MSSQL-EXTMDL-RMT
    risk_level: high
    message: "External AI model establishes a remote connection to an external service. Verify the endpoint URL is trusted, the credential has minimal required scope, and network egress rules permit this traffic."
    triggers:
      kind: mssql_create_external_model

  - id: MSSQL-EXTMDL-CHG
    risk_level: medium
    message: "ALTER EXTERNAL MODEL modifies an AI endpoint configuration. This could change the target service URL, credentials, or model name. Verify the new configuration doesn't expand data exposure."
    triggers:
      kind: mssql_alter_external_model

  - id: MSSQL-LOGIN-NEW
    risk_level: high
    message: "CREATE LOGIN adds a new server-level authentication principal. This grants the ability to connect to the SQL Server instance. Review: authentication method (password, certificate, Windows, or external provider), password policy, and intended access scope."
    triggers:
      kind: mssql_create_login

  - id: MSSQL-LOGIN-CHECK-POLICY-OFF
    risk_level: high
    message: "CHECK_POLICY = OFF exempts this SQL login from the Windows password policy: complexity requirements and account-lockout rules no longer apply, so weak passwords are accepted and repeated sign-in attempts are never locked out. Keep policy enforcement on, or use integrated authentication for service accounts."
    triggers:
      all_of:
        - kind:
            in: [mssql_create_login, mssql_alter_login]
        - ddl.principal.mssql_login.check_policy: false

  - id: MSSQL-LOGIN-CHECK-EXPIRATION-OFF
    risk_level: low
    message: "CHECK_EXPIRATION = OFF disables password expiration for this SQL login, so its password is never required to change. Review against your credential-rotation policy."
    triggers:
      all_of:
        - kind:
            in: [mssql_create_login, mssql_alter_login]
        - ddl.principal.mssql_login.check_expiration: false

  - id: MSSQL-USER-NEW
    risk_level: high
    message: "CREATE USER adds a new database-level authorization principal. This user can be granted permissions on database objects. Review: whether the user maps to a login (FOR LOGIN), is contained (WITH PASSWORD), or has no login (WITHOUT LOGIN for service accounts)."
    triggers:
      kind: mssql_create_user


  - id: MSSQL-IDENTITY-INSERT-ON
    risk_level: high
    message: "SET IDENTITY_INSERT ON allows explicit values in IDENTITY columns, bypassing auto-increment. This can cause key collisions, break referential integrity, and indicates manual data manipulation. Ensure this is intentional and temporary."
    triggers:
      all_of:
        - kind: mssql_set_option
        - ddl.mssql_set_option.option_kind: identity_insert
        - ddl.mssql_set_option.value: on

  - id: INFO-MSSQL-IDENTITY-INSERT-OFF
    risk_level: info
    message: "SET IDENTITY_INSERT OFF restores normal IDENTITY column behavior. Positive signal: auto-increment protection re-enabled."
    triggers:
      all_of:
        - kind: mssql_set_option
        - ddl.mssql_set_option.option_kind: identity_insert
        - ddl.mssql_set_option.value: off

  - id: MSSQL-ISOLATION-READ-UNCOMMITTED
    risk_level: medium
    message: "SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED permits dirty reads — the session can read uncommitted, possibly-rolled-back data (equivalent to NOLOCK on every read). Acceptable for some reporting/analytics, but a correctness risk in transactional code. Confirm dirty reads are acceptable here."
    triggers:
      all_of:
        - kind: mssql_set_option
        - ddl.mssql_set_option.option_kind: transaction_isolation_level
        - ddl.mssql_set_option.isolation_level: read_uncommitted

  - id: INFO-MSSQL-ISOLATION-LEVEL
    risk_level: info
    message: "Transaction isolation level set for the session. The isolation level governs concurrency and consistency (dirty reads, phantom reads, locking) for subsequent statements."
    triggers:
      all_of:
        - kind: mssql_set_option
        - ddl.mssql_set_option.option_kind: transaction_isolation_level

  - id: MSSQL-BACKUP-TO-URL
    risk_level: medium
    message: "BACKUP ... TO URL writes a database or log backup to an offsite object store (Azure blob). The backup leaves the controlled environment and the URL commonly embeds a SAS credential. Confirm the destination is authorized, access-controlled, and that the backup is encrypted."
    triggers:
      all_of:
        - kind: mssql_backup
        - mssql_backup.destination: url

  - id: INFO-MSSQL-BACKUP
    risk_level: info
    message: "Database or transaction-log backup taken. A backup is a full copy of the data at rest; ensure its destination is access-controlled and the backup is encrypted."
    triggers:
      all_of:
        - kind: mssql_backup

  - id: MSSQL-RESTORE-FROM-URL
    risk_level: medium
    message: "RESTORE ... FROM URL reads a database or log backup from an offsite object store (Azure blob). The restored data originates outside the controlled environment and the URL commonly embeds a SAS credential. Confirm the source is trusted and authorized."
    triggers:
      all_of:
        - kind: mssql_restore
        - mssql_restore.source: url

  - id: MSSQL-RESTORE-REPLACE
    risk_level: medium
    message: "RESTORE ... WITH REPLACE force-overwrites an existing database, discarding its current contents even when recovery would normally refuse. Confirm the target database is meant to be replaced."
    triggers:
      all_of:
        - kind: mssql_restore
        - mssql_restore.replace: true

  - id: INFO-MSSQL-RESTORE
    risk_level: info
    message: "Database or transaction-log restore performed. A restore overwrites the target with data from a backup; ensure the source is trusted and the operation is intended."
    triggers:
      all_of:
        - kind: mssql_restore

  - id: MSSQL-DBCC-WRITEPAGE
    risk_level: high
    message: "DBCC WRITEPAGE writes raw bytes directly to a data page, bypassing the storage engine and all integrity checks. It can silently corrupt or tamper with table data and is unsupported outside disaster recovery. This has no legitimate place in application or migration scripts."
    triggers:
      all_of:
        - kind: mssql_dbcc
        - mssql_dbcc.command: writepage

  - id: MSSQL-DBCC-SENSITIVE
    risk_level: medium
    message: "DBCC command changes global engine behavior, reclaims storage, or clears server caches. These affect availability and observability beyond the current session (e.g. trace flags alter engine behavior server-wide; SHRINK fragments data files; cache flushes degrade production performance). Confirm the command is intended for this environment."
    triggers:
      all_of:
        - kind: mssql_dbcc
        - mssql_dbcc.command:
            in: [traceon, traceoff, shrinkdatabase, shrinkfile, freeproccache, freesystemcache, freesessioncache, dropcleanbuffers, checkident, dbreindex, page, ind]

  - id: INFO-MSSQL-DBCC
    risk_level: info
    message: "DBCC (database console command) executed. The DBCC family spans integrity checks, maintenance, performance tuning and undocumented internals; confirm the command is appropriate for this environment."
    triggers:
      all_of:
        - kind: mssql_dbcc

  - id: MSSQL-KEY-OPEN-INLINE-PASSWORD
    risk_level: high
    message: "An encryption key is opened with a hardcoded password embedded in the statement (OPEN ... DECRYPTION BY PASSWORD). The password sits in source/version control in plaintext, defeating the key it protects; anyone with the script can decrypt the data. Supply the password out of band, not as a literal."
    triggers:
      all_of:
        - kind: mssql_key_management
        - mssql_key_management.action: open
        - mssql_key_management.password_present: true

  - id: MSSQL-OPEN-MASTER-KEY
    risk_level: medium
    message: "The database master key (DMK) is opened in this session. The DMK decrypts the certificates and keys protecting sensitive data; activating it widens the window in which that data is accessible. Confirm the surrounding code closes the key promptly and runs with least privilege."
    triggers:
      all_of:
        - kind: mssql_key_management
        - mssql_key_management.action: open
        - mssql_key_management.key_kind: master

  - id: INFO-MSSQL-KEY-MANAGEMENT
    risk_level: info
    message: "A T-SQL encryption-key context switch (OPEN/CLOSE { MASTER KEY | SYMMETRIC KEY | ALL SYMMETRIC KEYS }) was executed. Key activation changes which encrypted data is accessible in the session; confirm it is scoped and closed as intended."
    triggers:
      all_of:
        - kind: mssql_key_management

  - id: MSSQL-RLS-POLICY-DISABLED
    risk_level: high
    message: "An existing row-level-security policy is being turned off (ALTER SECURITY POLICY ... WITH (STATE = OFF)). While the policy is off it enforces nothing: every row it was filtering becomes visible, and the writes its block predicates were restricting are allowed. Disabling row-level security removes an active data-access control."
    triggers:
      all_of:
        - kind: mssql_security_policy
        - mssql_security_policy.action: alter
        - mssql_security_policy.state: off

  - id: MSSQL-RLS-POLICY-CREATED-DISABLED
    risk_level: medium
    message: "A row-level-security policy is created in a disabled state — STATE = OFF, or no STATE clause (which SQL Server defaults to OFF). The predicates are defined but enforce nothing until the policy is explicitly enabled, so the rows it is meant to protect are exposed in the meantime. Confirm the policy is intended to ship disabled."
    triggers:
      all_of:
        - kind: mssql_security_policy
        - mssql_security_policy.action: create
        - mssql_security_policy.state:
            in: [off, unset]

  - id: INFO-MSSQL-SECURITY-POLICY
    risk_level: info
    message: "A T-SQL row-level-security policy was created or altered. Security policies bind filter predicates (which rows reads return) and block predicates (which rows writes may touch) to tables; confirm the change matches the intended access control."
    triggers:
      all_of:
        - kind: mssql_security_policy

  - id: MSSQL-MASTER-KEY-EXPORT
    risk_level: high
    message: "A database or service master key is backed up to a file (BACKUP MASTER KEY / SERVICE MASTER KEY). This exports the root of the SQL Server encryption hierarchy: anyone with the resulting file (and its password) can decrypt everything the key protects. Treat the exported file as a critical secret and confirm it is not written to a shared or source-controlled location."
    triggers:
      all_of:
        - kind: mssql_key_backup
        - mssql_key_backup.action: backup
        - mssql_key_backup.key_object:
            in: [service_master_key, master_key]

  - id: MSSQL-MASTER-KEY-RESTORE
    risk_level: high
    message: "A database or service master key is restored from a file (RESTORE MASTER KEY / SERVICE MASTER KEY). This re-keys the instance or database from external key material; a restore from an untrusted file substitutes the root of the encryption hierarchy. Confirm the source file is trusted and the operation is intended."
    triggers:
      all_of:
        - kind: mssql_key_backup
        - mssql_key_backup.action: restore
        - mssql_key_backup.key_object:
            in: [service_master_key, master_key]

  - id: MSSQL-KEY-BACKUP-INLINE-PASSWORD
    risk_level: high
    message: "Key material is backed up or restored using a hardcoded password (BACKUP/RESTORE ... { ENCRYPTION | DECRYPTION } BY PASSWORD = '...'). The password that protects the exported key — or unlocks the imported one — sits in the script in plaintext, so anyone with the file and the script can recover the key. Supply the password out of band, not as a literal."
    triggers:
      all_of:
        - kind: mssql_key_backup
        - mssql_key_backup.password_present: true

  - id: INFO-MSSQL-KEY-BACKUP
    risk_level: info
    message: "T-SQL key material (master key, service master key, certificate, or asymmetric key) was backed up to or restored from a file. Key-material files cross the filesystem boundary and must be handled as secrets; confirm the operation and the file's storage location are intended."
    triggers:
      all_of:
        - kind: mssql_key_backup

  - id: MSSQL-CLR-ASSEMBLY-UNSAFE
    risk_level: high
    message: "A CLR assembly is registered with PERMISSION_SET = UNSAFE. UNSAFE grants the .NET code full trust inside the SQL Server process — native calls, P/Invoke, and arbitrary I/O — which is an arbitrary-code-execution and persistence surface equivalent to running native code as the service account. UNSAFE assemblies have almost no legitimate place in application code; confirm this is a vetted, signed assembly and not attacker-introduced."
    triggers:
      all_of:
        - kind: mssql_assembly
        - mssql_assembly.permission_set: unsafe

  - id: MSSQL-CLR-ASSEMBLY-EXTERNAL-ACCESS
    risk_level: medium
    message: "A CLR assembly is registered with PERMISSION_SET = EXTERNAL_ACCESS. The .NET code may reach the filesystem, network, registry, and environment outside the database, under the SQL Server service account. Confirm the assembly is trusted and requires that access."
    triggers:
      all_of:
        - kind: mssql_assembly
        - mssql_assembly.permission_set: external_access

  - id: INFO-MSSQL-CLR-ASSEMBLY
    risk_level: info
    message: "A T-SQL CLR assembly was created or altered. CLR assemblies run .NET code inside the SQL Server process; confirm the assembly is trusted and its permission set is the minimum required."
    triggers:
      all_of:
        - kind: mssql_assembly

  - id: MSSQL-SIGNATURE-INLINE-PASSWORD
    risk_level: high
    message: "A module is signed using a hardcoded password (ADD SIGNATURE ... WITH PASSWORD = '...'). The password unlocks the signing certificate's or asymmetric key's private key and sits in the script in plaintext, so anyone with the script can re-sign modules as that signer — and thus mint the elevated privileges the signer grants. Supply the password out of band, not as a literal."
    triggers:
      all_of:
        - kind: mssql_add_signature
        - mssql_add_signature.password_present: true

  - id: MSSQL-MODULE-SIGNATURE-ADDED
    risk_level: medium
    message: "A module is signed by a certificate or asymmetric key (ADD SIGNATURE / ADD COUNTER SIGNATURE). A signed module executes with the permissions granted to the principal derived from the signer, regardless of who calls it — a privilege-delegation mechanism that grants the module abilities its callers do not have. Confirm the signer's grants are intended and minimal, and that the module's code is trusted."
    triggers:
      all_of:
        - kind: mssql_add_signature

  - id: INFO-MSSQL-SET-OPTION
    risk_level: info
    message: "T-SQL session option changed via SET. Session options (NOCOUNT, ANSI_NULLS, XACT_ABORT, etc.) affect query behavior and error handling for the current session."
    triggers:
      all_of:
        - kind: mssql_set_option

  - id: INFO-MSSQL-EXTMDL-DROP
    risk_level: low
    message: "DROP EXTERNAL MODEL removes an AI endpoint registration. Positive signal: reduces external attack surface. Verify no dependent queries rely on this model."
    triggers:
      all_of:
        - kind: mssql_drop_external_model

  - id: MSSQL-LOGIN-EXT
    risk_level: high
    message: "CREATE LOGIN FROM EXTERNAL PROVIDER configures authentication via an external identity provider (e.g., Microsoft Entra ID). Verify: the OBJECT_ID maps to the correct external identity, the TYPE (E=user, X=group/app) is intentional, and the external provider trust relationship is established."
    triggers:
      all_of:
        - kind: mssql_create_login
        - ddl.mssql_principal.source: from_external_provider

  - id: MSSQL-USER-EXT
    risk_level: high
    message: "CREATE USER FROM EXTERNAL PROVIDER maps a database user to an external identity (Microsoft Entra ID). Verify: the OBJECT_ID matches the intended external principal, and the external provider configuration is correct."
    triggers:
      all_of:
        - kind: mssql_create_user
        - ddl.mssql_principal.source: from_external_provider


  - id: PG-DOMAIN-DROP
    risk_level: high
    message: "Domain dropped. Columns using this domain type will be affected."
    triggers:
      all_of:
        - kind: pg_drop_domain
        - ddl.options.cascade: false

  - id: PG-DOMAIN-CASCADE-DROP
    risk_level: critical
    message: "Domain dropped with CASCADE. All dependent columns, constraints, and types will be removed."
    triggers:
      all_of:
        - kind: pg_drop_domain
        - ddl.options.cascade: true

  - id: PG-DOMAIN-NAME-CHG
    risk_level: low
    message: "Domain renamed. Verify all dependent columns and types reference the new name."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              kind: rename_to

  - id: PG-DOMAIN-OWNER-CHG
    risk_level: medium
    message: "Domain ownership changed. Verify the new owner has appropriate permissions."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              kind: owner_to

  - id: PG-DOMAIN-NOTNULL-DROP
    risk_level: high
    message: "NOT NULL constraint removed from domain. Columns using this domain may now accept NULL values, potentially causing data quality issues."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              kind: drop_not_null

  - id: PG-DOMAIN-CONSTR-DROP
    risk_level: high
    message: "Constraint removed from domain. Data validation enforced by this constraint is no longer active."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              all_of:
                - kind: drop_constraint
                - cascade: false

  - id: PG-DOMAIN-CONSTR-CASCADE-DROP
    risk_level: critical
    message: "Domain constraint dropped with CASCADE. Cascading removal may affect dependent objects and columns."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              all_of:
                - kind: drop_constraint
                - cascade: true

  - id: PG-DOMAIN-CHG
    risk_level: medium
    message: "Domain altered. Review changes to ensure data type semantics remain correct."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              kind: other

  - id: INFO-PG-DOMAIN-NEW
    risk_level: info
    message: "Domain created. Positive governance signal — custom type constraints are being defined."
    triggers:
      all_of:
        - kind: pg_create_domain

  - id: INFO-PG-DOMAIN-CONSTR-ADD
    risk_level: info
    message: "Constraint added to domain. Positive governance signal — data validation is being strengthened."
    triggers:
      all_of:
        - kind: pg_alter_domain
        - ddl.domain.actions:
            exists:
              kind: add_constraint


  - id: INFO-PG-RLS-NEW
    risk_level: info
    message: "Row-level security policy created. Positive governance signal — data access is being restricted at the row level."
    triggers:
      all_of:
        - kind: pg_create_policy

  - id: PG-RLS-CHG
    risk_level: medium
    message: "Row-level security policy modified. Review the updated USING/WITH CHECK expressions to ensure data access remains correctly restricted."
    triggers:
      all_of:
        - kind: pg_alter_policy
        - not:
            policy.renamed_to:
              exists: true

  - id: PG-RLS-NAME-CHG
    risk_level: low
    message: "Row-level security policy renamed. Verify dependent references are updated."
    triggers:
      all_of:
        - kind: pg_alter_policy
        - policy.renamed_to:
            exists: true

  - id: PG-RLS-DROP
    risk_level: critical
    message: "Row-level security policy dropped. Row-level data protection removed. All rows may become visible to users who were previously restricted."
    triggers:
      all_of:
        - kind: pg_drop_policy
        - ddl.options.cascade: false

  - id: PG-RLS-CASCADE-DROP
    risk_level: critical
    message: "Row-level security policy dropped with CASCADE. Cascading removal may affect dependent objects beyond this policy."
    triggers:
      all_of:
        - kind: pg_drop_policy
        - ddl.options.cascade: true

  - id: PG-RLS-TABLE-DISABLE
    risk_level: critical
    message: "ALTER TABLE ... DISABLE ROW LEVEL SECURITY. Row-level protection is switched off for the table — every row becomes visible to any role with table access, bypassing all attached policies. Verify this is intended."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: row_level_security
              mode: disable

  - id: PG-RLS-TABLE-NO-FORCE
    risk_level: medium
    message: "ALTER TABLE ... NO FORCE ROW LEVEL SECURITY. The table owner is once again exempt from row-level security policies. Owner queries will see all rows regardless of policy. Verify the owner exemption is intended."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: row_level_security
              mode: no_force

  - id: INFO-PG-RLS-TABLE-ENABLE
    risk_level: info
    message: "ALTER TABLE ... ENABLE ROW LEVEL SECURITY. Positive governance signal — row-level security is now enforced for non-owner roles on the table."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: row_level_security
              mode: enable

  - id: INFO-PG-RLS-TABLE-FORCE
    risk_level: info
    message: "ALTER TABLE ... FORCE ROW LEVEL SECURITY. Positive governance signal — row-level security is now enforced for the table owner as well."
    triggers:
      all_of:
        - kind: alter_table
        - ddl.table.actions:
            exists:
              kind: row_level_security
              mode: force

  - id: PG-RLS-PERMISSIVE
    risk_level: medium
    message: "RLS policy created as PERMISSIVE. Multiple permissive policies are combined with OR, which may be less restrictive than intended. Consider RESTRICTIVE policies for tighter control."
    triggers:
      all_of:
        - kind: pg_create_policy
        - policy.variant.permissiveness: permissive

  - id: PG-RLS-WEAK-CHECK
    risk_level: critical
    message: "PostgreSQL RLS policy WITH CHECK expression is always true. Policy does not restrict write operations — any row can be inserted or updated."
    triggers:
      all_of:
        - kind:
            in: [pg_create_policy, pg_alter_policy]
        - policy.variant.check_predicate.body:
            exists: true
        - policy.variant.check_predicate.body_terminal_returns:
            all:
              all_of:
                - kind: literal
                - literal.kind: bool
                - literal.value: true


  - id: PG-COPY-FROM
    risk_level: medium
    message: "COPY FROM imports data into a table. Verify the data source is trusted and the target table is correct."
    triggers:
      all_of:
        - kind: pg_copy
        - pg_copy.direction: from
        - pg_copy.target:
            in: [file, stdin, stdout]

  - id: PG-COPY-TO
    risk_level: high
    message: "COPY TO exports data from a table. This may expose sensitive data — verify authorization and destination."
    triggers:
      all_of:
        - kind: pg_copy
        - pg_copy.direction: to
        - pg_copy.target:
            in: [file, stdin, stdout]

  - id: PG-COPY-PROGRAM
    risk_level: critical
    message: "COPY with PROGRAM executes a shell command on the server. CRITICAL SECURITY RISK: This allows arbitrary command execution with database server privileges."
    triggers:
      all_of:
        - kind: pg_copy
        - pg_copy.target: program

  - id: PG-FDW-SERVER-REMOTE
    risk_level: medium
    message: "Foreign server registered through a network / file foreign-data wrapper. Queries against its foreign tables reach an external system (a remote database, or — for file_fdw — server-side files), crossing the instance boundary. Verify the endpoint and the user mapping's credentials are authorized."
    triggers:
      all_of:
        - kind: create_foreign_server
        - ddl.foreign_server.wrapper:
            in: [postgres_fdw, file_fdw, mysql_fdw, oracle_fdw, tds_fdw, mongo_fdw, sqlite_fdw, odbc_fdw, jdbc_fdw, multicorn]

  - id: INFO-PG-FDW-SERVER
    risk_level: info
    message: "Foreign server registered. This declares a federated endpoint reached through a foreign-data wrapper. Positive governance signal — documents an external connectivity surface."
    triggers:
      all_of:
        - kind: create_foreign_server

  - id: PG-FDW-SERVER-OPTIONS-MODIFIED
    risk_level: medium
    message: "Foreign server reconfigured through its OPTIONS bag. These settings carry the remote endpoint (host, dbname, port, …), so altering them can silently repoint every dependent foreign table at a different external system without touching any table or user mapping. Verify the new endpoint is authorized."
    triggers:
      all_of:
        - kind: alter_foreign_server
        - ddl.foreign_server.options_present: true

  - id: INFO-PG-FDW-SERVER-ALTER
    risk_level: info
    message: "Foreign server reconfigured. This modifies a federated endpoint reached through a foreign-data wrapper (its version, options, owner, or name). Positive governance signal — documents a change to an external connectivity surface."
    triggers:
      all_of:
        - kind: alter_foreign_server

  - id: MSSQL-SERVER-CONFIG-SENSITIVE
    risk_level: medium
    message: "Server-instance configuration changed in a subsystem with a filesystem or high-availability surface (diagnostics log path, buffer-pool extension file, HADR/failover cluster context). These touch where the engine writes data or how it fails over — verify the change is authorized and the target path/endpoint is trusted."
    triggers:
      all_of:
        - kind: alter_server_configuration
        - ddl.server_configuration.subsystem:
            in: [diagnostics, buffer, hadr, failover]

  - id: INFO-MSSQL-SERVER-CONFIG
    risk_level: info
    message: "SQL Server instance configuration changed via ALTER SERVER CONFIGURATION. This is an engine-level reconfiguration. Positive governance signal — documents a change to server-instance settings."
    triggers:
      all_of:
        - kind: alter_server_configuration

  - id: PG-FDW-USER-MAPPING-PUBLIC
    risk_level: medium
    message: "User mapping FOR PUBLIC. Every local role — present and future — inherits these credentials when querying the foreign server's tables, widening who can reach the remote system. Prefer mapping specific roles."
    triggers:
      all_of:
        - kind:
            in: [create_user_mapping, alter_user_mapping]
        - ddl.user_mapping.is_public: true

  - id: INFO-PG-FDW-USER-MAPPING
    risk_level: info
    message: "User mapping created or altered. This attaches per-role credentials for a foreign server, enabling federated access. Positive governance signal — documents a credential binding to an external system."
    triggers:
      all_of:
        - kind:
            in: [create_user_mapping, alter_user_mapping]

  - id: INFO-PG-FDW-USER-MAPPING-DROP
    risk_level: info
    message: "User mapping dropped. The per-role credentials for the foreign server are removed; queries that relied on them lose federated access. Positive governance signal — documents removal of an external credential binding."
    triggers:
      all_of:
        - kind: drop_user_mapping

  - id: INFO-PG-FDW-FOREIGN-TABLE
    risk_level: info
    message: "Foreign table created. This local table is a handle for a remote relation on a foreign server; queries against it cross the instance boundary to read (or write) external data. Positive governance signal — documents a federated-data surface."
    triggers:
      all_of:
        - kind: create_foreign_table

  - id: PG-FDW-IMPORT-FOREIGN-SCHEMA-BROAD
    risk_level: medium
    message: "IMPORT FOREIGN SCHEMA exposes a remote schema's tables locally in bulk without an explicit allow-list. A whole foreign schema (or all-but-a-few of it) becomes queryable across the instance boundary in one statement, and tables added remotely later are not re-reviewed. Prefer LIMIT TO with an explicit table list to scope the federated surface."
    triggers:
      all_of:
        - kind: import_foreign_schema
        - ddl.import_foreign_schema.filter_mode:
            in: [all, except]

  - id: INFO-PG-FDW-IMPORT-FOREIGN-SCHEMA
    risk_level: info
    message: "Foreign schema imported. Remote tables are registered as local foreign tables in bulk, enabling federated reads (or writes) across the instance boundary. Positive governance signal — documents a federated-data surface."
    triggers:
      all_of:
        - kind: import_foreign_schema


  - id: PG-EXT-NEW
    risk_level: high
    message: "CREATE EXTENSION installs server-side code (C functions, operators, types). Some extensions (e.g. dblink, postgres_fdw, pg_stat_statements) grant powerful capabilities. Requires superuser or trusted extension support."
    triggers:
      all_of:
        - kind: pg_create_extension

  - id: PG-EXT-CASCADE-NEW
    risk_level: critical
    message: "CREATE EXTENSION ... CASCADE installs the extension AND all its dependencies automatically. Dependencies are installed without explicit review, increasing the attack surface."
    triggers:
      all_of:
        - kind: pg_create_extension
        - ddl.options.cascade: true


  - id: PG-MATVIEW-REFRESH
    risk_level: low
    message: "Materialized view refreshed. This rebuilds the cached data from the underlying query."
    triggers:
      all_of:
        - kind: pg_refresh_matview


  - id: PG-IDX-REBUILD
    risk_level: medium
    message: "REINDEX rebuilds indexes. This may cause temporary performance impact and lock contention."
    triggers:
      all_of:
        - kind: pg_reindex


  - id: INFO-PG-IDX-NEW
    risk_level: info
    message: "CREATE INDEX adds an index. Positive governance signal — improves query performance."
    triggers:
      all_of:
        - kind: create_index


  - id: INFO-SYNONYM-NEW
    risk_level: info
    message: "CREATE SYNONYM adds a named alias for a base object. Queries through the alias resolve to the referenced object; confirm the target is the intended one."
    triggers:
      all_of:
        - kind: create_synonym

  - id: SYNONYM-REMOTE-REFERENT
    risk_level: medium
    message: "Synonym aliases a four-part server.database.schema.object name — it points at an object on a linked or remote server, so reads and writes through the alias cross a server boundary. Confirm the linked-server reference is intended and authorized."
    triggers:
      all_of:
        - kind: create_synonym
        - ddl.synonym.referent_server_qualified: true


  - id: PG-IDX-NAME-CHG
    risk_level: low
    message: "Index renamed. Update any references to this index."
    triggers:
      all_of:
        - kind: alter_index
        - ddl.index.action.kind: rename_to

  - id: PG-IDX-CHG
    risk_level: medium
    message: "Index altered (tablespace or properties changed). Review impact on query performance."
    triggers:
      all_of:
        - kind: alter_index
        - not:
            ddl.index.action.kind: rename_to


  - id: PG-TRIG-NAME-CHG
    risk_level: low
    message: "Trigger renamed. Update any references to this trigger."
    triggers:
      all_of:
        - kind: pg_alter_trigger
        - ddl.trigger.action.kind: rename_to

  - id: PG-TRIG-CASCADE-DROP
    risk_level: critical
    message: "Trigger dropped with CASCADE. Cascading removal may affect dependent objects."
    triggers:
      all_of:
        - kind: pg_drop_trigger
        - ddl.options.cascade: true


  - id: PG-IDX-DROP
    risk_level: low
    message: "DROP INDEX removes an index. May degrade query performance on dependent queries."
    triggers:
      all_of:
        - kind: pg_drop_index

  - id: PG-IDX-CASCADE-DROP
    risk_level: medium
    message: "DROP INDEX ... CASCADE removes an index and all dependent objects."
    triggers:
      all_of:
        - kind: pg_drop_index
        - ddl.options.cascade: true


  - id: PG-EXT-DROP
    risk_level: high
    message: "DROP EXTENSION removes a PostgreSQL extension. Security extensions (pgcrypto, pg_audit) may be silently removed, weakening data protection."
    triggers:
      all_of:
        - kind: pg_drop_extension

  - id: PG-EXT-CASCADE-DROP
    risk_level: critical
    message: "DROP EXTENSION ... CASCADE removes the extension AND all dependent objects. This can silently drop functions, views, and columns that depend on extension types."
    triggers:
      all_of:
        - kind: pg_drop_extension
        - ddl.options.cascade: true


  - id: PG-TRIG-OFF
    risk_level: critical
    message: "ALTER TABLE ... DISABLE TRIGGER disables a trigger. Audit triggers, referential integrity triggers, and security enforcement triggers will stop firing. This is a common attack vector."
    triggers:
      all_of:
        - kind: pg_alter_table_trigger_state
        - ddl.trigger_state.action.kind: disable

  - id: INFO-PG-TRIG-ON
    risk_level: info
    message: "ALTER TABLE ... ENABLE TRIGGER restores trigger firing. Positive signal: security/audit enforcement re-activated."
    triggers:
      all_of:
        - kind: pg_alter_table_trigger_state
        - ddl.trigger_state.action.kind: enable


  # Dialect-neutral principal lifecycle (fires on Snowflake/PG/MSSQL/…
  # via the generic create/alter/drop_user|role kinds). Renamed from the
  # PG-prefixed ids, which were a misnomer; policies referencing the old
  # ids still resolve via former_ids.
  - id: ROLE-NEW
    former_ids: [PG-ROLE-NEW]
    risk_level: medium
    message: "CREATE ROLE/USER adds a new database principal. Review granted privileges, login capability, and role membership to prevent privilege creep."
    triggers:
      any_of:
        - kind: create_user
        - kind: create_role

  - id: ROLE-CHG
    former_ids: [PG-ROLE-CHG]
    risk_level: high
    message: "ALTER on a database principal (role, user, or login) modifies its attributes. Changes to privileges, login capability, or role membership can significantly affect security posture — verify the change is intended and authorized."
    triggers:
      any_of:
        - kind: alter_user
        - kind: alter_role

  - id: PG-ROLE-SUPERUSER
    risk_level: critical
    message: "Role granted SUPERUSER. A superuser bypasses all permission checks and can read/modify any data, alter the server, and create more superusers. Grant only to trusted administrative principals."
    triggers:
      all_of:
        - any_of:
            - kind: create_user
            - kind: create_role
            - kind: alter_user
            - kind: alter_role
        - ddl.principal.role_attributes:
            exists:
              kind: superuser
              negated: false

  - id: PG-ROLE-BYPASSRLS
    risk_level: high
    message: "Role granted BYPASSRLS. The principal bypasses every row-level security policy, seeing all rows regardless of USING/WITH CHECK expressions. Verify this is intended for the role."
    triggers:
      all_of:
        - any_of:
            - kind: create_user
            - kind: create_role
            - kind: alter_user
            - kind: alter_role
        - ddl.principal.role_attributes:
            exists:
              kind: bypass_rls
              negated: false

  - id: PG-ROLE-CREATEROLE
    risk_level: high
    message: "Role granted CREATEROLE. The principal can create, alter, and drop other roles — including granting itself further privileges — a privilege-escalation path. Verify the role requires role-management capability."
    triggers:
      all_of:
        - any_of:
            - kind: create_user
            - kind: create_role
            - kind: alter_user
            - kind: alter_role
        - ddl.principal.role_attributes:
            exists:
              kind: create_role
              negated: false

  - id: PG-ROLE-REPLICATION
    risk_level: medium
    message: "Role granted REPLICATION. The principal can initiate streaming replication and manage replication slots, enabling a full copy of the cluster's data. Verify the role is a replication account."
    triggers:
      all_of:
        - any_of:
            - kind: create_user
            - kind: create_role
            - kind: alter_user
            - kind: alter_role
        - ddl.principal.role_attributes:
            exists:
              kind: replication
              negated: false

  - id: ROLE-DROP
    former_ids: [PG-ROLE-DROP]
    risk_level: high
    message: "DROP ROLE/USER removes a database principal. Objects owned by the principal and grants that depend on it may become inaccessible; reassign ownership before dropping."
    triggers:
      any_of:
        - kind: drop_user
        - kind: drop_role

  - id: PG-ROLE-SET
    risk_level: high
    message: "SET ROLE or SET SESSION AUTHORIZATION changes the current session identity. This can escalate privileges or impersonate other users."
    triggers:
      all_of:
        - kind: pg_set
        - any_of:
            - ddl.pg_session.action.kind: set_role
            - ddl.pg_session.action.kind: set_session_authorization


  - id: PG-SESSION-CHG
    risk_level: medium
    message: "SET or RESET modifies session configuration (search_path, etc.). search_path changes can enable schema hijacking attacks."
    triggers:
      all_of:
        - kind: pg_set
        - any_of:
            - ddl.pg_session.action.kind: set_search_path
            - ddl.pg_session.action.kind: reset

  - id: PG-SESSION-SET
    risk_level: low
    message: "SET modifies a session configuration parameter."
    triggers:
      all_of:
        - kind: pg_set
        - ddl.pg_session.action.kind: set_parameter

  - id: PG-SESSION-DISCARD
    risk_level: medium
    message: "DISCARD resets session state (plans, sequences, temporary objects). Verify this is intentional."
    triggers:
      all_of:
        - kind: pg_discard


  - id: PG-RULE-NEW
    risk_level: high
    message: "CREATE RULE defines a query rewrite rule. Rules silently transform queries, which can lead to unexpected behavior. Consider triggers as a more transparent alternative."
    triggers:
      all_of:
        - kind: pg_create_rule

  - id: PG-RULE-CHG
    risk_level: medium
    message: "ALTER RULE modifies a PostgreSQL query rewrite rule. Rules can redirect INSERT/UPDATE/DELETE to different tables, affecting data integrity."
    triggers:
      all_of:
        - kind: pg_alter_rule

  - id: PG-RULE-DROP
    risk_level: high
    message: "DROP RULE removes a query rewrite rule. If the rule enforced data routing or security constraints, those protections are removed."
    triggers:
      all_of:
        - kind: pg_drop_rule

  - id: PG-OWNED-DROP
    risk_level: critical
    message: "DROP OWNED removes all objects owned by the specified roles. This is a mass deletion operation that can cause significant data loss."
    triggers:
      all_of:
        - kind: pg_drop_owned

  - id: PG-OWNED-REASSIGN
    risk_level: high
    message: "REASSIGN OWNED transfers ownership of all objects from one role to another. Verify the target role has appropriate permissions."
    triggers:
      all_of:
        - kind: pg_reassign_owned

  - id: PG-TBLSPC-NEW
    risk_level: low
    message: "CREATE TABLESPACE defines a new storage location for database objects."
    triggers:
      all_of:
        - kind: pg_create_tablespace

  - id: PG-TBLSPC-CHG
    risk_level: medium
    message: "ALTER TABLESPACE modifies storage configuration (location, options, ownership). Review impact on I/O performance and storage allocation."
    triggers:
      all_of:
        - kind: pg_alter_tablespace

  - id: PG-TBLSPC-DROP
    risk_level: medium
    message: "DROP TABLESPACE removes a storage location. Objects in this tablespace must be relocated first."
    triggers:
      all_of:
        - kind: pg_drop_tablespace

  - id: PG-PUB-CHG
    risk_level: medium
    message: "Logical replication publication modified. Changes affect which data is replicated to subscribers."
    triggers:
      all_of:
        - kind: pg_publication

  - id: PG-SUB-CHG
    risk_level: medium
    message: "Logical replication subscription modified. Changes affect data replication from the publisher."
    triggers:
      all_of:
        - kind: pg_subscription

  - id: PG-SYS-CFG-CHG
    risk_level: critical
    message: "ALTER SYSTEM modifies server-level configuration parameters. This affects all databases and users on the server. Changes take effect after reload/restart."
    triggers:
      all_of:
        - kind: pg_alter_system

  - id: PG-TBL-LOCK
    risk_level: high
    message: "Explicit table lock acquired. This can cause blocking and deadlocks. Verify the lock mode is appropriate."
    triggers:
      all_of:
        - kind: pg_lock_table


  - id: PG-RULE-CASCADE-DROP
    risk_level: high
    message: "DROP RULE ... CASCADE removes the rule AND all dependent objects. Cascading drops can affect data integrity constraints."
    triggers:
      all_of:
        - kind: pg_drop_rule
        - ddl.options.cascade: true

  - id: SEQ-DROP
    risk_level: low
    message: "DROP SEQUENCE removes a sequence generator. Columns using this sequence for defaults will break."
    triggers:
      all_of:
        - kind: pg_drop_sequence

  - id: SEQ-CASCADE-DROP
    risk_level: medium
    message: "DROP SEQUENCE ... CASCADE removes the sequence and all dependent objects (columns with DEFAULT nextval, etc.)."
    triggers:
      all_of:
        - kind: pg_drop_sequence
        - ddl.options.cascade: true

  - id: PG-TYPE-DROP
    risk_level: low
    message: "DROP TYPE removes a user-defined type. Columns or functions using this type will break."
    triggers:
      all_of:
        - kind: pg_drop_type

  - id: PG-TYPE-CASCADE-DROP
    risk_level: medium
    message: "DROP TYPE ... CASCADE removes the type and all dependent columns, functions, and casts."
    triggers:
      all_of:
        - kind: pg_drop_type
        - ddl.options.cascade: true


  - id: INFO-SEQ-NEW
    risk_level: info
    message: "CREATE SEQUENCE defines a new sequence generator."
    triggers:
      all_of:
        - kind: create_sequence

  - id: SEQ-REPLACE
    risk_level: low
    message: "CREATE OR REPLACE SEQUENCE resets the generator to its START value. New rows restart numbering while existing rows keep their IDs — risking duplicate or colliding key values in dependent tables."
    triggers:
      all_of:
        - kind: create_sequence
        - ddl.options.or_replace: true

  - id: INFO-SEQ-CHG
    risk_level: info
    message: "ALTER SEQUENCE modifies a sequence generator. Changes to INCREMENT, RESTART, or ownership may affect dependent tables."
    triggers:
      all_of:
        - kind: alter_sequence

  - id: INFO-PG-TYPE-NEW
    risk_level: info
    message: "CREATE TYPE defines a new composite, enum, or range type."
    triggers:
      all_of:
        - kind: pg_create_type

  - id: INFO-PG-TYPE-CHG
    risk_level: info
    message: "ALTER TYPE modifies a user-defined type (add/rename values, change owner, etc.)."
    triggers:
      all_of:
        - kind: pg_alter_type


  - id: PG-ANON-EXEC
    risk_level: high
    message: "DO $$ block executes anonymous code. Cannot be tracked by name, audited, or rolled back. Review for privilege escalation, data modification, and unintended side effects."
    triggers:
      all_of:
        - kind: do_block


  - id: BQ-SNAP-TBL-NEW
    risk_level: low
    message: "Snapshot table created. Point-in-time clone of source table."
    triggers:
      all_of:
        - kind: bq_create_snapshot_table

  - id: BQ-SNAP-TBL-DROP
    risk_level: medium
    message: "Snapshot table dropped. Point-in-time recovery path removed for this dataset."
    triggers:
      all_of:
        - kind: bq_drop_snapshot_table

  - id: BQ-SEARCHIDX-NEW
    risk_level: low
    message: "Search index created for full-text search capabilities."
    triggers:
      all_of:
        - kind: bq_create_search_index

  - id: BQ-SEARCHIDX-DROP
    risk_level: medium
    message: "Search index dropped. Full-text search performance on this table may degrade."
    triggers:
      all_of:
        - kind: bq_drop_search_index

  - id: BQ-VECIDX-NEW
    risk_level: low
    message: "Vector index created for ML embedding similarity search."
    triggers:
      all_of:
        - kind: bq_create_vector_index

  - id: BQ-VECIDX-CHG
    risk_level: low
    message: "Vector index modified (e.g., REBUILD). Validate embedding search quality/performance baselines."
    triggers:
      all_of:
        - kind: bq_alter_vector_index

  - id: BQ-VECIDX-DROP
    risk_level: medium
    message: "Vector index dropped. ML embedding search performance on this table may degrade."
    triggers:
      all_of:
        - kind: bq_drop_vector_index

  - id: BQ-MODEL-NEW
    risk_level: low
    message: "BigQuery ML model created. Training data pipeline established."
    triggers:
      all_of:
        - kind: bq_create_model

  - id: BQ-MODEL-DROP
    risk_level: medium
    message: "BigQuery ML model dropped. Dependent prediction queries will fail."
    triggers:
      all_of:
        - kind: bq_drop_model

  - id: BQ-MODEL-CHG
    risk_level: low
    message: "BigQuery ML model options modified."
    triggers:
      all_of:
        - kind: bq_alter_model

  - id: BQ-MODEL-EXPORT
    risk_level: medium
    message: "BigQuery ML model exported to external storage. Model artifacts leaving BigQuery."
    triggers:
      all_of:
        - kind: bq_export_model

  - id: BQ-ASSERT-CFG
    risk_level: low
    message: "ASSERT statement present. Data quality/runtime invariant check is enforced."
    triggers:
      all_of:
        - kind: bq_assert

  - id: BQ-ASSERT-NODESC
    risk_level: low
    message: "ASSERT statement missing descriptive message. Failures may be harder to triage in logs and runtime pipelines."
    triggers:
      all_of:
        - kind: bq_assert
        - ddl.bq_assert.description: { exists: false }

  - id: BQ-MODEL-REMOTE
    risk_level: high
    message: "BigQuery ML model uses REMOTE WITH CONNECTION. Model calls external endpoint — review connection security and data exposure."
    triggers:
      all_of:
        - kind: bq_create_model
        - ddl.bq_create_model.remote_connection: { exists: true }


  - id: BQ-EXPORT-UNBOUNDED
    risk_level: high
    message: "EXPORT DATA exports query results to external storage without WHERE filtering. Full table contents may be exposed."
    triggers:
      all_of:
        - kind: bq_export_data
        - ddl.bq_export_data.body.where_clause: { exists: false }
        - ddl.bq_export_data.body.having_clause: { exists: false }
        - ddl.bq_export_data.body.qualify_clause: { exists: false }

  - id: BQ-MODEL-UNBOUNDED
    risk_level: high
    message: "BQML training query has no WHERE/filter conditions. Model may train on unintended full datasets."
    triggers:
      all_of:
        - kind: bq_create_model
        - ddl.bq_create_model.body.where_clause: { exists: false }
        - ddl.bq_create_model.body.having_clause: { exists: false }
        - ddl.bq_create_model.body.qualify_clause: { exists: false }


  - id: BQ-EXPORT-AWS-LEAK
    risk_level: critical
    message: "Hardcoded AWS access key detected in EXPORT DATA statement. Use secure credential management instead."
    triggers:
      all_of:
        - kind: bq_export_data
        - any_of:
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "AKIA*" }
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "ASIA*" }

  - id: BQ-EXPORT-PWD-LEAK
    risk_level: critical
    message: "Hardcoded password detected in EXPORT DATA statement. Use secure parameter passing instead."
    triggers:
      all_of:
        - kind: bq_export_data
        - any_of:
            - ddl.bq_options.options:
                exists:
                  key.normalized: PASSWORD
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "*://*:*@*" }

  - id: BQ-EXPORT-APIKEY-LEAK
    risk_level: critical
    message: "Hardcoded API key or access token detected in EXPORT DATA statement. Store API keys in secure secrets managers."
    triggers:
      all_of:
        - kind: bq_export_data
        - ddl.bq_options.options:
            exists:
              key.normalized:
                in: [API_KEY, APIKEY, ACCESS_TOKEN, SECRET_KEY]

  - id: BQ-EXPORT-CONNSTR-LEAK
    risk_level: critical
    message: "Connection string with embedded credentials detected in EXPORT DATA statement. Use secure credential storage."
    triggers:
      all_of:
        - kind: bq_export_data
        - ddl.bq_options.all_literal_values:
            exists:
              value: { matches: "*://*:*@*" }


  - id: BQ-LOAD-AWS-LEAK
    risk_level: critical
    message: "Hardcoded AWS access key detected in LOAD DATA statement. Use secure credential management instead."
    triggers:
      all_of:
        - kind: bq_load_data
        - any_of:
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "AKIA*" }
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "ASIA*" }

  - id: BQ-LOAD-PWD-LEAK
    risk_level: critical
    message: "Hardcoded password detected in LOAD DATA statement. Use secure parameter passing instead."
    triggers:
      all_of:
        - kind: bq_load_data
        - any_of:
            - ddl.bq_options.options:
                exists:
                  key.normalized: PASSWORD
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "*://*:*@*" }

  - id: BQ-LOAD-APIKEY-LEAK
    risk_level: critical
    message: "Hardcoded API key or access token detected in LOAD DATA statement. Store API keys in secure secrets managers."
    triggers:
      all_of:
        - kind: bq_load_data
        - ddl.bq_options.options:
            exists:
              key.normalized:
                in: [API_KEY, APIKEY, ACCESS_TOKEN, SECRET_KEY]

  - id: BQ-LOAD-CONNSTR-LEAK
    risk_level: critical
    message: "Connection string with embedded credentials detected in LOAD DATA statement. Use secure credential storage."
    triggers:
      all_of:
        - kind: bq_load_data
        - ddl.bq_options.all_literal_values:
            exists:
              value: { matches: "*://*:*@*" }

  - id: MYSQL-LOAD-DATA-LOCAL-INFILE
    risk_level: medium
    message: "LOAD DATA LOCAL INFILE reads a file from the client host and streams it to the server. A compromised or malicious server can coerce the client into disclosing arbitrary readable files, and the feature is disabled by default in hardened configurations. Confirm LOCAL is required and the client/server are trusted."
    triggers:
      all_of:
        - kind: mysql_load_data
        - ddl.mysql_load_data.local: true

  - id: MYSQL-LOAD-DATA-EXTERNAL-STORAGE
    risk_level: medium
    message: "LOAD DATA INFILE ingests from an external cloud-storage URI (S3 / GCS / Azure). Data crosses the instance boundary on load — verify the source bucket's integrity and access controls."
    triggers:
      all_of:
        - kind: mysql_load_data
        - ddl.mysql_load_data.cloud_scheme:
            exists: true

  - id: INFO-MYSQL-LOAD-DATA-INFILE
    risk_level: low
    message: "LOAD DATA INFILE bulk-loads a file into a table. Without LOCAL the path is read from the database server's own filesystem (requires the FILE privilege) — a data-ingestion surface that can read server-side files. Verify the source path and the loading role's privilege are authorized."
    triggers:
      all_of:
        - kind: mysql_load_data


  - id: MYSQL-EVENT-RECURRING
    risk_level: low
    message: "CREATE EVENT defines a recurring scheduled job (ON SCHEDULE EVERY …) that runs its DO body automatically on an interval, with no operator in the loop. A recurring event is a persistence and automation surface — verify the schedule, the definer it runs as, and the body are authorized. The body's own statements are analyzed separately."
    triggers:
      all_of:
        - kind: create_event
        - ddl.event.schedule_kind: recurring

  - id: INFO-MYSQL-EVENT
    risk_level: info
    message: "CREATE EVENT defines a scheduled SQL job. Its DO body runs on the event scheduler under the definer's privileges. Verify the schedule and body are intended; the body's statements are analyzed independently."
    triggers:
      all_of:
        - kind: create_event

  - id: MYSQL-EVENT-BODY-CHANGED
    risk_level: low
    message: "ALTER EVENT … DO rebinds the scheduled job's body to new SQL. The statements that run on schedule have changed — confirm the new body is authorized. The new body is analyzed separately."
    triggers:
      all_of:
        - kind: alter_event
        - ddl.event.body_present: true

  - id: INFO-MYSQL-EVENT-ALTER
    risk_level: info
    message: "ALTER EVENT reconfigures a scheduled job (its schedule, enable state, name, or body). Verify the change is intended."
    triggers:
      all_of:
        - kind: alter_event

  - id: INFO-MYSQL-TRIGGER
    risk_level: info
    message: "CREATE TRIGGER defines code that runs automatically on every matching row event (INSERT / UPDATE / DELETE) on the target table, under the definer's privileges. A trigger is an automatic-execution and persistence surface — verify its body is intended. The body's statements are analyzed independently."
    triggers:
      all_of:
        - kind: create_mysql_trigger

  - id: MYSQL-TRIGGER-DEFINER
    risk_level: low
    message: "The trigger names an explicit DEFINER. Its body runs with that account's privileges on every matching row event, regardless of which user performs the write — a privilege-delegation and persistence surface (a trigger that re-grants privileges or exfiltrates on write executes unattended). Confirm the definer account's privilege level is appropriate. (Pin privileged-account names in policy via ddl.create_trigger.definer.user to raise the severity.)"
    triggers:
      all_of:
        - kind: create_mysql_trigger
        - ddl.create_trigger.definer.explicit: true

  - id: MYSQL-EVENT-DEFINER
    risk_level: low
    message: "The event names an explicit DEFINER. Its scheduled body runs with that account's privileges regardless of who created or triggers it, so the event is a privilege-delegation surface — a body that the definer is entitled to run executes unattended on schedule. Confirm the definer account's privilege level is appropriate for the body. (Pin the privileged-account names in policy via ddl.event.definer.user to raise the severity for sensitive definers.)"
    triggers:
      any_of:
        - all_of:
            - kind: create_event
            - ddl.event.definer.explicit: true
        - all_of:
            - kind: alter_event
            - ddl.event.definer.explicit: true

  - id: MYSQL-PROC-DEFINER
    risk_level: low
    message: "The stored procedure names an explicit DEFINER. Its body runs with that account's privileges regardless of which user calls it (MySQL SQL SECURITY DEFINER) — a privilege-delegation surface: a caller with EXECUTE can perform actions the definer is entitled to but they are not. Confirm the definer account's privilege level is appropriate for the body. (Pin privileged-account names in policy via ddl.procedure.definer.user to raise the severity.)"
    triggers:
      all_of:
        - kind: create_procedure
        - ddl.procedure.definer.explicit: true

  - id: MYSQL-FUNC-DEFINER
    risk_level: low
    message: "The stored function names an explicit DEFINER. Its body runs with that account's privileges regardless of which user invokes it (MySQL SQL SECURITY DEFINER) — a privilege-delegation surface: any query that calls the function executes the body under the definer's rights. Confirm the definer account's privilege level is appropriate for the body. (Pin privileged-account names in policy via ddl.function.definer.user to raise the severity.)"
    triggers:
      all_of:
        - kind: create_function
        - ddl.function.definer.explicit: true

  - id: MYSQL-VIEW-DEFINER
    risk_level: low
    message: "The view names an explicit DEFINER. Under SQL SECURITY DEFINER (the MySQL default), the view's query runs with that account's privileges regardless of who selects from it, so the view can expose rows the caller could not read directly — a privilege-delegation surface. Confirm the definer account's privilege level is appropriate. (Pin privileged-account names in policy via ddl.view.definer.user to raise the severity.)"
    triggers:
      all_of:
        - kind: create_view
        - ddl.view.definer.explicit: true

  - id: MYSQL-VIEW-SQL-SECURITY-DEFINER
    risk_level: low
    message: "The view explicitly declares SQL SECURITY DEFINER: its query runs with the definer account's privileges, not the caller's, so any user with SELECT on the view reads through the definer's rights and can see data they are not otherwise authorized for. Prefer SQL SECURITY INVOKER unless definer-rights access is intended and the definer is suitably constrained."
    triggers:
      all_of:
        - kind: create_view
        - ddl.view.sql_security: definer

  - id: PG-VIEW-SECINV-OFF
    risk_level: medium
    message: "The view explicitly sets security_invoker = false: its query runs with the view owner's privileges, and row-level security policies on the underlying tables are evaluated against the owner rather than the caller. Any user granted SELECT on the view reads through the owner's rights — the standard shape for exposing RLS-protected rows through a view. Set security_invoker = true unless owner-rights access is intended."
    triggers:
      all_of:
        - kind: create_view
        - ddl.view.security_invoker: false


  - id: MSSQL-POLYBASE-EXTERNAL-TABLE
    risk_level: low
    message: "PolyBase external table bound to an external data source. Querying it reaches data outside this database — a remote relational store, Hadoop, or blob/cloud storage — across the instance boundary through the named DATA_SOURCE. Verify the data source and its credentials are authorized."
    triggers:
      all_of:
        - kind: create_external_table
        - ddl.bq_options.options:
            exists:
              key.normalized: DATA_SOURCE

  - id: BQ-EXTTBL-AWS-LEAK
    risk_level: critical
    message: "Hardcoded AWS access key detected in CREATE EXTERNAL TABLE/SCHEMA. Use secure credential management instead."
    triggers:
      all_of:
        - kind: { in: [create_external_table, create_external_schema] }
        - any_of:
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "AKIA*" }
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "ASIA*" }

  - id: BQ-EXTTBL-PWD-LEAK
    risk_level: critical
    message: "Hardcoded password detected in CREATE EXTERNAL TABLE/SCHEMA. Use secure parameter passing instead."
    triggers:
      all_of:
        - kind: { in: [create_external_table, create_external_schema] }
        - any_of:
            - ddl.bq_options.options:
                exists:
                  key.normalized: PASSWORD
            - ddl.bq_options.all_literal_values:
                exists:
                  value: { matches: "*://*:*@*" }

  - id: BQ-EXTTBL-APIKEY-LEAK
    risk_level: critical
    message: "Hardcoded API key or access token detected in CREATE EXTERNAL TABLE/SCHEMA. Store API keys in secure secrets managers."
    triggers:
      all_of:
        - kind: { in: [create_external_table, create_external_schema] }
        - ddl.bq_options.options:
            exists:
              key.normalized:
                in: [API_KEY, APIKEY, ACCESS_TOKEN, SECRET_KEY]

  - id: BQ-EXTTBL-CONNSTR-LEAK
    risk_level: critical
    message: "Connection string with embedded credentials detected in CREATE EXTERNAL TABLE/SCHEMA. Use secure credential storage."
    triggers:
      all_of:
        - kind: { in: [create_external_table, create_external_schema] }
        - ddl.bq_options.all_literal_values:
            exists:
              value: { matches: "*://*:*@*" }


