rules:

  - id: GRT-WITH-OPT
    risk_level: high
    message: "Avoid WITH GRANT OPTION. This allows the grantee to re-grant privileges and can lead to privilege escalation."
    triggers:
      all_of:
        - kind: grant
        - privilege.with_grant_option: true

  - id: GRT-ALL-PRIV
    risk_level: high
    message: "Avoid GRANT ALL PRIVILEGES. Use specific privilege grants to follow the principle of least privilege."
    triggers:
      all_of:
        - kind: grant
        - privilege.all_privileges: true

  - id: GRT-TO-PUBLIC
    risk_level: critical
    message: "Avoid granting privileges to PUBLIC. The PUBLIC role includes all users in the account, which may expose data unintentionally."
    triggers:
      all_of:
        - kind: grant
        - privilege.grantees:
            exists:
              any_of:
                - name.normalized:
                    in: [PUBLIC, ALLUSERS, ALLAUTHENTICATEDUSERS]
                - name.raw:
                    in: ["'%'@'%'", "''@'%'"]

  - id: GRT-TO-SHARE
    risk_level: critical
    message: "Data sharing boundary crossed: granting to SHARE exposes data outside the account. Verify data classification and approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.grantees:
            exists:
              kind: share

  - id: GRT-OWNER-XFER
    risk_level: high
    message: "Ownership transfer detected. Verify approval and ensure proper access controls remain in place."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: ownership

  - id: SNW-GRT-PRIV-ROLE
    risk_level: critical
    message: "Privilege escalation detected: granting privileged system role. This gives full administrative control and should require explicit approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            count:
              eq: 0
        - privilege.all_privileges: false
        - privilege.target.kind: role
        - privilege.target.name.name.normalized:
            in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN]


  - id: GRT-SYSROLE-EXP
    risk_level: critical
    message: "Grant involves privileged system role (ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, PUBLIC). This has account-wide security implications."
    triggers:
      all_of:
        - kind: grant
        - privilege.role_grant_impact.inherited_privileges:
            gt: 0
        - any_of:
            - privilege.role_grant_impact.parent_role.normalized:
                in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]
            - privilege.role_grant_impact.child_role.normalized:
                in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]

  - id: GRT-ACCESS-EXP-HI
    risk_level: high
    message: "Role hierarchy change significantly expands effective access. Child role inherits 50+ privileges or affects 10+ users."
    triggers:
      all_of:
        - kind: grant
        - privilege.role_grant_impact.inherited_privileges:
            gt: 0
        - privilege.role_grant_impact.parent_role.normalized:
            not_in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]
        - privilege.role_grant_impact.child_role.normalized:
            not_in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]
        - any_of:
            - privilege.role_grant_impact.inherited_privileges:
                gte: 50
            - privilege.role_grant_impact.affected_users:
                gte: 10

  - id: GRT-ACCESS-EXP
    risk_level: medium
    message: "Role hierarchy change detected. Child role inherits privileges from parent role, affecting downstream roles and users."
    triggers:
      all_of:
        - kind: grant
        - privilege.role_grant_impact.inherited_privileges:
            gt: 0
        - privilege.role_grant_impact.parent_role.normalized:
            not_in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]
        - privilege.role_grant_impact.child_role.normalized:
            not_in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN, PUBLIC, "ACCOUNT ADMINS", "METASTORE ADMINS", "WORKSPACE ADMINS", ACCOUNT_ADMINS, METASTORE_ADMINS, WORKSPACE_ADMINS]
        - privilege.role_grant_impact.inherited_privileges:
            lt: 50
        - privilege.role_grant_impact.affected_users:
            lt: 10


  - id: GRT-BROAD-PRIV-HI
    risk_level: high
    message: "Object privilege grant affects 20+ users via role inheritance. Review if this access scope is intentional."
    triggers:
      all_of:
        - kind: grant
        - privilege.object_grant_impact.affected_users:
            gte: 20

  - id: GRT-BROAD-PRIV
    risk_level: medium
    message: "Broad privilege grant detected. Object privilege affects multiple roles and users via role inheritance."
    triggers:
      all_of:
        - kind: grant
        - privilege.object_grant_impact.total_roles_with_access:
            gte: 2
        - privilege.object_grant_impact.affected_users:
            gte: 1
        - privilege.object_grant_impact.affected_users:
            lt: 20


  - id: SHOW-GRANTS-PRIV-ROLE-RECON
    risk_level: low
    message: "SHOW GRANTS enumerates the privileges or members of a privileged system role. Mapping who holds — or what is held by — an admin role is a common precursor to privilege escalation; confirm the caller is authorized."
    triggers:
      all_of:
        - kind: show
        - ddl.show.grants.relation:
            in: [TO, OF]
        - ddl.show.grants.target_kind:
            in: [ROLE]
        - ddl.show.grants.name:
            in: [ACCOUNTADMIN, SECURITYADMIN, SYSADMIN, USERADMIN, ORGADMIN]

  - id: SHOW-GRANTS-ON-ACCOUNT-RECON
    risk_level: low
    message: "SHOW GRANTS ON ACCOUNT enumerates every privilege granted at the account level — a broad inventory of account-wide access. Confirm the caller is authorized to enumerate account grants."
    triggers:
      all_of:
        - kind: show
        - ddl.show.grants.on_account: true

  - id: INFO-SHOW-SECURITY-SURFACE
    risk_level: info
    message: "SHOW enumerates a security-relevant object class (users, roles, policies, integrations, or secrets). Recorded for audit — metadata enumeration of the security surface can precede targeted access."
    triggers:
      all_of:
        - kind: show
        - ddl.show.object_class:
            in: [USERS, ROLES, MASKING_POLICIES, ROW_ACCESS_POLICIES, NETWORK_POLICIES, PASSWORD_POLICIES, SESSION_POLICIES, AUTHENTICATION_POLICIES, INTEGRATIONS, SECRETS]


  - id: PRIV-ON-FUTURE
    risk_level: medium
    message: "ON FUTURE grant expands to objects not yet created."
    triggers:
      privilege.on_future: true


  - id: DBX-GRT-CAT-ALLPRIV
    risk_level: critical
    message: "GRANT ALL PRIVILEGES ON CATALOG detected. This grants every privilege on the entire Unity Catalog namespace — including all schemas, tables, views, and volumes within it. Use fine-grained grants (e.g., USE CATALOG, CREATE SCHEMA) instead."
    triggers:
      all_of:
        - kind: grant
        - privilege.all_privileges: true
        - privilege.target.kind: catalog

  - id: DBX-GRT-CAT-MANAGE
    risk_level: critical
    message: "GRANT MANAGE ON CATALOG detected. MANAGE provides broad administrative control over Unity Catalog objects and permissions. Verify this grant is explicitly approved."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: manage
        - privilege.target.kind: catalog

  - id: DBX-GRT-CAT-MODIFY
    risk_level: critical
    message: "GRANT MODIFY ON CATALOG detected. MODIFY in Databricks combines INSERT, UPDATE, and DELETE privileges on ALL current and future tables in the catalog. This is equivalent to granting full DML on every table. Use schema- or table-level grants instead."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: modify
        - privilege.target.kind: catalog

  - id: DBX-GRT-SCHEMA-MANAGE
    risk_level: high
    message: "GRANT MANAGE ON SCHEMA detected. MANAGE allows delegated privilege administration within the schema. Ensure least-privilege scope and approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: manage
        - privilege.target.kind: schema

  - id: DBX-GRT-SCHEMA-MODIFY
    risk_level: high
    message: "GRANT MODIFY ON SCHEMA detected. MODIFY combines INSERT, UPDATE, and DELETE on all current and future tables in the schema. Verify this scope is intended."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: modify
        - any_of:
            - privilege.target.kind: schema
            - privilege.target_plural_kind: schema

  - id: DBX-GRT-VOL-MANAGE
    risk_level: high
    message: "GRANT MANAGE ON VOLUME detected. This enables broad administration over Unity Catalog volume access and metadata. Verify governance intent."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: manage
        - privilege.target.kind: volume

  - id: DBX-GRT-EXTUSE-LOC
    risk_level: critical
    message: "GRANT EXTERNAL USE LOCATION detected. This allows temporary credential vending for external processing engines to access Unity Catalog external locations. CRITICAL data exfiltration risk — ALL PRIVILEGES intentionally excludes this privilege."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: external_use_location

  - id: DBX-GRT-EXTUSE-SCHEMA
    risk_level: critical
    message: "GRANT EXTERNAL USE SCHEMA detected. This allows temporary credential vending for external engines to access tables via Iceberg REST APIs. CRITICAL data exfiltration risk — ALL PRIVILEGES intentionally excludes this privilege."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: external_use_schema

  - id: DBX-GRT-EXTLOC-WRFILES
    risk_level: high
    message: "GRANT WRITE FILES detected. This allows direct writes to cloud object storage configured as an external location. Databricks recommends using WRITE VOLUME instead for governed access."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: write_files

  - id: DBX-GRT-EXTLOC-RDFILES
    risk_level: medium
    message: "GRANT READ FILES detected. This allows direct reads from cloud object storage configured as an external location. Databricks recommends using READ VOLUME instead for governed access."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: read_files

  - id: DBX-GRT-CRED-CREATE
    risk_level: high
    message: "GRANT CREATE STORAGE CREDENTIAL detected. This allows the grantee to create new cloud storage credentials in the metastore — a highly privileged infrastructure operation."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: create_storage_credential

  - id: DBX-GRT-EXTLOC-CREATE
    risk_level: high
    message: "GRANT CREATE EXTERNAL LOCATION detected. This allows the grantee to map new cloud storage paths into Unity Catalog — a privileged infrastructure operation."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: create_external_location

  - id: DBX-GRT-SHARE-SETPERM
    risk_level: high
    message: "GRANT SET SHARE PERMISSION detected. Combined with USE SHARE and USE RECIPIENT, this enables the grantee to share data with external organizations via Delta Sharing. Verify data-sharing authorization."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            contains: set_share_permission

  - id: DBX-RVK-CAT-ALLPRIV
    risk_level: high
    message: "REVOKE ALL PRIVILEGES ON CATALOG detected. This can immediately remove broad access and disrupt workloads. Verify blast radius and rollout timing."
    triggers:
      all_of:
        - kind: revoke
        - privilege.all_privileges: true
        - privilege.target.kind: catalog

  - id: DBX-RVK-CAT-MANAGE
    risk_level: medium
    message: "REVOKE MANAGE ON CATALOG detected. Catalog-level administrative control is being removed from a principal. Verify this is expected and staged to avoid operational disruption."
    triggers:
      all_of:
        - kind: revoke
        - privilege.privileges:
            contains: manage
        - privilege.target.kind: catalog

  - id: MSSQL-GRT-CONTROL-SERVER
    risk_level: critical
    message: "GRANT CONTROL SERVER detected. This confers full administrative control over the entire SQL Server instance — equivalent to sysadmin membership. Require explicit approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [CONTROL SERVER]

  - id: MSSQL-GRT-IMPERSONATE-ANY-LOGIN
    risk_level: critical
    message: "GRANT IMPERSONATE ANY LOGIN detected. The grantee can assume the identity of any server login, enabling full privilege escalation. Require explicit approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [IMPERSONATE ANY LOGIN]

  - id: MSSQL-GRT-IMPERSONATE
    risk_level: high
    message: "GRANT IMPERSONATE detected. The grantee can execute statements as another principal, which can bypass intended access boundaries. Verify scope and approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [IMPERSONATE]

  - id: MSSQL-GRT-SERVER-ADMIN
    risk_level: high
    message: "GRANT of a server-administration permission detected (ALTER ANY LOGIN / SERVER ROLE / CREDENTIAL / DATABASE, or ALTER SERVER STATE). These confer broad instance-level control. Verify least-privilege scope and approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in:
                  - ALTER ANY LOGIN
                  - ALTER ANY SERVER ROLE
                  - ALTER ANY CREDENTIAL
                  - ALTER ANY DATABASE
                  - ALTER SERVER STATE

  - id: MSSQL-GRT-UNSAFE-ASSEMBLY
    risk_level: high
    message: "GRANT of UNSAFE ASSEMBLY or EXTERNAL ACCESS ASSEMBLY detected. This permits loading CLR assemblies that can run arbitrary native or OS-level code. Require explicit approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [UNSAFE ASSEMBLY, EXTERNAL ACCESS ASSEMBLY]

  - id: MSSQL-GRT-TAKE-OWNERSHIP
    risk_level: high
    message: "GRANT TAKE OWNERSHIP detected. The grantee can seize ownership of the securable and thereby gain full control over it. Verify approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [TAKE OWNERSHIP]

  - id: MSSQL-GRT-CONTROL-DATABASE
    risk_level: high
    message: "GRANT CONTROL ON DATABASE detected. CONTROL at the database level grants all permissions on the database and every object in it — effectively db_owner. Verify scope and approval."
    triggers:
      all_of:
        - kind: grant
        - privilege.target.kind: database
        - privilege.privileges:
            exists:
              other.normalized:
                in: [CONTROL]

  - id: MSSQL-GRT-CONTROL-SCHEMA
    risk_level: medium
    message: "GRANT CONTROL ON SCHEMA detected. CONTROL at the schema level grants all permissions on every object in the schema. Verify scope."
    triggers:
      all_of:
        - kind: grant
        - privilege.target.kind: schema
        - privilege.privileges:
            exists:
              other.normalized:
                in: [CONTROL]

  - id: MSSQL-GRT-VIEW-DEFINITION-STATE
    risk_level: medium
    message: "GRANT of a broad metadata-visibility permission detected (VIEW ANY DATABASE / VIEW SERVER STATE / VIEW ANY DEFINITION). This exposes instance-wide metadata or runtime state. Verify intent."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [VIEW ANY DATABASE, VIEW SERVER STATE, VIEW ANY DEFINITION]

  - id: MSSQL-GRT-TRACE-BULK
    risk_level: medium
    message: "GRANT ALTER TRACE or ADMINISTER BULK OPERATIONS detected. These enable instance-level tracing or bulk data loading that can bypass intended access controls. Verify intent."
    triggers:
      all_of:
        - kind: grant
        - privilege.privileges:
            exists:
              other.normalized:
                in: [ALTER TRACE, ADMINISTER BULK OPERATIONS]

  - id: MSSQL-GRT-TO-GUEST
    risk_level: medium
    message: "GRANT to the guest user detected. The guest account is available to any login without an explicit database user; granting it permissions broadens access unexpectedly. Verify intent."
    triggers:
      all_of:
        - kind: grant
        - privilege.grantees:
            exists:
              name.normalized:
                in: [GUEST]


  - id: CRED-AWS-LEAK
    risk_level: critical
    message: "Hardcoded AWS credentials detected (access key ID, secret access key, or session token). Never commit credentials to source code. Use secure parameter passing, secrets managers, or storage integrations instead."
    triggers:
      any_of:
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.credentials:
                exists:
                  all_of:
                    - key.normalized:
                        in: [AWS_KEY_ID, AWS_ACCESS_KEY_ID, ACCESS_KEY_ID]
                    - any_of:
                        - value_literal:
                            matches: "AKIA*"
                        - value_literal:
                            matches: "ASIA*"
        # Secret half of AWS credentials — keyed by name, not value shape.
        # Owned here (not CRED-PWD-LEAK) so an AWS key-ID + secret pair is a
        # single AWS finding, not a double-count. Placeholder dummies downgrade
        # to CRED-DUMMY-VALUE. This arm defines the shared dummy-value list.
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.credentials:
                exists:
                  all_of:
                    - key.normalized:
                        in: [AWS_SECRET_KEY, AWS_SECRET_ACCESS_KEY, SECRET_ACCESS_KEY, AWS_TOKEN, SESSION_TOKEN]
                    - value_literal:
                        exists: true
                    - value_literal:
                        not_in: &cred_dummy_values
                          - ""
                          - REPLACE_ME
                          - replace_me
                          - CHANGEME
                          - changeme
                          - CHANGE_ME
                          - change_me
                          - PLACEHOLDER
                          - placeholder
                          - TODO
                          - todo
                          - DUMMY
                          - dummy
                          - XXX
                          - xxx
                          - TBD
                          - tbd
        - all_of:
            - kind:
                in: [create_storage_credential, alter_storage_credential]
            - any_of:
                - ddl.storage_credential.provider.all_literal_values:
                    exists:
                      value:
                        matches: "AKIA*"
                - ddl.storage_credential.provider.all_literal_values:
                    exists:
                      value:
                        matches: "ASIA*"

  - id: CRED-PWD-LEAK
    risk_level: critical
    message: "Hardcoded password detected in SQL. Use secure parameter passing (e.g., :password_param) or secrets management instead of literal passwords."
    triggers:
      any_of:
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.credentials:
                exists:
                  all_of:
                    # Only genuine passwords here. AWS key material →
                    # CRED-AWS-LEAK; Azure/GCP/token/symmetric keys and OAuth
                    # secrets → CRED-APIKEY-LEAK. One secret, one finding.
                    - key.normalized:
                        in: [PASSWORD]
                    - value_literal:
                        exists: true
                    - value_literal:
                        not_in: *cred_dummy_values
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.url_literal:
                matches: "*://*:*@*"
        - all_of:
            - kind:
                in: [create_storage_credential, alter_storage_credential]
            - ddl.storage_credential.provider.variant.kind: azure_service_principal
            - ddl.storage_credential.provider.variant.client_secret:
                exists: true
        - all_of:
            - kind:
                in: [create_storage_credential, alter_storage_credential]
            - ddl.storage_credential.provider.variant.kind: cloudflare_api_token
            - ddl.storage_credential.provider.variant.secret_access_key:
                exists: true
        - all_of:
            - kind: create_storage_credential
            - ddl.storage_credential.comment:
                matches: "*://*:*@*"
        - all_of:
            - any_of:
                - kind: create_user
                - kind: create_role
                - kind: alter_user
                - kind: alter_role
                - kind: mssql_create_login
                - kind: mssql_create_user
                - kind: mssql_alter_login
            - ddl.principal.password_literal:
                exists: true
            - ddl.principal.password_literal:
                not_in: *cred_dummy_values
        - all_of:
            - any_of:
                - kind: mssql_create_security_object
                - kind: mssql_alter_security_object
            - any_of:
                - all_of:
                    - security_object.password_literal:
                        exists: true
                    - security_object.password_literal:
                        not_in: *cred_dummy_values
                - all_of:
                    - security_object.secret_literal:
                        exists: true
                    - security_object.secret_literal:
                        not_in: *cred_dummy_values
        - all_of:
            - kind:
                in: [create_user_mapping, alter_user_mapping]
            - ddl.user_mapping.options:
                exists:
                  all_of:
                    - key.normalized:
                        in: [PASSWORD, SSLPASSWORD, SECRET]
                    - value_literal:
                        exists: true
                    - value_literal:
                        not_in: *cred_dummy_values

  - id: CRED-APIKEY-LEAK
    risk_level: critical
    message: "Hardcoded API key, token, or cloud secret detected (API key, access token, OAuth client secret, or cloud-storage secret key). Store secrets in a secrets manager or storage integration, not in SQL code."
    triggers:
      any_of:
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.credentials:
                exists:
                  all_of:
                    - key.normalized:
                        in: [API_KEY, APIKEY, ACCESS_TOKEN, SECRET_KEY, AZURE_SAS_TOKEN, AZURE_ACCOUNT_KEY, GCP_PRIVATE_KEY, MASTER_SYMMETRIC_KEY]
                    - value_literal:
                        exists: true
                    - value_literal:
                        not_in: *cred_dummy_values
        # OAuth client secret on a security integration — an application secret,
        # not a password (moved here from CRED-PWD-LEAK for an accurate label).
        - all_of:
            - kind:
                in: [create_security_integration, alter_security_integration]
            - integration.variant.set_properties:
                exists:
                  all_of:
                    - name: OAUTH_CLIENT_SECRET
                    - value_normalized:
                        exists: true
                    - value_normalized:
                        not_in: *cred_dummy_values
        - all_of:
            - kind:
                in: [create_storage_credential, alter_storage_credential]
            - ddl.storage_credential.provider.variant.kind: cloudflare_api_token
            - ddl.storage_credential.provider.variant.access_key_id:
                exists: true

  - id: MYSQL-INTO-OUTFILE
    risk_level: high
    message: "SELECT writes its result set to a file on the database server (`INTO OUTFILE` / `INTO DUMPFILE`). This requires the FILE privilege, bypasses result-set access controls, and is a common data-exfiltration and file-drop channel; the written file is owned by the server process and readable outside the database. Export through an audited pipeline (mysqldump, replication, or an ETL job) instead of server-side file writes."
    triggers:
      all_of:
        - query.file_exports:
            exists: true

  - id: MSSQL-OPENROWSET-INLINE-CRED
    risk_level: critical
    message: "OPENROWSET called with an inline connection string containing credentials. T-SQL `OPENROWSET('provider', 'Server=...;PWD=...', ...)` exposes the password in the SQL text and reaches an arbitrary external server. Use a linked-server with stored credentials, or a SQL Server credential object, not inline connection strings."
    triggers:
      all_of:
        - query.openrowset_calls:
            exists:
              string_args:
                exists:
                  any_of:
                    - value:
                        matches: "*PWD=*"
                    - value:
                        matches: "*Password=*"
                    - value:
                        matches: "*PASSWORD=*"

  - id: MSSQL-OPENDATASOURCE-INLINE-CRED
    risk_level: critical
    message: "OPENDATASOURCE called with an inline connection string containing credentials. T-SQL `OPENDATASOURCE('provider', 'Data Source=...;Password=...').db.schema.table` is ad-hoc remote access that exposes the password in the SQL text and reaches an arbitrary external server. Use a linked server with stored credentials, or a SQL Server credential object, not inline connection strings."
    triggers:
      all_of:
        - query.opendatasource_calls:
            exists:
              string_args:
                exists:
                  any_of:
                    - value:
                        matches: "*PWD=*"
                    - value:
                        matches: "*Password=*"
                    - value:
                        matches: "*PASSWORD=*"

  - id: CRED-CONNSTR-LEAK
    risk_level: critical
    message: "Connection string with embedded credentials detected (user:password@host). Use secure credential storage instead of embedding credentials in URLs."
    triggers:
      any_of:
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.url_literal:
                matches: "*://*:*@*"
        - all_of:
            - kind:
                in: [create_storage_credential, alter_storage_credential]
            - ddl.storage_credential.provider.all_literal_values:
                exists:
                  value:
                    matches: "*://*:*@*"
        - all_of:
            - kind: create_storage_credential
            - ddl.storage_credential.comment:
                matches: "*://*:*@*"

  # The info-level landing spot for values the CRED-* critical rules
  # exclude as placeholder-convention dummies (*cred_dummy_values): the
  # value is not a live secret, but the property is still wired for one.
  - id: CRED-DUMMY-VALUE
    risk_level: info
    message: "Credential property is set to a placeholder-style dummy value (empty or REPLACE_ME-style) — not a live secret. Replace it with secure parameter passing or a managed secret before this runs."
    triggers:
      any_of:
        - all_of:
            - kind:
                in: [create_stage, alter_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
            - ddl.stage.credentials:
                exists:
                  all_of:
                    - key.normalized:
                        in:
                          - PASSWORD
                          - AWS_SECRET_KEY
                          - AWS_SECRET_ACCESS_KEY
                          - SECRET_ACCESS_KEY
                          - AWS_TOKEN
                          - SESSION_TOKEN
                          - MASTER_SYMMETRIC_KEY
                          - AZURE_SAS_TOKEN
                          - AZURE_ACCOUNT_KEY
                          - GCP_PRIVATE_KEY
                          - API_KEY
                          - APIKEY
                          - ACCESS_TOKEN
                          - SECRET_KEY
                          - AWS_KEY_ID
                          - AWS_ACCESS_KEY_ID
                          - ACCESS_KEY_ID
                    - value_literal:
                        in: *cred_dummy_values
        - all_of:
            - any_of:
                - kind: create_user
                - kind: create_role
                - kind: alter_user
                - kind: alter_role
                - kind: mssql_create_login
                - kind: mssql_create_user
                - kind: mssql_alter_login
            - ddl.principal.password_literal:
                in: *cred_dummy_values
        - all_of:
            - any_of:
                - kind: mssql_create_security_object
                - kind: mssql_alter_security_object
            - any_of:
                - security_object.password_literal:
                    in: *cred_dummy_values
                - security_object.secret_literal:
                    in: *cred_dummy_values
        - all_of:
            - kind:
                in: [create_user_mapping, alter_user_mapping]
            - ddl.user_mapping.options:
                exists:
                  all_of:
                    - key.normalized:
                        in: [PASSWORD, SSLPASSWORD, SECRET]
                    - value_literal:
                        in: *cred_dummy_values
        - all_of:
            - kind:
                in: [create_security_integration, alter_security_integration]
            - integration.variant.set_properties:
                exists:
                  all_of:
                    - name: OAUTH_CLIENT_SECRET
                    - value_normalized:
                        in: *cred_dummy_values

  # Shape rule, independent of the value: inline CREDENTIALS=(...) is the
  # embedded-auth pattern even when the value is injected at deploy time.
  # ALTER STAGE is deliberately absent — SNW-STG-CRED-CHG (high) already
  # owns credential changes on an existing stage.
  - id: CRED-INLINE-AUTH
    risk_level: low
    message: "Authentication is embedded inline via CREDENTIALS=(...). Even with injected values, inline auth bypasses the platform's managed mechanism — prefer a storage integration (Snowflake) or an attached IAM role (Redshift) so credentials never travel through SQL text."
    triggers:
      all_of:
        - kind:
            in: [create_stage, copy_into_location, copy_into_table, redshift_unload, redshift_copy]
        - ddl.stage.credentials:
            count:
              gt: 0

  - id: DBX-CRED-NEW
    risk_level: medium
    message: "Storage credential created. This grants cloud storage access (e.g., IAM role, service account) to Unity Catalog. Verify the credential is authorized and follows least-privilege principles."
    triggers:
      kind: create_storage_credential

  - id: DBX-CRED-OWNER-CHG
    risk_level: high
    message: "Storage credential ownership transferred. The new owner gains full control over cloud storage access. Verify this transfer is authorized."
    triggers:
      all_of:
        - kind: alter_storage_credential
        - ddl.storage_credential.actions:
            exists:
              kind: owner_to

  - id: DBX-CRED-NAME-CHG
    risk_level: medium
    message: "Storage credential renamed. External locations referencing the old name may need to be updated."
    triggers:
      all_of:
        - kind: alter_storage_credential
        - ddl.storage_credential.actions:
            exists:
              kind: rename_to


  - id: SNW-STG-CRED-CHG
    risk_level: high
    message: "Storage credentials changed on stage. Verify authorization and audit trail."
    triggers:
      all_of:
        - kind: alter_stage
        - ddl.stage.credentials:
            count:
              gt: 0


  - id: SNW-STG-ENC-OFF
    risk_level: critical
    message: "Encryption disabled on stage. This exposes data at rest to potential breaches."
    triggers:
      all_of:
        - kind:
            in: [create_stage, alter_stage]
        - ddl.stage.encryption_disabled: true

  - id: SNW-STG-ENC-ON
    risk_level: low
    message: "Encryption enabled on stage. Positive security signal."
    triggers:
      all_of:
        - kind:
            in: [create_stage, alter_stage]
        - ddl.stage.encryption_enabled: true


  - id: SNW-STG-INTG-CHG
    risk_level: medium
    message: "Storage integration changed on stage. Verify access controls."
    triggers:
      all_of:
        - kind: alter_stage
        - ddl.stage.set_storage_integration: true

  - id: SNW-STG-INTG-SET
    enabled: false
    risk_level: low
    message: "Storage integration set on stage. External storage access configured."
    triggers:
      all_of:
        - kind: alter_stage
        - ddl.stage.set_storage_integration: true


  - id: SNW-STG-TAG-SET
    risk_level: low
    message: "Tag set on stage. Positive governance signal for metadata tracking."
    triggers:
      all_of:
        - kind: alter_stage
        - ddl.stage.set_tag: true

  - id: SNW-STG-TAG-RMV
    risk_level: medium
    message: "Tag removed from stage. Verify governance metadata tracking is maintained."
    triggers:
      all_of:
        - kind: alter_stage
        - ddl.stage.unset_tag: true


  - id: SNW-STG-DROP
    risk_level: medium
    message: "DROP STAGE detected. Stage and any staged files will be removed."
    triggers:
      kind: drop_stage


  - id: SNW-EXPORT-UNBOUNDED
    risk_level: high
    message: "COPY INTO exports data to external location without filtering. Full table contents may be exposed."
    triggers:
      all_of:
        - kind: copy_into_location
        - ddl.stage.unbounded_export: true

  - id: SNW-EXPORT-CLASSIFIED
    risk_level: high
    message: "COPY INTO <location> unloads a classified column out of the warehouse with its value exposed (not masked or aggregated). Classified data crossing the egress boundary should be masked, tokenized, or access-restricted at the unload point. The classification can originate in another script (cross-script data flow)."
    triggers:
      all_of:
        - kind: copy_into_location
        - ddl.stage.exported_columns:
            exists:
              all_of:
                - taint_labels:
                    count: { gt: 0 }
                - value_exposure: { in: [value] }

  - id: SNW-COPY-ONERROR-LAX
    risk_level: medium
    message: "COPY INTO <table> with ON_ERROR = CONTINUE or SKIP_FILE silently skips rows or files that fail to load. Records can be dropped without raising an error — confirm partial loads are acceptable for the target table."
    triggers:
      all_of:
        - kind: copy_into_table
        - ddl.stage.copy_options:
            exists:
              all_of:
                - key.normalized: ON_ERROR
                - any_of:
                    - value.normalized: CONTINUE
                    - value.normalized:
                        matches: "SKIP_FILE*"

  - id: SNW-COPY-PURGE
    risk_level: medium
    message: "COPY INTO <table> with PURGE = TRUE deletes the source files from the stage after a successful load. The originals are then unrecoverable — verify the data landed in the target table before purging."
    triggers:
      all_of:
        - kind: copy_into_table
        - ddl.stage.copy_options:
            exists:
              all_of:
                - key.normalized: PURGE
                - value.normalized: "TRUE"


  - id: SNW-UNKNOWN
    risk_level: high
    message: "Unknown syntax detected. Cannot verify compliance for this statement. Review against latest Snowflake documentation."
    per_statement: true
    triggers:
      all_of:
        - kind:
            in: [create_stage, alter_stage]
        - ddl.stage.has_unknown_clauses: true


  - id: SNW-PWDPOL-NEW
    risk_level: medium
    message: "Password Policy created. Positive security signal - password controls in place."
    triggers:
      kind: create_password_policy

  - id: SNW-PWDPOL-MINLEN-CRIT
    risk_level: critical
    message: "Password Policy created with CRITICAL weak minimum length (<8 characters). This violates basic security standards."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.min_length:
            lt: 8

  - id: SNW-PWDPOL-MINLEN-WEAK
    risk_level: high
    message: "Password Policy created with weak minimum length (8-11 characters). CIS/CISA recommend ≥12 characters (NIST SP 800-63B requires ≥8)."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.min_length:
            range:
              low: 8
              high: 11

  - id: SNW-PWDPOL-MINLEN-CFG
    risk_level: low
    message: "Password Policy minimum length configured. Positive governance signal."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.min_length:
            gte: 12

  - id: SNW-PWDPOL-MAXLEN-LOW
    risk_level: medium
    message: "Password Policy has restrictive maximum length. Users cannot create long, complex passwords."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_length:
            lt: 32

  - id: SNW-PWDPOL-COMPLEX-WEAK
    risk_level: high
    message: "Password Policy created with weak complexity requirements (<2 character classes). Passwords may be easily guessable."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.complexity_classes:
            count:
              lt: 2

  - id: SNW-PWDPOL-COMPLEX-CFG
    risk_level: low
    message: "Password Policy complexity requirements configured. Positive governance signal."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.complexity_classes:
            count:
              gte: 2

  - id: SNW-PWDPOL-NOEXPIRY
    risk_level: critical
    message: "Password Policy created with NO expiration (PASSWORD_MAX_AGE_DAYS = 0). Passwords never expire."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_age_days: 0

  - id: SNW-PWDPOL-EXPIRY-LONG
    risk_level: high
    message: "Password Policy created with long expiration (>180 days). Consider shorter expiration period."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_age_days:
            gt: 180

  - id: SNW-PWDPOL-EXPIRY-STALE
    risk_level: medium
    message: "Password Policy has long expiration period (>=90 days). Passwords remain valid for extended periods."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_age_days:
            gt: 180

  - id: SNW-PWDPOL-EXPIRY-FAIR
    risk_level: low
    message: "Password Policy has moderate expiration period (30-89 days). Consider tighter expiration for sensitive environments."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_age_days:
            range:
              low: 91
              high: 180

  - id: SNW-PWDPOL-EXPIRY-CFG
    risk_level: low
    message: "Password Policy expiration configured. Passwords will expire per policy."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_age_days:
            range:
              low: 1
              high: 90

  - id: SNW-PWDPOL-RETRIES-HIGH
    risk_level: critical
    message: "Password Policy created with high max retries (>10). Account brute-force risk."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_retries:
            gt: 10

  - id: SNW-PWDPOL-RETRIES-CHG
    risk_level: high
    message: "Password Policy created with moderate max retries (6-10). Consider limiting to 5 or fewer."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.max_retries:
            range:
              low: 6
              high: 10

  - id: SNW-PWDPOL-LOCKOUT-SHORT
    risk_level: high
    message: "Password Policy created with short lockout time (<5 minutes). Account brute-force window too small."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.lockout_time_mins:
            lt: 5

  - id: SNW-PWDPOL-LOCKOUT-WEAK
    risk_level: medium
    message: "Password Policy has short lockout time (<5 minutes). Brute-force attacks have reduced penalty window."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.lockout_time_mins:
            lt: 5

  - id: SNW-PWDPOL-LOCKOUT-CFG
    risk_level: low
    message: "Password Policy lockout configured. Positive governance signal — brute-force protection active."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.lockout_time_mins:
            gte: 5

  - id: SNW-PWDPOL-NOHIST
    risk_level: high
    message: "Password Policy created with NO history (PASSWORD_HISTORY = 0). Users can reuse passwords immediately."
    triggers:
      all_of:
        - kind: create_password_policy
        - policy.variant.history: 0

  - id: SNW-PWDPOL-HIST-CFG
    risk_level: low
    message: "Password Policy history configured. Positive governance signal — password reuse prevented."
    triggers:
      all_of:
